<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orientador Educacional – Estudo para Concurso</title>
<style>
:root{
  --ace-primary:#9d174d;--ace-secondary:#be185d;--ciano:#ec4899;--azul:#f472b6;
  --bg:#fdf2f8;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#fce7f3;
  --shadow:0 2px 8px rgba(0,0,0,.08);--radius:12px;
}
[data-dark]{
  --bg:#0a0a0a;--card:#111;--text:#f0f0f0;--muted:#9ca3af;--border:#1f2937;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
header{background:linear-gradient(135deg,#500724,#9d174d,#be185d);padding:18px 20px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.hdr-row{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.badge{background:#fff2;color:#fff;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid #fff4;letter-spacing:.5px}
.hdr-titles h1{font-size:1.1rem;font-weight:700;color:#fff;line-height:1.2}
.hdr-titles p{font-size:.72rem;color:#fbcfe8;margin-top:2px}
.hdr-actions{margin-left:auto;display:flex;gap:8px}
.hdr-btn{background:#fff2;border:1px solid #fff3;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.75rem;transition:background .2s}
.hdr-btn:hover{background:#fff3}
.speed-group{display:flex;border:1px solid #fff3;border-radius:8px;overflow:hidden}
.speed-btn{background:#fff2;border:none;border-right:1px solid #fff3;color:#fff;padding:6px 9px;cursor:pointer;font-size:.72rem;font-weight:600;transition:background .2s}
.speed-btn:last-child{border-right:none}
.speed-btn:hover{background:#fff3}
.speed-btn.ativo{background:#fff4;font-weight:800}
.tabs-wrap{background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:72px;z-index:90}
.tabs{display:flex;gap:0;max-width:900px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s}
.tab.ativo{color:var(--ace-primary);border-bottom-color:var(--ace-primary)}
.tab:hover:not(.ativo){color:var(--ace-secondary)}
.content{max-width:900px;margin:0 auto;padding:16px}
.secao{display:none}.secao.ativa{display:block}
.disc-bloco{background:var(--card);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.disc-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:var(--ace-primary);color:#fff;font-weight:600;font-size:.9rem;user-select:none}
.disc-header:hover{opacity:.92}
.disc-header .arrow{transition:transform .3s;font-size:.8rem}
.disc-header.open .arrow{transform:rotate(180deg)}
.disc-topicos{display:none;padding:0}
.disc-topicos.open{display:block}
.topico-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.topico-item:last-child{border-bottom:none}
.freq-badge{font-size:.65rem;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap;margin-top:2px}
.freq-alto{background:#fce7f3;color:#9d174d}
.freq-medio{background:#fff7ed;color:#c2410c}
.freq-baixo{background:#fdf2f8;color:#be185d}
.topico-nome{font-weight:600;font-size:.85rem;margin-bottom:3px}
.topico-desc{font-size:.78rem;color:var(--muted);line-height:1.5}
.flash-ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.flash-ctrl select,.flash-ctrl button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);font-size:.82rem;cursor:pointer;background:var(--card);color:var(--text)}
.flash-ctrl button{background:var(--ace-primary);color:#fff;border:none;font-weight:600}
.flash-ctrl button:hover{background:var(--ace-secondary)}
.flash-prog{font-size:.8rem;color:var(--muted);margin-left:auto}
.flash-box{perspective:1000px;margin:0 auto 16px}
.flash-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash-inner.virado{transform:rotateY(180deg)}
.flash-frente,.flash-verso{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);backface-visibility:hidden;padding:32px 24px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.flash-verso{position:absolute;top:0;left:0;width:100%;transform:rotateY(180deg);background:linear-gradient(135deg,#500724,#9d174d)}
.flash-frente .label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flash-frente .termo{font-size:1.4rem;font-weight:700;color:var(--ace-primary)}
.flash-verso .label{font-size:.7rem;color:#fbcfe8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flash-verso .def{font-size:.88rem;color:#fff;line-height:1.6}
.flash-nav{display:flex;justify-content:center;gap:12px}
.flash-nav button{padding:9px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.82rem}
.btn-ant{background:var(--border);color:var(--text)}
.btn-prox{background:var(--ace-primary);color:#fff}
.btn-prox:hover{background:var(--ace-secondary)}
.mapa-filtros{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mapa-filtros button{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.78rem;cursor:pointer}
.mapa-filtros button.ativo{background:var(--ace-primary);color:#fff;border-color:var(--ace-primary)}
.mapa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mapa-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--ace-primary);cursor:pointer;transition:transform .15s}
.mapa-card:hover{transform:translateY(-2px)}
.mapa-card .mc-disc{font-size:.65rem;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.mapa-card .mc-nome{font-size:.82rem;font-weight:600;margin-bottom:4px}
.mapa-card .mc-freq{font-size:.65rem}
.quiz-ctrl{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.quiz-ctrl select{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.82rem}
.quiz-ctrl button{padding:8px 18px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.82rem}
.quiz-ctrl button:hover{background:var(--ace-secondary)}
.quiz-box{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.quiz-info{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.quiz-badge{padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
.qbadge-disc{background:#fce7f3;color:#9d174d}
.qbadge-num{background:#fdf2f8;color:#831843;border:1px solid var(--border)}
.qbadge-tema{background:#1b766c;color:#fff}
[data-dark] .qbadge-disc{background:#500724;color:#f9a8d4}
[data-dark] .qbadge-num{background:#500724;color:#f9a8d4}
[data-dark] .qbadge-tema{background:#0f4a44;color:#5eead4}
.quiz-pergunta{font-size:.95rem;font-weight:600;line-height:1.6;margin-bottom:16px}
.quiz-ops{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.quiz-op{padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.84rem;text-align:left;transition:background .15s,border-color .15s;display:flex;align-items:flex-start;gap:8px}
.quiz-op:hover:not(:disabled){background:#fce7f3;border-color:var(--ace-primary)}
.quiz-op.correta{background:#fce7f3;border-color:#9d174d;font-weight:600}
.quiz-op.errada{background:#fee2e2;border-color:#dc2626}
.quiz-explicacao{background:#fdf2f8;border-left:4px solid var(--ace-primary);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.82rem;line-height:1.6;margin-bottom:14px;display:none}
[data-dark] .quiz-explicacao{background:#500724}
.quiz-explicacao.show{display:block}
.quiz-nav{display:flex;gap:8px;flex-wrap:wrap}
.quiz-nav button{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.82rem;font-weight:600}
.btn-prox-q{background:var(--ace-primary);color:#fff}
.btn-prox-q:hover{background:var(--ace-secondary)}
.quiz-placar{text-align:center;padding:24px;display:none}
.quiz-placar.show{display:block}
.placar-num{font-size:3rem;font-weight:800;color:var(--ace-primary)}
.placar-label{color:var(--muted);font-size:.88rem;margin-bottom:16px}
.exames-lista{display:grid;gap:10px}
.exame-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.exame-info h3{font-size:.9rem;font-weight:700;margin-bottom:4px}
.exame-info p{font-size:.75rem;color:var(--muted)}
.btn-iniciar{padding:8px 18px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.82rem}
.btn-iniciar:hover{background:var(--ace-secondary)}
.exame-ativo{display:none}
.exame-ativo.show{display:block}
.ex-header{background:var(--ace-primary);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.ex-header h2{font-size:.95rem;font-weight:700}
.ex-header p{font-size:.75rem;color:#fbcfe8;margin-top:3px}
.ex-secao-label{font-size:.78rem;font-weight:700;color:var(--ace-primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.ex-pergunta{font-size:.9rem;font-weight:600;line-height:1.6;margin-bottom:14px}
.ex-ops{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.ex-op{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.82rem;text-align:left;transition:all .15s;display:flex;gap:8px;align-items:flex-start}
.ex-op:hover:not(:disabled){background:#fce7f3;border-color:var(--ace-primary)}
.ex-op.selecionada{background:#fce7f3;border-color:var(--ace-primary);font-weight:600}
.ex-op.correta{background:#fce7f3;border-color:#9d174d}
.ex-op.errada{background:#fee2e2;border-color:#dc2626}
.ex-explicacao{background:#fdf2f8;border-left:4px solid var(--ace-primary);padding:12px;border-radius:0 8px 8px 0;font-size:.8rem;line-height:1.6;margin-bottom:12px;display:none}
[data-dark] .ex-explicacao{background:#500724}
.ex-explicacao.show{display:block}
.ex-nav{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.ex-nav button{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600}
.audio-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:.82rem;color:var(--ace-primary);flex-shrink:0;transition:background .15s}
.audio-btn:hover{background:var(--border)}
.audio-btn-op{background:none;border:none;cursor:pointer;font-size:.78rem;padding:0 2px;opacity:.5;flex-shrink:0;transition:opacity .15s}
.audio-btn-op:hover{opacity:1}
.btn-ex-prox{background:var(--ace-primary);color:#fff}
.btn-ex-prox:hover{background:var(--ace-secondary)}
.btn-ex-voltar{background:var(--border);color:var(--text)}
.ex-resultado{display:none;text-align:center;padding:28px}
.ex-resultado.show{display:block}
.ex-res-num{font-size:3.5rem;font-weight:800;color:var(--ace-primary)}
.ex-res-label{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.relatorio-box{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.relatorio-box h3{font-size:.9rem;font-weight:700;margin-bottom:14px;color:var(--ace-primary)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border)}
.stat-num{font-size:1.8rem;font-weight:800;color:var(--ace-primary)}
.stat-label{font-size:.72rem;color:var(--muted);margin-top:2px}
.btn-exportar{padding:10px 20px;border-radius:8px;border:none;background:var(--ciano);color:#fff;font-weight:600;cursor:pointer;font-size:.84rem}
.btn-exportar:hover{opacity:.88}
.btn-limpar{padding:10px 20px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-weight:600;cursor:pointer;font-size:.84rem;margin-left:8px}
#toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;max-width:280px}
#toast.show{opacity:1}
[data-dark] .disc-topicos,.disc-topicos{background:var(--card)}
[data-dark] .quiz-op,[data-dark] .ex-op{background:var(--bg);color:var(--text)}
[data-dark] .freq-alto{background:#500724;color:#f9a8d4}
[data-dark] .freq-medio{background:#431407;color:#fdba74}
[data-dark] .freq-baixo{background:#500724;color:#f9a8d4}
@media(max-width:600px){
  .flash-frente .termo{font-size:1.1rem}
  .hdr-titles h1{font-size:.95rem}
  .tab{padding:10px 12px;font-size:.76rem}
}
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <span class="badge">OE</span>
    <div class="hdr-titles">
      <h1>Orientador Educacional</h1>
      <p>Língua Portuguesa · Informática · Conhecimentos Específicos</p>
    </div>
    <div class="hdr-actions">
      <div class="speed-group">
        <button class="speed-btn ativo" onclick="setSpeed(1,this)">1×</button>
        <button class="speed-btn" onclick="setSpeed(1.5,this)">1.5×</button>
        <button class="speed-btn" onclick="setSpeed(2,this)">2×</button>
      </div>
      <button class="hdr-btn" onclick="toggleDark()">🌙</button>
      <button class="hdr-btn" onclick="falarCard()">🔊</button>
    </div>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs">
    <div class="tab ativo" onclick="mudarTab('resumo',this)">📚 Resumo</div>
    <div class="tab" onclick="mudarTab('flash',this)">🃏 Flashcards</div>
    <div class="tab" onclick="mudarTab('mapa',this)">🗺️ Mapa</div>
    <div class="tab" onclick="mudarTab('quiz',this)">❓ Quiz</div>
    <div class="tab" onclick="mudarTab('simulados',this)">📝 Simulados</div>
    <div class="tab" onclick="mudarTab('relatorio',this)">📊 Relatório</div>
  </div>
</div>

<div class="content">

  <div id="sec-resumo" class="secao ativa"></div>

  <div id="sec-flash" class="secao">
    <div class="flash-ctrl">
      <select id="flash-filtro" onchange="filtrarFlash()">
        <option value="todos">Todas as disciplinas</option>
      </select>
      <button onclick="shuffleFlash()">🔀 Embaralhar</button>
      <span class="flash-prog" id="flash-prog"></span>
    </div>
    <div class="flash-box" style="width:100%">
      <div class="flash-inner" id="flash-inner" onclick="virarCard()">
        <div class="flash-frente" id="flash-frente">
          <div class="label">TERMO</div>
          <div class="termo" id="flash-termo"></div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:16px">Clique para ver a definição</div>
        </div>
        <div class="flash-verso" id="flash-verso">
          <div class="label">DEFINIÇÃO</div>
          <div class="def" id="flash-def"></div>
        </div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="btn-ant" onclick="navFlash(-1)">← Anterior</button>
      <button class="btn-prox" onclick="navFlash(1)">Próximo →</button>
    </div>
  </div>

  <div id="sec-mapa" class="secao">
    <div class="mapa-filtros" id="mapa-filtros"></div>
    <div class="mapa-grid" id="mapa-grid"></div>
  </div>

  <div id="sec-quiz" class="secao">
    <div class="quiz-ctrl">
      <select id="quiz-filtro">
        <option value="todos">Todas as disciplinas</option>
        <option value="Português">Língua Portuguesa</option>
        <option value="Informática">Conhecimentos em Informática</option>
        <option value="Específicos">Conhecimentos Específicos</option>
      </select>
      <button onclick="iniciarQuiz()">▶ Iniciar Quiz</button>
    </div>
    <div class="quiz-box" id="quiz-box" style="display:none">
      <div class="quiz-info">
        <span class="quiz-badge qbadge-disc" id="q-disc"></span>
        <span class="quiz-badge qbadge-tema" id="q-tema"></span>
        <span class="quiz-badge qbadge-num" id="q-num"></span>
      </div>
      <div class="quiz-pergunta" id="q-pergunta"></div>
      <div class="quiz-ops" id="q-ops"></div>
      <div class="quiz-explicacao" id="q-exp"></div>
      <div class="quiz-nav">
        <button class="btn-prox-q" id="btn-prox-q" onclick="proximaQuestao()" style="display:none">Próxima →</button>
      </div>
    </div>
    <div class="quiz-placar" id="quiz-placar">
      <div class="placar-num" id="placar-num"></div>
      <div class="placar-label" id="placar-label"></div>
      <button onclick="iniciarQuiz()" style="padding:10px 24px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.85rem">Novo Quiz</button>
    </div>
  </div>

  <div id="sec-simulados" class="secao">
    <div id="exames-lista" class="exames-lista"></div>
    <div id="exame-ativo" class="exame-ativo">
      <div class="ex-header">
        <h2 id="ex-titulo"></h2>
        <p id="ex-info"></p>
      </div>
      <div id="ex-corpo">
        <div class="ex-secao-label" id="ex-sec-label"></div>
        <div class="ex-pergunta" id="ex-pergunta"></div>
        <div class="ex-ops" id="ex-ops"></div>
        <div class="ex-explicacao" id="ex-exp"></div>
        <div class="ex-nav">
          <button class="btn-ex-voltar" onclick="voltarExames()">← Sair</button>
          <button class="btn-ex-prox" id="btn-ex-prox" onclick="avancarExame()">Próxima →</button>
        </div>
      </div>
      <div class="ex-resultado" id="ex-resultado">
        <div class="ex-res-num" id="ex-res-num"></div>
        <div class="ex-res-label" id="ex-res-label"></div>
        <button onclick="voltarExames()" style="padding:10px 24px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer">Voltar</button>
      </div>
    </div>
  </div>

  <div id="sec-relatorio" class="secao">
    <div class="relatorio-box">
      <h3>📊 Estatísticas Gerais</h3>
      <div class="stats-grid" id="stats-grid"></div>
      <button class="btn-exportar" onclick="exportarTXT()">⬇ Exportar TXT</button>
      <button class="btn-limpar" onclick="limparDados()">🗑 Limpar Dados</button>
    </div>
    <div class="relatorio-box" id="horario-box"></div>
  </div>

</div>

<div id="toast"></div>

<script>
const disciplinas = [
  {
    nome:"📖 Língua Portuguesa",
    cor:"linear-gradient(135deg,#9d174d,#be185d)",
    topicos:[
      {t:"Interpretação de Texto",d:"Intelecção de textos denotativos e/ou conotativos. Intertextualidade: diálogo entre textos distintos. Identificar tema, ideia central, inferências e recursos argumentativos.",freq:"alto"},
      {t:"Ortografia e Acentuação",d:"Acentuação gráfica e prosódica. Ortografia segundo o novo acordo ortográfico (2009). Regras de acentuação de oxítonas, paroxítonas e proparoxítonas.",freq:"alto"},
      {t:"Uso da Crase",d:"Regras obrigatórias, proibidas e facultativas do uso da crase. Locução prepositiva + artigo feminino. Casos especiais com pronomes e palavras no plural.",freq:"alto"},
      {t:"Pontuação",d:"Uso da vírgula, ponto e vírgula, dois pontos, travessão, reticências e parênteses. Separação de adjunto adverbial deslocado, aposto e orações intercaladas.",freq:"medio"},
      {t:"Morfologia – Classes Gramaticais",d:"Classes variáveis: artigo, adjetivo, numeral, pronome, substantivo e verbo. Classes invariáveis: advérbio, conjunção, preposição e interjeição. Funções e flexões.",freq:"medio"},
      {t:"Sintaxe e Concordância",d:"Concordância verbal e nominal. Sujeito simples, composto, oculto e indeterminado. Termos da oração: essenciais, integrantes e acessórios. Frase, oração e período.",freq:"alto"},
      {t:"Colocação Pronominal e Regência",d:"Próclise, mesóclise e ênclise. Regência verbal: verbos que exigem preposição (obedecer a, assistir a, aspirar a). Regência nominal. Casos de crase.",freq:"medio"},
      {t:"Período Composto",d:"Coordenação: orações sindéticas (aditivas, adversativas, alternativas, conclusivas, explicativas) e assindéticas. Subordinação: substantivas, adjetivas e adverbiais.",freq:"medio"},

      {nome:'Língua Portuguesa (Q1–Q4)',qs:[
        {n:1,q:"'Conforme o planejado, o orientador realizou as visitas às turmas.' A palavra 'conforme' exerce a função de:",ops:["Preposição","Conjunção conformativa","Advérbio de modo","Pronome relativo"],g:1,exp:"'Conforme' introduz oração subordinada adverbial conformativa, indicando que a ação foi realizada de acordo com algo previsto."},
        {n:2,q:"Qual alternativa apresenta uso CORRETO do hífen?",ops:["Anti-inflamatório","Antiinflamatório","Anti inflamatório","Antiinflamatorio"],g:0,exp:"Usa-se hífen quando o segundo elemento começa com vogal idêntica à última letra do prefixo: anti + inflamatório = anti-inflamatório."},
        {n:3,q:"O sujeito da oração 'É preciso dialogar com os alunos' é:",ops:["os alunos","dialogar","É preciso","Sujeito inexistente (oração impessoal)"],g:3,exp:"A construção 'É preciso + infinitivo' forma uma oração impessoal — não há um ser que pratique a ação de 'ser preciso'."},
        {n:4,q:"Em 'Aspirei ao cargo de orientador', o verbo 'aspirar' está empregado no sentido de:",ops:["Inalar","Almejar/desejar","Limpar com aspirador","Respirar"],g:1,exp:"'Aspirar a' (com preposição) = almejar, desejar. 'Aspirar' (sem preposição) = inalar. A regência com 'a' distingue os dois sentidos."},
      ]},
      {nome:'Informática (Q5–Q7)',qs:[
        {n:5,q:"No MS-Excel, qual é o operador utilizado para concatenar (unir) textos em fórmulas?",ops:["+ (mais)","& (e comercial)","* (asterisco)","/ (barra)"],g:1,exp:"O operador & concatena textos no Excel. Exemplo: =A1&\" \"&B1 une o conteúdo de A1, um espaço e B1 em uma única célula."},
        {n:6,q:"Uma URL (Uniform Resource Locator) é:",ops:["Um tipo de vírus","O endereço de um recurso na internet","Um protocolo de e-mail","Um formato de arquivo de imagem"],g:1,exp:"A URL identifica e localiza um recurso na internet (página, arquivo, imagem), especificando o protocolo, domínio e caminho do recurso."},
        {n:7,q:"No MS-Word, 'controle de alterações' serve para:",ops:["Desfazer todas as alterações","Rastrear e revisar modificações feitas no documento por diferentes autores","Bloquear a edição do arquivo","Salvar automaticamente"],g:1,exp:"Controle de Alterações (Revisão > Controlar Alterações) registra cada modificação com autor, data e tipo de mudança, essencial para revisão colaborativa."},
      ]},
      {nome:'Conhecimentos Específicos (Q8–Q10)',qs:[
        {n:8,q:"O Conselho de Classe tem como finalidade:",ops:["Apenas avaliar notas dos alunos","Analisar coletivamente o processo de ensino-aprendizagem e propor intervenções pedagógicas","Punir alunos com baixo rendimento","Substituir o PPP escolar"],g:1,exp:"O Conselho de Classe é um espaço coletivo de reflexão pedagógica que reúne professores, coordenação e orientação para analisar o processo educativo e propor ações de melhoria."},
        {n:9,q:"A articulação entre escola e família, no contexto da orientação educacional, visa principalmente:",ops:["Transferir a responsabilidade educativa para os pais","Construir parceria para apoio integral ao desenvolvimento do estudante","Fiscalizar a vida privada das famílias","Reduzir a autonomia dos alunos"],g:1,exp:"A parceria escola-família fortalece o processo educativo, pois cria uma rede de apoio consistente ao desenvolvimento acadêmico, emocional e social do estudante."},
        {n:10,q:"Segundo a BNCC, as competências socioemocionais devem ser desenvolvidas:",ops:["Apenas nas aulas de Educação Física","De forma transversal em todas as disciplinas e espaços educativos","Somente pelo orientador educacional","Exclusivamente no Ensino Médio"],g:1,exp:"A BNCC prevê o desenvolvimento de competências socioemocionais de forma transversal em toda a Educação Básica, integrando-se ao projeto pedagógico escolar."},
      ]},
    ]
  },
  {
    id:'sim5',titulo:'Simulado 5 – Completo (LP + Informática + Específicos)',banca:'Ação Bahia',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q4)',qs:[
        {n:1,q:"Assinale a alternativa em que a vírgula está empregada CORRETAMENTE:",ops:["Comprei cadernos, canetas e, borracha.","Os alunos, que estudaram, foram aprovados.","João, meu melhor aluno, passou no concurso.","Ela chegou, e saiu rapidamente."],g:2,exp:"Vírgula de aposto: 'meu melhor aluno' é um aposto explicativo de 'João' e deve ser isolado por vírgulas. Nas outras alternativas o uso da vírgula é incorreto."},
        {n:2,q:"Identifique a alternativa com par de PARÔNIMOS:",ops:["Escola / escolar","Descrição / discrição","Amor / desamor","Casa / casinha"],g:1,exp:"Parônimos são palavras de grafia e pronúncia semelhantes mas significados diferentes: 'descrição' (ato de descrever) e 'discrição' (qualidade de discreto)."},
        {n:3,q:"Na frase 'Vende-se imóvel', a voz verbal é:",ops:["Ativa","Passiva analítica","Passiva sintética","Reflexiva"],g:2,exp:"Passiva sintética (ou pronominal): formada com verbo na 3ª pessoa + pronome apassivador 'se'. Equivale a 'Um imóvel é vendido'."},
        {n:4,q:"'Embora estivesse cansado, o orientador atendeu todos os alunos.' A oração sublinhada é:",ops:["Coordenada sindética adversativa","Subordinada adverbial concessiva","Subordinada adverbial causal","Coordenada assindética"],g:1,exp:"A conjunção 'embora' + subjuntivo introduz oração subordinada adverbial concessiva: indica concessão, contraste com a ideia principal."},
      ]},
      {nome:'Informática (Q5–Q7)',qs:[
        {n:5,q:"No MS-Excel, qual função calcula a média aritmética de um intervalo?",ops:["=SOMA()","=MÉDIA()","=MED()","=MODO()"],g:1,exp:"=MÉDIA(intervalo) calcula a média aritmética. =MED() retorna a mediana (valor central) e =MODO() retorna o valor mais frequente."},
        {n:6,q:"No MS-Word, o recurso 'Localizar e Substituir' (Ctrl+H) serve para:",ops:["Salvar o documento em outro formato","Encontrar e trocar palavras ou trechos no documento","Verificar a ortografia","Inserir comentários"],g:1,exp:"Ctrl+H abre 'Localizar e Substituir', permitindo encontrar uma palavra/frase e substituí-la por outra em todo o documento de forma automática."},
        {n:7,q:"No MS-PowerPoint, 'animação' difere de 'transição' porque:",ops:["Animação muda o design do slide","Animação aplica efeitos a objetos dentro do slide; transição aplica efeito entre slides","Transição é mais rápida","São a mesma coisa"],g:1,exp:"Animação: efeitos aplicados a elementos (texto, imagem) dentro de um slide. Transição: efeito visual ao passar de um slide para o próximo."},
      ]},
      {nome:'Conhecimentos Específicos (Q8–Q10)',qs:[
        {n:8,q:"O orientador educacional deve participar do PPP escolar principalmente:",ops:["Apenas assinando o documento final","Na construção, implementação, acompanhamento e avaliação contínua","Somente na fase de avaliação","Apenas quando solicitado pela direção"],g:1,exp:"A participação do orientador no PPP é ativa e contínua nas quatro etapas: construção coletiva, implementação prática, acompanhamento dos resultados e avaliação periódica."},
        {n:9,q:"Qual das alternativas descreve corretamente a 'empatia' como habilidade socioemocional?",ops:["Capacidade de impor os próprios pontos de vista","Habilidade de compreender e compartilhar os sentimentos do outro","Ausência de emoções em situações de conflito","Obediência às regras sem questionamento"],g:1,exp:"Empatia é a capacidade de se colocar no lugar do outro, compreendendo suas emoções e perspectivas — fundamental para o trabalho do orientador educacional."},
        {n:10,q:"A indisciplina escolar deve ser compreendida pelo orientador como:",ops:["Apenas um problema de caráter do aluno","Um comportamento a punir sem investigação","Um sinal que pode indicar dificuldades emocionais, familiares ou pedagógicas","Uma questão exclusivamente da família"],g:2,exp:"A indisciplina pode ser um sinal de alerta para questões subjacentes: dificuldades de aprendizagem, problemas familiares, socioemocionais ou inadequação das práticas pedagógicas."},
      ]},
    ]
  },
  {
    id:'sim6',titulo:'Simulado 6 – Completo (LP + Informática + Específicos)',banca:'Ação Bahia',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q4)',qs:[
        {n:1,q:"Assinale a alternativa em que a concordância nominal está CORRETA:",ops:["As alunas ficaram satisfeito com o resultado.","Os professores estavam cansadas após a reunião.","As orientadoras ficaram satisfeitas com o PPP.","O grupo de alunos saíram cedo."],g:2,exp:"O adjetivo 'satisfeitas' concorda em gênero (feminino) e número (plural) com 'orientadoras'. Nas demais, há discordância entre substantivo e adjetivo."},
        {n:2,q:"'Ele assistiu o filme ontem.' Esta frase apresenta erro de:",ops:["Concordância verbal","Regência verbal","Ortografia","Colocação pronominal"],g:1,exp:"'Assistir' no sentido de ver/presenciar é verbo transitivo indireto: exige preposição 'a'. O correto é 'assistiu ao filme'."},
        {n:3,q:"Assinale a alternativa em que há METÁFORA:",ops:["Ela corre como o vento.","Seus olhos são estrelas no céu.","Mil pessoas compareceram ao evento.","O estudante leu o texto rapidamente."],g:1,exp:"'Seus olhos são estrelas' é metáfora: identifica implicitamente dois elementos diferentes sem usar 'como'. 'Corre como o vento' é comparação (uso de 'como')."},
        {n:4,q:"Na oração 'Os orientadores que se dedicam obtêm bons resultados', a oração 'que se dedicam' é:",ops:["Subordinada substantiva subjetiva","Subordinada adjetiva restritiva","Subordinada adverbial causal","Coordenada sindética aditiva"],g:1,exp:"'Que se dedicam' é oração subordinada adjetiva restritiva: introduzida pelo pronome relativo 'que', restringe o sentido do antecedente 'orientadores' (sem vírgula)."},
      ]},
      {nome:'Informática (Q5–Q7)',qs:[
        {n:5,q:"No MS-Word, 'recuo de parágrafo' serve para:",ops:["Alterar a fonte do texto","Definir o afastamento do texto em relação às margens da página","Inserir uma tabela","Numerar as páginas"],g:1,exp:"O recuo controla o afastamento horizontal do parágrafo em relação às margens. Pode ser recuo à esquerda, à direita, de primeira linha ou deslocado."},
        {n:6,q:"No MS-Windows, o gerenciador de tarefas (Ctrl+Alt+Del > Gerenciador de Tarefas) permite:",ops:["Instalar novos programas","Monitorar e encerrar processos e programas em execução","Formatar o disco rígido","Configurar a impressora"],g:1,exp:"O Gerenciador de Tarefas monitora o uso de CPU, memória e rede, além de permitir encerrar processos travados ou que consomem muitos recursos."},
        {n:7,q:"Ao anexar um arquivo em um e-mail, o usuário está:",ops:["Copiando o e-mail para outra pasta","Incluindo um arquivo para ser enviado junto com a mensagem","Encaminhando o e-mail para outro destinatário","Salvando o e-mail como rascunho"],g:1,exp:"Anexar (attach) significa incluir um arquivo (documento, imagem, planilha) junto à mensagem de e-mail para que o destinatário possa baixá-lo."},
      ]},
      {nome:'Conhecimentos Específicos (Q8–Q10)',qs:[
        {n:8,q:"O histórico da orientação educacional no Brasil tem origem associada a qual movimento?",ops:["Movimento escolanovista e à industrialização do país nas décadas de 1920-1930","Reforma universitária de 1968","Lei de Cotas de 2012","Criação do ENEM em 1998"],g:0,exp:"A orientação educacional surgiu no Brasil ligada ao movimento escolanovista e à necessidade de adaptar a educação às demandas da industrialização, nas décadas de 1920 e 1930."},
        {n:9,q:"Redes de apoio social e de saúde são acionadas pelo orientador quando:",ops:["O aluno apresenta dificuldades que ultrapassam a competência da escola","O aluno tira notas baixas em provas","A escola precisa de mais verbas","Os pais não comparecem às reuniões"],g:0,exp:"O orientador deve articular a escola com redes externas (CRAS, CAPS, UBS, Conselho Tutelar) quando as necessidades do aluno extrapolam as possibilidades de intervenção escolar."},
        {n:10,q:"Projetos de educação sexual na escola devem ser desenvolvidos com base em:",ops:["Apenas orientação religiosa","Informação científica, respeito à diversidade e promoção da saúde integral","Proibição de discussões sobre o tema","Responsabilidade exclusiva dos pais"],g:1,exp:"A educação sexual escolar deve ser laica, baseada em evidências científicas, respeitar a diversidade e promover a saúde integral dos estudantes, conforme orientações do MEC e da OMS."},
      ]},
    ]
  },
  {
    id:'sim7',titulo:'Simulado 7 – Conhecimentos Específicos (Nível Difícil)',banca:'Ação Bahia',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Fundamentos Históricos e Teóricos (Q1–Q10)',qs:[
        {n:1,q:"O Decreto-Lei nº 4.244/1942 (Lei Orgânica do Ensino Secundário) foi o primeiro instrumento legal a mencionar a orientação educacional no Brasil. Qual a denominação utilizada nesse decreto?",ops:["Orientação Pedagógica","Orientação Educativa","Orientação de Ensino","Conselho de Orientação Profissional"],g:1,exp:"O Decreto-Lei nº 4.244/1942 utilizou o termo 'Orientação Educativa', denominação original da área no Brasil, antes da consolidação do termo 'Orientação Educacional' nas décadas seguintes."},
        {n:2,q:"Na teoria do desenvolvimento ecológico de Urie Bronfenbrenner, o 'mesossistema' é definido como:",ops:["O ambiente imediato onde o indivíduo vive (família, escola)","As inter-relações ENTRE os microssistemas (ex.: relação família-escola)","As estruturas sociais amplas que influenciam indiretamente o desenvolvimento","As mudanças ao longo do tempo na vida do indivíduo"],g:1,exp:"O mesossistema representa as conexões e processos entre dois ou mais ambientes (microssistemas) nos quais a pessoa em desenvolvimento participa ativamente, como a articulação família-escola fundamental na orientação educacional."},
        {n:3,q:"O conceito de 'habitus' de Pierre Bourdieu aplicado à orientação educacional revela que:",ops:["A motivação intrínseca é o único fator determinante das trajetórias escolares","Disposições sociais incorporadas influenciam inconscientemente as escolhas e trajetórias educacionais dos estudantes","O currículo escolar determina completamente o sucesso dos alunos","A psicometria é o instrumento mais adequado para avaliar o potencial dos estudantes"],g:1,exp:"O 'habitus' bourdieusiano são disposições duráveis incorporadas pela experiência social que orientam percepções e práticas. No contexto escolar, explica como origem social e capital cultural influenciam trajetórias, essencial para o orientador compreender desigualdades educacionais."},
        {n:4,q:"Segundo Dan Olweus, pesquisador norueguês precursor nos estudos sobre bullying, para uma situação ser classificada como tal, são necessários TRÊS critérios. Assinale a alternativa que os lista corretamente:",ops:["Presença de adulto, registro em ata e punição disciplinar","Intencionalidade, repetição e desequilíbrio de poder entre agressor e vítima","Violência física, testemunhas e comunicação à direção","Conflito verbal, isolamento e diferença de idade"],g:1,exp:"Olweus (1993) definiu bullying por três critérios simultâneos: (1) comportamento INTENCIONAL de causar dano; (2) REPETIÇÃO ao longo do tempo; (3) DESEQUILÍBRIO DE PODER entre as partes. A ausência de qualquer um desses elementos descaracteriza o bullying."},
        {n:5,q:"A abordagem centrada na pessoa (ACP) de Carl Rogers, aplicada à orientação educacional, fundamenta-se no tripé:",ops:["Autoridade, disciplina e avaliação contínua","Empatia, congruência (autenticidade) e aceitação incondicional positiva","Diagnóstico, intervenção e encaminhamento","Triagem, acompanhamento e relatório"],g:1,exp:"Rogers definiu três condições necessárias e suficientes para o crescimento: empatia (compreender o mundo interno do outro), congruência (autenticidade do orientador) e aceitação incondicional positiva (respeito sem julgamento). Essas condições criam o clima facilitador do desenvolvimento."},
        {n:6,q:"Donald Winnicott propôs o conceito de 'objeto transicional' e 'espaço potencial'. No contexto da orientação escolar, o 'espaço potencial' pode ser compreendido como:",ops:["A sala física destinada ao atendimento do orientador","O espaço simbólico de confiança e criatividade onde o aluno pode se expressar autenticamente sem ameaça ao self","O intervalo entre as aulas dedicado ao lazer","O período de transição entre o fundamental e o médio"],g:1,exp:"O 'espaço potencial' winnicottiano é uma área intermediária de experiência, entre a realidade interna e externa, onde a criatividade e o brincar ocorrem. Na orientação, traduz-se como o setting relacional onde o aluno se sente seguro para explorar a própria identidade."},
        {n:7,q:"A 'violência simbólica', conceito de Bourdieu e Passeron em 'A Reprodução' (1970), é relevante para o orientador educacional porque:",ops:["Explica apenas episódios de violência física documentada nas escolas","Revela como a escola reproduz e legitima desigualdades sociais por meio de mecanismos sutis de dominação cultural, naturalizando a exclusão","Define o uso de punições simbólicas no regimento escolar","Refere-se exclusivamente a conflitos entre corpo docente e direção"],g:1,exp:"A violência simbólica opera pela internalização das relações de dominação como naturais e legítimas. A escola, ao impor arbitrários culturais dominantes como universais, contribui para a reprodução das desigualdades — o orientador deve identificar e questionar esses mecanismos."},
        {n:8,q:"Na teoria da autodeterminação (Deci e Ryan), os três componentes psicológicos básicos que sustentam a motivação intrínseca são:",ops:["Recompensa, punição e reforço","Autonomia, competência e pertencimento (vínculo)","Obediência, disciplina e rendimento","Cognição, afeto e comportamento"],g:1,exp:"A teoria da autodeterminação (SDT) postula que os seres humanos têm três necessidades psicológicas básicas inatas: autonomia (agir por iniciativa própria), competência (sentir-se eficaz) e pertencimento (vínculos relacionais significativos). O orientador deve criar condições que satisfaçam essas necessidades."},
        {n:9,q:"O modelo ecológico de prevenção ao uso de drogas nas escolas, baseado na perspectiva de saúde pública, distingue-se de modelos tradicionais por:",ops:["Focar exclusivamente na abstinência como meta única","Atuar em múltiplos níveis (indivíduo, família, escola, comunidade e políticas públicas) com estratégias de redução de riscos","Priorizar a punição dos usuários como estratégia preventiva","Encaminhar imediatamente todos os envolvidos para tratamento médico compulsório"],g:1,exp:"O modelo ecológico compreende o uso de drogas como fenômeno multideterminado. A intervenção multinível aborda fatores de risco e proteção em todos os sistemas — do individual ao macrossocial — superando a visão punitiva ou informacional isolada."},
        {n:10,q:"A 'teoria do apego' de John Bowlby tem implicações diretas para a orientação educacional porque:",ops:["Explica apenas o comportamento de bebês nos primeiros meses de vida","Os padrões de apego formados na infância influenciam a qualidade dos vínculos escolares, a regulação emocional e a resposta ao estresse acadêmico","Define como os professores devem disciplinar os alunos","Fundamenta a avaliação psicométrica de inteligência"],g:1,exp:"Bowlby demonstrou que os padrões de apego (seguro, ansioso, evitativo, desorganizado) formados com os cuidadores primários se generalizam para outras relações. Na escola, alunos com apego inseguro tendem a apresentar dificuldades relacionais e maior vulnerabilidade — o orientador pode atuar como 'figura de apego secundária'."},
      ]},
      {nome:'Legislação, PPP e Gestão Educacional (Q11–Q20)',qs:[
        {n:11,q:"O art. 12, inciso VI, da LDB (Lei nº 9.394/96) determina que os estabelecimentos de ensino devem:",ops:["Contratar obrigatoriamente um orientador educacional por turno","Articular-se com as famílias e a comunidade, criando processos de integração da sociedade com a escola","Elaborar o PPP sem participação externa para garantir autonomia","Manter registro psicológico de todos os alunos"],g:1,exp:"A LDB, em seu art. 12, VI, obriga os estabelecimentos de ensino a articular-se com famílias e comunidade, integrando a sociedade à escola — atribuição diretamente relacionada ao trabalho do orientador educacional na construção de redes de apoio."},
        {n:12,q:"Segundo a Resolução CNE/CEB nº 7/2010, que fixa as Diretrizes Curriculares Nacionais para o Ensino Fundamental de 9 anos, o projeto político-pedagógico:",ops:["Deve ser elaborado exclusivamente pela equipe gestora sem participação da comunidade escolar","Constitui instrumento de gestão e orientação do trabalho escolar, expressando a identidade educativa da instituição e devendo ser construído coletivamente","É documento optativo que pode ser substituído pelo regimento interno","Deve seguir modelo único definido pelo MEC para todo o território nacional"],g:1,exp:"A Resolução CNE/CEB nº 7/2010 reforça que o PPP é instrumento identitário e de gestão construído coletivamente, que deve refletir as especificidades da comunidade escolar — sua construção participativa é condição de legitimidade."},
        {n:13,q:"O Conselho de Classe PRELIMINAR (ou Pré-Conselho) distingue-se do Conselho Parcial e do Final porque:",ops:["Ocorre no final do ano letivo com atribuição das menções finais","Acontece antes do início do período letivo, com finalidade diagnóstica e de planejamento coletivo","É convocado apenas para decidir sobre reprovação de alunos","Reúne exclusivamente pais e alunos, sem participação dos professores"],g:1,exp:"O Conselho Preliminar tem caráter diagnóstico e prospectivo: antecede o período letivo para o planejamento coletivo com base em dados anteriores. O Parcial acompanha o processo durante o ano; o Final delibera sobre aprovação/reprovação."},
        {n:14,q:"O art. 56 do ECA (Lei nº 8.069/90) estabelece que os dirigentes de estabelecimentos de ensino fundamental comunicarão ao Conselho Tutelar casos de:",ops:["Apenas evasão escolar comprovada após 30 dias","Maus-tratos envolvendo alunos, reiteração de faltas injustificadas e elevados níveis de repetência e evasão","Somente violência física com lesões documentadas","Problemas de aprendizagem sem diagnóstico médico"],g:1,exp:"O art. 56 do ECA cria obrigação legal dos dirigentes escolares de comunicar ao Conselho Tutelar: I – maus-tratos; II – faltas injustificadas reiteradas; III – elevados níveis de repetência. O não cumprimento constitui omissão passível de responsabilização."},
        {n:15,q:"A Lei nº 13.185/2015, que institui o Programa de Combate à Intimidação Sistemática (Bullying), define como atos de intimidação sistemática:",ops:["Qualquer briga ou conflito esporádico entre estudantes","Todo ato de violência física ou psicológica, intencional e repetitivo, sem motivação evidente, praticado por indivíduo ou grupo, em relação de desequilíbrio de poder","Apenas atos praticados em ambiente físico escolar, excluindo o ambiente virtual","Conflitos que envolvam exclusivamente agressão verbal"],g:1,exp:"A Lei 13.185/2015 define bullying como todo ato de violência (física ou psicológica), intencional, repetitivo, sem motivação evidente e com desequilíbrio de poder. A lei inclui o cyberbullying como modalidade e obriga as escolas a implementar ações de prevenção."},
        {n:16,q:"A Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva (MEC, 2008) estabelece que o Atendimento Educacional Especializado (AEE):",ops:["Substitui o ensino regular para alunos com deficiência severa","É complementar ou suplementar à formação dos estudantes, realizado preferencialmente no contraturno, em salas de recursos multifuncionais","Deve ser realizado exclusivamente em escolas especiais separadas","É obrigatório apenas para estudantes com deficiência visual e auditiva"],g:1,exp:"O AEE, conforme a PNEEPEI (2008), não substitui o ensino regular: é complementar (para deficiência) ou suplementar (para altas habilidades), realizado preferencialmente no contraturno em salas de recursos multifuncionais, garantindo acesso ao currículo comum."},
        {n:17,q:"A diferença funcional ESSENCIAL entre o orientador educacional e o coordenador pedagógico é:",ops:["O coordenador tem formação superior; o orientador pode ter formação técnica","O orientador foca no desenvolvimento integral e socioemocional do estudante e na articulação escola-família-comunidade; o coordenador articula o trabalho pedagógico-curricular dos professores","São funções equivalentes com denominações diferentes segundo o estado","O orientador atende os professores; o coordenador atende diretamente os alunos"],g:1,exp:"Embora complementares, as funções diferem: o orientador educacional centra-se no estudante como sujeito integral (desenvolvimento, socioemocional, articulação com família/rede), enquanto o coordenador pedagógico foca na formação docente e na implementação curricular."},
        {n:18,q:"O sigilo profissional na orientação educacional pode ser EXCEPCIONALMENTE quebrado quando:",ops:["Os pais legalmente responsáveis solicitarem todas as informações sobre o filho maior de 12 anos","Há risco concreto e iminente à integridade física ou psicológica do estudante ou de terceiros, tornando a proteção da vida um valor superior à confidencialidade","A direção da escola solicitar relatório detalhado para fins administrativos","O aluno apresenta desempenho insatisfatório consecutivo em avaliações"],g:1,exp:"O sigilo é princípio ético fundamental da orientação. Sua quebra é justificada eticamente apenas quando o sigilo colocaria em risco a integridade física ou psicológica do próprio sujeito ou de terceiros — situação de risco concreto e iminente sobrepõe-se à confidencialidade."},
        {n:19,q:"O art. 15 da LDB estabelece que as escolas públicas de educação básica terão:",ops:["Dependência total das decisões da Secretaria de Educação para garantir uniformidade","Progressivos graus de autonomia pedagógica e administrativa e de gestão financeira, observadas as normas gerais do direito financeiro","Gestão compartilhada obrigatoriamente com empresas privadas parceiras","Autonomia restrita exclusivamente a decisões sobre calendário escolar"],g:1,exp:"O art. 15 da LDB consagra a autonomia progressiva das escolas públicas nas dimensões pedagógica, administrativa e financeira. Essa autonomia é o fundamento da gestão democrática e da construção do PPP como instrumento identitário da escola."},
        {n:20,q:"A Lei nº 11.340/2006 (Lei Maria da Penha) tem implicações para a atuação do orientador educacional porque:",ops:["Aplica-se apenas ao contexto domiciliar, sem qualquer relação com o ambiente escolar","A escola é espaço privilegiado para identificação de sinais de violência doméstica e o orientador deve estar capacitado para acionar redes de proteção e apoio à estudante em situação de violência","É de competência exclusiva de delegacias especializadas em violência doméstica","A lei proíbe o orientador de intervir em situações de violência familiar por questões de privacidade"],g:1,exp:"A escola frequentemente é o primeiro espaço em que sinais de violência doméstica são identificados (mudanças comportamentais, marcas físicas, relatos). O orientador tem papel crucial na escuta qualificada, encaminhamento à rede de proteção (CREAS, DEAM, Conselho Tutelar) e apoio à estudante."},
      ]},
      {nome:'Práticas Avançadas e Casos Complexos (Q21–Q30)',qs:[
        {n:21,q:"Na teoria do desenvolvimento vocacional de Donald Super, o conceito de 'maturidade vocacional' refere-se a:",ops:["A escolha definitiva de uma profissão na adolescência","O grau em que o comportamento de desenvolvimento de carreira do indivíduo corresponde ao esperado para sua etapa de vida","A capacidade de exercer com êxito uma função profissional específica","A preferência por carreiras com maior remuneração"],g:1,exp:"Super (1957) definiu maturidade vocacional como a congruência entre o comportamento de desenvolvimento de carreira do indivíduo e o comportamento esperado para sua etapa de desenvolvimento. É um conceito processual: a escolha vocacional é contínua e evolutiva ao longo de toda a vida."},
        {n:22,q:"Em casos de suspeita fundada de abuso sexual envolvendo um estudante, o orientador educacional DEVE, como primeira e imediata ação:",ops:["Investigar detalhadamente o caso com entrevistas ao suposto agressor antes de qualquer comunicação","Comunicar imediatamente ao Conselho Tutelar e/ou ao sistema de garantia de direitos, preservando a proteção e a dignidade da criança ou adolescente","Aguardar confirmação médica e policial antes de acionar qualquer instância externa","Comunicar apenas à direção da escola e manter o caso interno para evitar exposição da família"],g:1,exp:"O art. 245 do ECA tipifica como infração o não comunicado por profissionais de educação. Diante de suspeita fundada de abuso, a comunicação imediata ao Conselho Tutelar é obrigação legal — a investigação compete às autoridades competentes, não à escola."},
        {n:23,q:"A mediação de conflitos escolares difere da arbitragem e da negociação direta porque:",ops:["A mediação é mais rápida e eficaz para conflitos físicos graves","Na mediação, um terceiro neutro (mediador) facilita o diálogo e a construção autônoma da solução pelas próprias partes, sem impor decisões","Na mediação, o mediador decide o resultado com base em regras preestabelecidas","A negociação direta requer sempre a presença de um adulto como árbitro"],g:1,exp:"Na mediação, o mediador não decide: facilita o diálogo para que as partes construam a própria solução. Na arbitragem, o árbitro decide. Na negociação direta, as partes dialogam sem intermediário. A mediação é preferida por promover autonomia e habilidades socioemocionais."},
        {n:24,q:"A 'evasão escolar' como fenômeno multideterminado deve ser compreendida pelo orientador a partir de:",ops:["Exclusivamente a decisão individual do aluno e da família","Fatores interativos: econômicos (trabalho infantil, pobreza), pedagógicos (reprovação, violência escolar), familiares (instabilidade) e sociais (território, violência urbana)","Unicamente problemas de aprendizagem não diagnosticados","Como responsabilidade exclusiva do aluno com histórico de indisciplina"],g:1,exp:"A evasão é fenômeno complexo e multicausal. Reduzir a um único fator distorce a análise e ineficácia as intervenções. O orientador deve mapear os múltiplos determinantes para propor intervenções articuladas com família, rede de proteção e políticas públicas."},
        {n:25,q:"A articulação intersetorial (escola + saúde + assistência social + justiça) realizada pelo orientador pressupõe o princípio de:",ops:["Que a escola deve resolver todos os problemas dos alunos de forma autossuficiente","Proteção integral do estudante como sujeito de direitos, reconhecendo que suas necessidades biopsicossociais extrapolam a competência exclusiva da escola","Transferência integral de responsabilidades da escola para outros setores","Que apenas casos com diagnóstico médico confirmado merecem encaminhamento intersetorial"],g:1,exp:"A articulação intersetorial fundamenta-se na proteção integral (ECA, art. 1º): a criança é sujeito de direitos cujo desenvolvimento pleno exige ação integrada de múltiplos setores. O orientador opera como articulador desta rede, sem abdicar da responsabilidade escolar."},
        {n:26,q:"Na abordagem da 'resiliência' em contexto escolar, o papel do orientador é fundamentalmente:",ops:["Identificar e remover todos os fatores de risco da vida do aluno","Fortalecer fatores de proteção (vínculos seguros, autoeficácia, habilidades socioemocionais) que permitam ao aluno adaptar-se positivamente às adversidades","Classificar os alunos em 'resilientes' e 'não resilientes' para encaminhamentos específicos","Garantir que o aluno não experiencie situações adversas durante o período escolar"],g:1,exp:"A resiliência não é ausência de adversidade, mas capacidade adaptativa construída socialmente. O orientador fortalece fatores protetores: vínculo escolar seguro, autoconhecimento, suporte familiar e redes de apoio — recursos que o aluno carrega consigo além da escola."},
        {n:27,q:"O conceito de 'zona de desenvolvimento proximal' (ZDP) de Vygotsky, quando aplicado à orientação educacional, implica que o orientador deve:",ops:["Trabalhar apenas com o que o aluno já sabe fazer de forma independente","Identificar o que o aluno pode alcançar com mediação qualificada e criar intervenções que operem nessa zona, expandindo o desenvolvimento potencial","Aguardar o desenvolvimento natural sem intervenção, respeitando o ritmo biológico","Comparar o aluno apenas com seus pares de mesma idade cronológica"],g:1,exp:"A ZDP define a distância entre o nível de desenvolvimento real (o que faz sozinho) e o potencial (o que faz com mediação). Intervir na ZDP é atuar onde o desenvolvimento está em curso — o orientador como mediador qualificado potencializa o crescimento do aluno."},
        {n:28,q:"A perspectiva da 'educação inclusiva' distingue-se da 'integração escolar' porque:",ops:["Educação inclusiva e integração são termos sinônimos na legislação brasileira","Na integração, o aluno se adapta à escola; na educação inclusiva, a escola se transforma para acolher todos os estudantes na sua diversidade","A integração oferece mais recursos especializados que a inclusão","A educação inclusiva se aplica apenas a alunos com deficiência; a integração é universal"],g:1,exp:"A integração é baseada no modelo médico: o aluno precisa se adaptar à escola existente. A educação inclusiva é baseada no modelo social: a escola deve se transformar para acolher a diversidade humana. É uma mudança paradigmática, não apenas terminológica."},
        {n:29,q:"Na orientação de alunos com TDAH, o orientador educacional deve compreender que a abordagem mais eficaz é:",ops:["Exclusivamente farmacológica, sendo a escola responsável apenas por encaminhar ao médico","Multimodal: combinando suporte pedagógico (adaptações, estratégias), intervenção comportamental, orientação familiar e, quando necessário, suporte clínico especializado","Baseada em punições consistentes para reduzir comportamentos hiperativos","Restrita ao encaminhamento para classe especial para evitar transtorno à turma regular"],g:1,exp:"O consenso científico internacional para TDAH indica abordagem multimodal: intervenção pedagógica (adaptações curriculares, estratégias de organização), suporte comportamental, psicoeducação familiar e, quando indicado, intervenção farmacológica — nunca isolada."},
        {n:30,q:"A construção da 'identidade profissional' do orientador educacional no Brasil foi historicamente marcada por tensão entre duas perspectivas. Qual par de perspectivas expressa corretamente essa tensão fundante?",ops:["Perspectiva burocrática vs. perspectiva informal","Perspectiva de ajustamento/controle social (adaptação do indivíduo ao sistema) vs. perspectiva emancipatória/transformadora (desenvolvimento crítico do sujeito)","Perspectiva médica vs. perspectiva jurídica","Perspectiva internacional vs. perspectiva nacional"],g:1,exp:"A história da orientação educacional no Brasil oscilou entre: a perspectiva liberal-funcionalista (ajustar o aluno ao sistema produtivo, herança dos anos 1940-60) e a perspectiva crítico-transformadora (influência de Paulo Freire e das pedagogias progressistas), que compreende o orientador como agente de emancipação e transformação social."},
      ]},
    ]
  },
];

const STORAGE_KEY = 'orientadorRespostas';
let flashDados=[], flashDeck=[], flashIdx=0;
let quizPerguntas=[], quizIdx=0, quizCertas=0, quizErradas=0, respondeu=false;
let exAtual=null, exSecAtual=0, exQAtual=0, exRespostas={}, exStarted=false;
let _speechRate=1;

window.addEventListener('DOMContentLoaded',()=>{
  buildFlashDados();
  renderResumo();
  renderFlashFiltro();
  renderFlash();
  renderMapa();
  renderExamesList();
  mostrarRelatorio();
  const dark = localStorage.getItem('orientadorDark');
  if(dark==='1') document.body.setAttribute('data-dark','');
});

function renderResumo(){
  const el = document.getElementById('sec-resumo');
  el.innerHTML = disciplinas.map((d,i)=>`
    <div class="disc-bloco">
      <div class="disc-header" onclick="toggleDisc(${i},this)" style="background:${d.cor}">
        ${d.nome} <span class="arrow">▼</span>
      </div>
      <div class="disc-topicos" id="disc-${i}">
        ${d.topicos.map(t=>`
          <div class="topico-item">
            <div style="flex:1">
              <div class="topico-nome">${t.t}</div>
              <div class="topico-desc">${t.d}</div>
            </div>
            <span class="freq-badge freq-${t.freq}">${t.freq.toUpperCase()}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleDisc(i,hdr){
  const el = document.getElementById('disc-'+i);
  const open = el.classList.toggle('open');
  hdr.classList.toggle('open',open);
}

function buildFlashDados(){
  flashDados=[];
  disciplinas.forEach(d=>{
    d.topicos.forEach(t=>{
      flashDados.push({disc:d.nome, termo:t.t, def:t.d, freq:t.freq});
    });
  });
  flashDeck=[...flashDados];
}

function renderFlashFiltro(){
  const sel = document.getElementById('flash-filtro');
  disciplinas.forEach(d=>{
    const op = document.createElement('option');
    op.value = d.nome;
    op.textContent = d.nome.replace(/^.{2}/,'');
    sel.appendChild(op);
  });
}

function filtrarFlash(){
  const v = document.getElementById('flash-filtro').value;
  flashDeck = v==='todos' ? [...flashDados] : flashDados.filter(f=>f.disc===v);
  flashIdx=0;
  renderFlash();
}

function shuffleFlash(){
  for(let i=flashDeck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [flashDeck[i],flashDeck[j]]=[flashDeck[j],flashDeck[i]];
  }
  flashIdx=0;
  document.getElementById('flash-inner').classList.remove('virado');
  renderFlash();
  toast('Embaralhado!');
}

function renderFlash(){
  if(!flashDeck.length) return;
  const c = flashDeck[flashIdx];
  document.getElementById('flash-termo').textContent = c.termo;
  document.getElementById('flash-def').textContent = c.def;
  document.getElementById('flash-prog').textContent = `${flashIdx+1} / ${flashDeck.length}`;
  document.getElementById('flash-inner').classList.remove('virado');
}

function virarCard(){
  document.getElementById('flash-inner').classList.toggle('virado');
}

function navFlash(d){
  flashIdx = (flashIdx+d+flashDeck.length)%flashDeck.length;
  renderFlash();
}

function falarCard(){
  const virado = document.getElementById('flash-inner').classList.contains('virado');
  const txt = virado ? document.getElementById('flash-def').textContent : document.getElementById('flash-termo').textContent;
  falar(txt);
}

function falar(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='pt-BR'; u.rate=_speechRate;
  speechSynthesis.speak(u);
}

function renderMapa(){
  const filtros = document.getElementById('mapa-filtros');
  const nomes = ['Todos',...disciplinas.map(d=>d.nome)];
  filtros.innerHTML = nomes.map((n,i)=>`<button class="${i===0?'ativo':''}" onclick="filtrarMapa(this,'${n}')">${n}</button>`).join('');
  _renderMapaGrid('Todos');
}

function filtrarMapa(btn,disc){
  document.querySelectorAll('.mapa-filtros button').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  _renderMapaGrid(disc);
}

function _renderMapaGrid(disc){
  const grid = document.getElementById('mapa-grid');
  let items=[];
  disciplinas.forEach(d=>{
    if(disc==='Todos'||d.nome===disc){
      d.topicos.forEach(t=>items.push({disc:d.nome,t}));
    }
  });
  grid.innerHTML = items.map(({disc,t})=>`
    <div class="mapa-card" onclick="toast('${t.t}')">
      <div class="mc-disc">${disc.replace(/^.{2}/,'')}</div>
      <div class="mc-nome">${t.t}</div>
      <span class="freq-badge freq-${t.freq} mc-freq">${t.freq.toUpperCase()}</span>
    </div>
  `).join('');
}

function iniciarQuiz(){
  const filtro = document.getElementById('quiz-filtro').value;
  let banco = filtro==='todos' ? [...questoes] : questoes.filter(q=>q.disc===filtro);
  for(let i=banco.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[banco[i],banco[j]]=[banco[j],banco[i]];}
  quizPerguntas = banco.slice(0,Math.min(10,banco.length));
  quizIdx=0; quizCertas=0; quizErradas=0; respondeu=false;
  document.getElementById('quiz-placar').classList.remove('show');
  document.getElementById('quiz-box').style.display='block';
  renderQuestao();
}

function renderQuestao(){
  if(quizIdx>=quizPerguntas.length){encerrarQuiz();return;}
  respondeu=false;
  const q = quizPerguntas[quizIdx];
  document.getElementById('q-disc').textContent = q.disc;
  document.getElementById('q-tema').textContent = q.tema || '';
  document.getElementById('q-tema').style.display = q.tema ? '' : 'none';
  document.getElementById('q-num').textContent = `${quizIdx+1}/${quizPerguntas.length}`;
  document.getElementById('q-pergunta').textContent = q.p;
  document.getElementById('q-exp').classList.remove('show');
  document.getElementById('btn-prox-q').style.display='none';
  const ops = document.getElementById('q-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="quiz-op" onclick="verificarResposta(${i})">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span> ${o}
    </button>
  `).join('');
}

function verificarResposta(idx){
  if(respondeu) return;
  respondeu=true;
  const q = quizPerguntas[quizIdx];
  const btns = document.querySelectorAll('.quiz-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.c) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  if(idx===q.c) quizCertas++; else quizErradas++;
  salvarRespostaQuiz(idx===q.c);
  document.getElementById('q-exp').textContent = q.exp;
  document.getElementById('q-exp').classList.add('show');
  document.getElementById('btn-prox-q').style.display='inline-block';
}

function proximaQuestao(){
  quizIdx++;
  renderQuestao();
}

function encerrarQuiz(){
  document.getElementById('quiz-box').style.display='none';
  const placar = document.getElementById('quiz-placar');
  placar.classList.add('show');
  const total = quizCertas+quizErradas;
  document.getElementById('placar-num').textContent = `${quizCertas}/${total}`;
  const pct = total?Math.round(quizCertas/total*100):0;
  document.getElementById('placar-label').textContent = `${pct}% de aproveitamento – ${quizCertas} certa(s), ${quizErradas} errada(s)`;
}

function salvarRespostaQuiz(acertou){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.quizTotal = (dados.quizTotal||0)+1;
  dados.quizCertas = (dados.quizCertas||0)+(acertou?1:0);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function renderExamesList(){
  const el = document.getElementById('exames-lista');
  el.innerHTML = EXAMES_DATA.map(e=>`
    <div class="exame-card">
      <div class="exame-info">
        <h3>${e.titulo}</h3>
        <p>${e.banca} · ${e.ano} · ${e.cargo}</p>
      </div>
      <button class="btn-iniciar" onclick="iniciarExame('${e.id}')">▶ Iniciar</button>
    </div>
  `).join('');
}

function iniciarExame(id){
  exAtual = EXAMES_DATA.find(e=>e.id===id);
  exSecAtual=0; exQAtual=0; exRespostas={}; exStarted=true;
  document.getElementById('exames-lista').style.display='none';
  const ativo = document.getElementById('exame-ativo');
  ativo.classList.add('show');
  document.getElementById('ex-titulo').textContent = exAtual.titulo;
  document.getElementById('ex-info').textContent = `${exAtual.banca} · ${exAtual.ano}`;
  document.getElementById('ex-resultado').classList.remove('show');
  document.getElementById('ex-corpo').style.display='block';
  renderQuestaoExame();
}

function renderQuestaoExame(){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  document.getElementById('ex-sec-label').textContent = sec.nome;

  const pergEl = document.getElementById('ex-pergunta');
  pergEl.innerHTML = `<div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
  pergEl.querySelector('span').textContent = `Q${q.n}. ${q.q}`;
  pergEl.querySelector('.audio-btn').addEventListener('click', ()=>falar(`Q${q.n}. ${q.q}`));

  document.getElementById('ex-exp').classList.remove('show');
  document.getElementById('btn-ex-prox').style.display='none';

  const ops = document.getElementById('ex-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="ex-op" data-idx="${i}">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span>
      <span style="flex:1"></span>
      <span class="audio-btn-op" data-audio="${i}" title="Ouvir alternativa">🔊</span>
    </button>
  `).join('');

  ops.querySelectorAll('.ex-op').forEach((btn, i)=>{
    btn.querySelector('span:nth-child(2)').textContent = q.ops[i];
    btn.addEventListener('click', (e)=>{
      if(e.target.classList.contains('audio-btn-op')) return;
      responderExame(i);
    });
    btn.querySelector('.audio-btn-op').addEventListener('click', (e)=>{
      e.stopPropagation();
      falar(q.ops[i]);
    });
  });
}

function responderExame(idx){
  const sec = exAtual.secoes[exSecAtual];
  const q = sec.qs[exQAtual];
  const key = `${exSecAtual}_${exQAtual}`;
  if(exRespostas[key]!==undefined) return;
  exRespostas[key]=idx;
  const btns = document.querySelectorAll('.ex-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.g) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  document.getElementById('ex-exp').textContent = q.exp;
  document.getElementById('ex-exp').classList.add('show');
  document.getElementById('btn-ex-prox').style.display='inline-block';
}

function avancarExame(){
  const sec = exAtual.secoes[exSecAtual];
  exQAtual++;
  if(exQAtual>=sec.qs.length){
    exSecAtual++;
    exQAtual=0;
    if(exSecAtual>=exAtual.secoes.length){finalizarExame();return;}
  }
  renderQuestaoExame();
}

function finalizarExame(){
  document.getElementById('ex-corpo').style.display='none';
  let total=0,certas=0;
  exAtual.secoes.forEach((s,si)=>{
    s.qs.forEach((q,qi)=>{
      total++;
      if(exRespostas[`${si}_${qi}`]===q.g) certas++;
    });
  });
  document.getElementById('ex-res-num').textContent = `${certas}/${total}`;
  const pct=Math.round(certas/total*100);
  document.getElementById('ex-res-label').textContent = `${pct}% de aproveitamento`;
  document.getElementById('ex-resultado').classList.add('show');
  salvarResultadoSimulado(certas,total);
}

function salvarResultadoSimulado(certas,total){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.simTotal = (dados.simTotal||0)+1;
  dados.simCertas = (dados.simCertas||0)+certas;
  dados.simQuestoes = (dados.simQuestoes||0)+total;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function voltarExames(){
  document.getElementById('exame-ativo').classList.remove('show');
  document.getElementById('exames-lista').style.display='grid';
  exAtual=null; exStarted=false;
}

function mostrarRelatorio(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0, qC=dados.quizCertas||0;
  const sT=dados.simTotal||0, sC=dados.simCertas||0, sQ=dados.simQuestoes||0;
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-num">${qT}</div><div class="stat-label">Quiz respondidas</div></div>
    <div class="stat-card"><div class="stat-num">${qT?Math.round(qC/qT*100):0}%</div><div class="stat-label">Acerto no Quiz</div></div>
    <div class="stat-card"><div class="stat-num">${sT}</div><div class="stat-label">Simulados feitos</div></div>
    <div class="stat-card"><div class="stat-num">${sQ?Math.round(sC/sQ*100):0}%</div><div class="stat-label">Acerto Simulados</div></div>
  `;
}

function exportarTXT(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0,qC=dados.quizCertas||0;
  const sT=dados.simTotal||0,sC=dados.simCertas||0,sQ=dados.simQuestoes||0;
  const txt=`RELATÓRIO – Orientador Educacional
Gerado em: ${new Date().toLocaleString('pt-BR')}

QUIZ
  Questões respondidas: ${qT}
  Acertos: ${qC} (${qT?Math.round(qC/qT*100):0}%)
  Erros: ${qT-qC}

SIMULADOS
  Simulados realizados: ${sT}
  Questões respondidas: ${sQ}
  Acertos: ${sC} (${sQ?Math.round(sC/sQ*100):0}%)

---
Bons estudos! 🌸
`;
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
  a.download='relatorio-orientador.txt';
  a.click();
  toast('Exportado com sucesso!');
}

function limparDados(){
  if(!confirm('Limpar todo o histórico de respostas?')) return;
  localStorage.removeItem(STORAGE_KEY);
  mostrarRelatorio();
  toast('Dados apagados!');
}

function mudarTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  el.classList.add('ativo');
  document.querySelectorAll('.secao').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('sec-'+id).classList.add('ativa');
  if(id==='relatorio') mostrarRelatorio();
}

function setSpeed(v, btn){
  _speechRate = v;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function toggleDark(){
  const dark = document.body.hasAttribute('data-dark');
  dark ? document.body.removeAttribute('data-dark') : document.body.setAttribute('data-dark','');
  localStorage.setItem('orientadorDark', dark?'0':'1');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
