<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orientador Educacional – Estudo para Concurso</title>
<style>
:root{
  --ace-primary:#9d174d;--ace-secondary:#be185d;--ciano:#ec4899;--azul:#f472b6;
  --bg:#fdf2f8;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#fce7f3;
  --shadow:0 2px 8px rgba(0,0,0,.08);--radius:12px;
}
[data-dark]{
  --bg:#0a0a0a;--card:#111;--text:#f0f0f0;--muted:#9ca3af;--border:#1f2937;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
header{background:linear-gradient(135deg,#500724,#9d174d,#be185d);padding:18px 20px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.hdr-row{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.badge{background:#fff2;color:#fff;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid #fff4;letter-spacing:.5px}
.hdr-titles h1{font-size:1.1rem;font-weight:700;color:#fff;line-height:1.2}
.hdr-titles p{font-size:.72rem;color:#fbcfe8;margin-top:2px}
.hdr-actions{margin-left:auto;display:flex;gap:8px}
.hdr-btn{background:#fff2;border:1px solid #fff3;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.75rem;transition:background .2s}
.hdr-btn:hover{background:#fff3}
.speed-group{display:flex;border:1px solid #fff3;border-radius:8px;overflow:hidden}
.speed-btn{background:#fff2;border:none;border-right:1px solid #fff3;color:#fff;padding:6px 9px;cursor:pointer;font-size:.72rem;font-weight:600;transition:background .2s}
.speed-btn:last-child{border-right:none}
.speed-btn:hover{background:#fff3}
.speed-btn.ativo{background:#fff4;font-weight:800}
.tabs-wrap{background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:72px;z-index:90}
.tabs{display:flex;gap:0;max-width:900px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s}
.tab.ativo{color:var(--ace-primary);border-bottom-color:var(--ace-primary)}
.tab:hover:not(.ativo){color:var(--ace-secondary)}
.content{max-width:900px;margin:0 auto;padding:16px}
.secao{display:none}.secao.ativa{display:block}
.disc-bloco{background:var(--card);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.disc-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:var(--ace-primary);color:#fff;font-weight:600;font-size:.9rem;user-select:none}
.disc-header:hover{opacity:.92}
.disc-header .arrow{transition:transform .3s;font-size:.8rem}
.disc-header.open .arrow{transform:rotate(180deg)}
.disc-topicos{display:none;padding:0}
.disc-topicos.open{display:block}
.topico-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.topico-item:last-child{border-bottom:none}
.freq-badge{font-size:.65rem;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap;margin-top:2px}
.freq-alto{background:#fce7f3;color:#9d174d}
.freq-medio{background:#fff7ed;color:#c2410c}
.freq-baixo{background:#fdf2f8;color:#be185d}
.topico-nome{font-weight:600;font-size:.85rem;margin-bottom:3px}
.topico-desc{font-size:.78rem;color:var(--muted);line-height:1.5}
.flash-ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.flash-ctrl select,.flash-ctrl button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);font-size:.82rem;cursor:pointer;background:var(--card);color:var(--text)}
.flash-ctrl button{background:var(--ace-primary);color:#fff;border:none;font-weight:600}
.flash-ctrl button:hover{background:var(--ace-secondary)}
.flash-prog{font-size:.8rem;color:var(--muted);margin-left:auto}
.flash-box{perspective:1000px;margin:0 auto 16px}
.flash-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash-inner.virado{transform:rotateY(180deg)}
.flash-frente,.flash-verso{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);backface-visibility:hidden;padding:32px 24px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.flash-verso{position:absolute;top:0;left:0;width:100%;transform:rotateY(180deg);background:linear-gradient(135deg,#500724,#9d174d)}
.flash-frente .label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flash-frente .termo{font-size:1.4rem;font-weight:700;color:var(--ace-primary)}
.flash-verso .label{font-size:.7rem;color:#fbcfe8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flash-verso .def{font-size:.88rem;color:#fff;line-height:1.6}
.flash-nav{display:flex;justify-content:center;gap:12px}
.flash-nav button{padding:9px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.82rem}
.btn-ant{background:var(--border);color:var(--text)}
.btn-prox{background:var(--ace-primary);color:#fff}
.btn-prox:hover{background:var(--ace-secondary)}
.mapa-filtros{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mapa-filtros button{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.78rem;cursor:pointer}
.mapa-filtros button.ativo{background:var(--ace-primary);color:#fff;border-color:var(--ace-primary)}
.mapa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mapa-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--ace-primary);cursor:pointer;transition:transform .15s}
.mapa-card:hover{transform:translateY(-2px)}
.mapa-card .mc-disc{font-size:.65rem;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.mapa-card .mc-nome{font-size:.82rem;font-weight:600;margin-bottom:4px}
.mapa-card .mc-freq{font-size:.65rem}
.quiz-ctrl{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.quiz-ctrl select{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.82rem}
.quiz-ctrl button{padding:8px 18px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.82rem}
.quiz-ctrl button:hover{background:var(--ace-secondary)}
.quiz-box{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.quiz-info{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.quiz-badge{padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
.qbadge-disc{background:#fce7f3;color:#9d174d}
.qbadge-num{background:#fdf2f8;color:#831843;border:1px solid var(--border)}
.qbadge-tema{background:#1b766c;color:#fff}
[data-dark] .qbadge-disc{background:#500724;color:#f9a8d4}
[data-dark] .qbadge-num{background:#500724;color:#f9a8d4}
[data-dark] .qbadge-tema{background:#0f4a44;color:#5eead4}
.quiz-pergunta{font-size:.95rem;font-weight:600;line-height:1.6;margin-bottom:16px}
.quiz-ops{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.quiz-op{padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.84rem;text-align:left;transition:background .15s,border-color .15s;display:flex;align-items:flex-start;gap:8px}
.quiz-op:hover:not(:disabled){background:#fce7f3;border-color:var(--ace-primary)}
.quiz-op.correta{background:#fce7f3;border-color:#9d174d;font-weight:600}
.quiz-op.errada{background:#fee2e2;border-color:#dc2626}
.quiz-explicacao{background:#fdf2f8;border-left:4px solid var(--ace-primary);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.82rem;line-height:1.6;margin-bottom:14px;display:none}
[data-dark] .quiz-explicacao{background:#500724}
.quiz-explicacao.show{display:block}
.quiz-nav{display:flex;gap:8px;flex-wrap:wrap}
.quiz-nav button{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.82rem;font-weight:600}
.btn-prox-q{background:var(--ace-primary);color:#fff}
.btn-prox-q:hover{background:var(--ace-secondary)}
.quiz-video{margin-top:14px}
.qvid-btn{background:#1b766c;color:#fff;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:.82rem;font-weight:600;margin-right:8px}
.qvid-btn:hover{background:#155e59}
.qvid-yt{font-size:.78rem;color:var(--muted);text-decoration:none}
.qvid-yt:hover{color:var(--ace-primary)}
.qvid-iframe{width:100%;height:280px;border:none;display:block;border-radius:12px;margin-top:10px}
.quiz-placar{text-align:center;padding:24px;display:none}
.quiz-placar.show{display:block}
.placar-num{font-size:3rem;font-weight:800;color:var(--ace-primary)}
.placar-label{color:var(--muted);font-size:.88rem;margin-bottom:16px}
.exames-lista{display:grid;gap:10px}
.exame-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.exame-info h3{font-size:.9rem;font-weight:700;margin-bottom:4px}
.exame-info p{font-size:.75rem;color:var(--muted)}
.btn-iniciar{padding:8px 18px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.82rem}
.btn-iniciar:hover{background:var(--ace-secondary)}
.exame-ativo{display:none}
.exame-ativo.show{display:block}
.ex-header{background:var(--ace-primary);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.ex-header h2{font-size:.95rem;font-weight:700}
.ex-header p{font-size:.75rem;color:#fbcfe8;margin-top:3px}
.ex-secao-label{font-size:.78rem;font-weight:700;color:var(--ace-primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.ex-pergunta{font-size:.9rem;font-weight:600;line-height:1.6;margin-bottom:14px}
.ex-ops{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.ex-op{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.82rem;text-align:left;transition:all .15s;display:flex;gap:8px;align-items:flex-start}
.ex-op:hover:not(:disabled){background:#fce7f3;border-color:var(--ace-primary)}
.ex-op.selecionada{background:#fce7f3;border-color:var(--ace-primary);font-weight:600}
.ex-op.correta{background:#fce7f3;border-color:#9d174d}
.ex-op.errada{background:#fee2e2;border-color:#dc2626}
.ex-explicacao{background:#fdf2f8;border-left:4px solid var(--ace-primary);padding:12px;border-radius:0 8px 8px 0;font-size:.8rem;line-height:1.6;margin-bottom:12px;display:none}
[data-dark] .ex-explicacao{background:#500724}
.ex-explicacao.show{display:block}
.ex-nav{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.ex-nav button{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600}
.audio-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:.82rem;color:var(--ace-primary);flex-shrink:0;transition:background .15s}
.audio-btn:hover{background:var(--border)}
.audio-btn-op{background:none;border:none;cursor:pointer;font-size:.78rem;padding:0 2px;opacity:.5;flex-shrink:0;transition:opacity .15s}
.audio-btn-op:hover{opacity:1}
.btn-ex-prox{background:var(--ace-primary);color:#fff}
.btn-ex-prox:hover{background:var(--ace-secondary)}
.btn-ex-voltar{background:var(--border);color:var(--text)}
.ex-resultado{display:none;text-align:center;padding:28px}
.ex-resultado.show{display:block}
.ex-res-num{font-size:3.5rem;font-weight:800;color:var(--ace-primary)}
.ex-res-label{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.relatorio-box{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.relatorio-box h3{font-size:.9rem;font-weight:700;margin-bottom:14px;color:var(--ace-primary)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border)}
.stat-num{font-size:1.8rem;font-weight:800;color:var(--ace-primary)}
.stat-label{font-size:.72rem;color:var(--muted);margin-top:2px}
.btn-exportar{padding:10px 20px;border-radius:8px;border:none;background:var(--ciano);color:#fff;font-weight:600;cursor:pointer;font-size:.84rem}
.btn-exportar:hover{opacity:.88}
.btn-limpar{padding:10px 20px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-weight:600;cursor:pointer;font-size:.84rem;margin-left:8px}
#toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;max-width:280px}
#toast.show{opacity:1}
[data-dark] .disc-topicos,.disc-topicos{background:var(--card)}
[data-dark] .quiz-op,[data-dark] .ex-op{background:var(--bg);color:var(--text)}
[data-dark] .freq-alto{background:#500724;color:#f9a8d4}
[data-dark] .freq-medio{background:#431407;color:#fdba74}
[data-dark] .freq-baixo{background:#500724;color:#f9a8d4}
@media(max-width:600px){
  .flash-frente .termo{font-size:1.1rem}
  .hdr-titles h1{font-size:.95rem}
  .tab{padding:10px 12px;font-size:.76rem}
}
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <span class="badge">OE</span>
    <div class="hdr-titles">
      <h1>Orientador Educacional</h1>
      <p>Língua Portuguesa · Informática · Conhecimentos Específicos</p>
    </div>
    <div class="hdr-actions">
      <div class="speed-group">
        <button class="speed-btn ativo" onclick="setSpeed(1,this)">1×</button>
        <button class="speed-btn" onclick="setSpeed(1.5,this)">1.5×</button>
        <button class="speed-btn" onclick="setSpeed(2,this)">2×</button>
      </div>
      <button class="hdr-btn" onclick="toggleDark()">🌙</button>
      <button class="hdr-btn" onclick="falarCard()">🔊</button>
    </div>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs">
    <div class="tab ativo" onclick="mudarTab('resumo',this)">📚 Resumo</div>
    <div class="tab" onclick="mudarTab('flash',this)">🃏 Flashcards</div>
    <div class="tab" onclick="mudarTab('mapa',this)">🗺️ Mapa</div>
    <div class="tab" onclick="mudarTab('quiz',this)">❓ Quiz</div>
    <div class="tab" onclick="mudarTab('simulados',this)">📝 Simulados</div>
    <div class="tab" onclick="mudarTab('relatorio',this)">📊 Relatório</div>
  </div>
</div>

<div class="content">

  <div id="sec-resumo" class="secao ativa"></div>

  <div id="sec-flash" class="secao">
    <div class="flash-ctrl">
      <select id="flash-filtro" onchange="filtrarFlash()">
        <option value="todos">Todas as disciplinas</option>
      </select>
      <button onclick="shuffleFlash()">🔀 Embaralhar</button>
      <span class="flash-prog" id="flash-prog"></span>
    </div>
    <div class="flash-box" style="width:100%">
      <div class="flash-inner" id="flash-inner" onclick="virarCard()">
        <div class="flash-frente" id="flash-frente">
          <div class="label">TERMO</div>
          <div class="termo" id="flash-termo"></div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:16px">Clique para ver a definição</div>
        </div>
        <div class="flash-verso" id="flash-verso">
          <div class="label">DEFINIÇÃO</div>
          <div class="def" id="flash-def"></div>
        </div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="btn-ant" onclick="navFlash(-1)">← Anterior</button>
      <button class="btn-prox" onclick="navFlash(1)">Próximo →</button>
    </div>
  </div>

  <div id="sec-mapa" class="secao">
    <div class="mapa-filtros" id="mapa-filtros"></div>
    <div class="mapa-grid" id="mapa-grid"></div>
  </div>

  <div id="sec-quiz" class="secao">
    <div class="quiz-ctrl">
      <select id="quiz-filtro">
        <option value="todos">Todas as disciplinas</option>
        <option value="Português">Língua Portuguesa</option>
        <option value="Informática">Conhecimentos em Informática</option>
        <option value="Específicos">Conhecimentos Específicos</option>
      </select>
      <button onclick="iniciarQuiz()">▶ Iniciar Quiz</button>
    </div>
    <div class="quiz-box" id="quiz-box" style="display:none">
      <div class="quiz-info">
        <span class="quiz-badge qbadge-disc" id="q-disc"></span>
        <span class="quiz-badge qbadge-tema" id="q-tema"></span>
        <span class="quiz-badge qbadge-num" id="q-num"></span>
      </div>
      <div class="quiz-pergunta" id="q-pergunta"></div>
      <div class="quiz-ops" id="q-ops"></div>
      <div class="quiz-explicacao" id="q-exp"></div>
      <div class="quiz-video" id="q-video-wrap" style="display:none"></div>
      <div class="quiz-nav">
        <button class="btn-prox-q" id="btn-prox-q" onclick="proximaQuestao()" style="display:none">Próxima →</button>
      </div>
    </div>
    <div class="quiz-placar" id="quiz-placar">
      <div class="placar-num" id="placar-num"></div>
      <div class="placar-label" id="placar-label"></div>
      <button onclick="iniciarQuiz()" style="padding:10px 24px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer;font-size:.85rem">Novo Quiz</button>
    </div>
  </div>

  <div id="sec-simulados" class="secao">
    <div id="exames-lista" class="exames-lista"></div>
    <div id="exame-ativo" class="exame-ativo">
      <div class="ex-header">
        <h2 id="ex-titulo"></h2>
        <p id="ex-info"></p>
      </div>
      <div id="ex-corpo">
        <div class="ex-secao-label" id="ex-sec-label"></div>
        <div class="ex-pergunta" id="ex-pergunta"></div>
        <div class="ex-ops" id="ex-ops"></div>
        <div class="ex-explicacao" id="ex-exp"></div>
        <div class="ex-nav">
          <button class="btn-ex-voltar" onclick="voltarExames()">← Sair</button>
          <button class="btn-ex-prox" id="btn-ex-prox" onclick="avancarExame()">Próxima →</button>
        </div>
      </div>
      <div class="ex-resultado" id="ex-resultado">
        <div class="ex-res-num" id="ex-res-num"></div>
        <div class="ex-res-label" id="ex-res-label"></div>
        <button onclick="voltarExames()" style="padding:10px 24px;border-radius:8px;border:none;background:var(--ace-primary);color:#fff;font-weight:600;cursor:pointer">Voltar</button>
      </div>
    </div>
  </div>

  <div id="sec-relatorio" class="secao">
    <div class="relatorio-box">
      <h3>📊 Estatísticas Gerais</h3>
      <div class="stats-grid" id="stats-grid"></div>
      <button class="btn-exportar" onclick="exportarTXT()">⬇ Exportar TXT</button>
      <button class="btn-limpar" onclick="limparDados()">🗑 Limpar Dados</button>
    </div>
    <div class="relatorio-box" id="horario-box"></div>
  </div>

</div>

<div id="toast"></div>

<script>
const disciplinas = [
  {
    nome:"📖 Língua Portuguesa",
    cor:"linear-gradient(135deg,#9d174d,#be185d)",
    topicos:[
      {t:"Interpretação de Texto",d:"Intelecção de textos denotativos e/ou conotativos. Intertextualidade: diálogo entre textos distintos. Identificar tema, ideia central, inferências e recursos argumentativos.",freq:"alto"},
      {t:"Ortografia e Acentuação",d:"Acentuação gráfica e prosódica. Ortografia segundo o novo acordo ortográfico (2009). Regras de acentuação de oxítonas, paroxítonas e proparoxítonas.",freq:"alto"},
      {t:"Uso da Crase",d:"Regras obrigatórias, proibidas e facultativas do uso da crase. Locução prepositiva + artigo feminino. Casos especiais com pronomes e palavras no plural.",freq:"alto"},
      {t:"Pontuação",d:"Uso da vírgula, ponto e vírgula, dois pontos, travessão, reticências e parênteses. Separação de adjunto adverbial deslocado, aposto e orações intercaladas.",freq:"medio"},
      {t:"Morfologia – Classes Gramaticais",d:"Classes variáveis: artigo, adjetivo, numeral, pronome, substantivo e verbo. Classes invariáveis: advérbio, conjunção, preposição e interjeição. Funções e flexões.",freq:"medio"},

        {n:27,q:"'Ele chegou ____ tempo para a reunião.' O correto é:",ops:["a","à","há","Não se usa artigo nem preposição"],g:0,exp:"'A tempo' é locução adverbial formada por substantivo masculino ('tempo'). Não há artigo feminino — logo, não se usa crase. Apenas a preposição 'a' simples."},
        {n:28,q:"Assinale a alternativa com crase empregada INCORRETAMENTE:",ops:["A orientadora passou às férias descansando.","Fomos à biblioteca pesquisar o tema.","A reunião foi marcada para às 14h.","Ela escreveu à diretora regional."],g:2,exp:"'Marcada para às 14h' está incorreto: não se usa crase após a preposição 'para'. O correto é 'marcada para as 14h'. Crase ocorre quando há fusão de 'a' (preposição) + 'a' (artigo), mas 'para' já é a preposição — não há fusão."},
        {n:29,q:"Em 'Dedicou sua vida à educação das crianças', o acento grave indica:",ops:["Acento tônico da sílaba","Fusão da preposição 'a' com o artigo feminino 'a'","Acento de timbre aberto","Pronome demonstrativo feminino"],g:1,exp:"O acento grave (crase) em 'à' indica a fusão da preposição 'a' (exigida pelo verbo 'dedicar-se a') com o artigo feminino definido 'a' que antecede 'educação'."},
        {n:30,q:"'Ela se referiu ____ mesmas questões discutidas na semana anterior.' Assinale a alternativa correta:",ops:["a","às","as","há"],g:1,exp:"'Referir-se a' exige preposição 'a'. Antes de 'mesmas' (feminino plural), usa-se 'às' = preposição 'a' + artigo feminino plural 'as'. Portanto: 'referiu-se às mesmas questões'."},
      ]},
      {nome:'Pontuação (Q31–Q40)',qs:[
        {n:31,q:"Assinale a alternativa em que o uso da vírgula está CORRETO:",ops:["Os alunos, estudaram bastante para a prova.","João, Pedro e Maria, chegaram cedo.","A orientadora, que estava cansada, encerrou a reunião.","Ela comprou cadernos, canetas, e borracha."],g:2,exp:"Vírgulas isolando aposto ou oração adjetiva explicativa estão corretas em 'A orientadora, que estava cansada, encerrou a reunião'. Nas demais: não se separa sujeito do predicado (A e B); não se usa vírgula antes do último elemento de uma enumeração ligado por 'e' (D)."},
        {n:32,q:"Assinale a frase em que a vírgula está empregada INCORRETAMENTE:",ops:["Apesar do cansaço, a orientadora atendeu todos os alunos.","Os estudantes, que não estudaram, foram reprovados.","Maria, diretora da escola, apresentou o PPP.","O aluno entrou, na sala silenciosamente."],g:3,exp:"Em 'O aluno entrou, na sala silenciosamente', a vírgula separa incorretamente o verbo de seu complemento adverbial. O adjunto adverbial 'na sala silenciosamente' não deve ser isolado por vírgula quando está em posição normal (após o verbo)."},
        {n:33,q:"O ponto e vírgula é usado CORRETAMENTE em:",ops:["Estudei muito; e fui aprovado.","Os alunos chegaram cedo; os professores, porém, atrasaram.","Ela comprou: cadernos; canetas; borrachas.","Fui à escola; porque queria estudar."],g:1,exp:"O ponto e vírgula separa orações coordenadas mais longas ou que já contêm vírgulas internas. Em B, separa duas orações com sentido contrastante — uso correto. Não se usa ponto e vírgula após 'e' (A), após dois pontos em enumeração simples usa-se vírgula (C), e não antes de conjunção explicativa (D)."},
        {n:34,q:"Os dois pontos são usados CORRETAMENTE em:",ops:["A diretora disse: que a reunião estava encerrada.","O orientador tem três funções: mediar, acompanhar e orientar.","Estudamos: para o concurso de orientador.","Ela chegou: e trouxe os documentos."],g:1,exp:"Os dois pontos introduzem enumeração, citação ou explicação. Em B, introduzem uma enumeração das funções do orientador — uso correto. Não se usam dois pontos entre verbo e oração completiva (A), entre preposição e complemento (C), nem antes de conjunção aditiva simples (D)."},
        {n:35,q:"Assinale a alternativa em que o travessão está empregado CORRETAMENTE:",ops:["Ela foi — à escola ontem.","O orientador — especialista em mediação — conduziu o processo.","Fui ao mercado — e comprei frutas.","A reunião — foi cancelada por falta de quórum."],g:1,exp:"O travessão é usado para isolar aposto ou oração intercalada explicativa. Em B, 'especialista em mediação' é um aposto explicativo de 'orientador', corretamente isolado por travessões. Nas demais alternativas, o uso é incorreto."},
        {n:36,q:"'O orientador perguntou: — Você já leu o PPP?' O travessão nessa frase indica:",ops:["Aposto explicativo","Início de fala em diálogo","Oração intercalada","Enumeração"],g:1,exp:"Na transcrição de diálogos, o travessão indica o início de uma fala. Após os dois pontos que introduzem o discurso direto, o travessão marca a voz do personagem que fala."},
        {n:37,q:"Em qual alternativa as reticências estão empregadas CORRETAMENTE?",ops:["Estudei muito... e passei na prova.","Não sei se devo... talvez seja melhor esperar.","Fui à escola... e voltei para casa.","O projeto foi aprovado... por unanimidade."],g:1,exp:"As reticências indicam suspensão do pensamento, hesitação, continuação subentendida ou emoção. Em B, indicam hesitação antes de completar a ideia — uso adequado. Nas demais, interrompem frases que se completam normalmente, sem necessidade de suspensão."},
        {n:38,q:"Assinale a alternativa em que o uso dos parênteses está CORRETO:",ops:["O orientador (chegou cedo) e abriu a escola.","A BNCC (Base Nacional Comum Curricular) define as competências essenciais.","Ela (foi à reunião) e participou ativamente.","O projeto (foi aprovado) por toda a equipe pedagógica."],g:1,exp:"Os parênteses são usados para inserir informações complementares, esclarecimentos ou siglas explicadas. Em B, explicam a sigla BNCC — uso correto. Nas demais alternativas, os parênteses estão isolando termos que fazem parte do núcleo da oração, o que é incorreto."},
        {n:39,q:"Em 'Trouxe tudo: canetas, cadernos, borracha e régua', os dois pontos indicam:",ops:["Citação de fala direta","Introdução de uma explicação ou enumeração","Oração causal","Contraste entre ideias"],g:1,exp:"Os dois pontos introduzem uma enumeração dos itens que compõem 'tudo'. Essa é uma das funções dos dois pontos: anunciar uma lista ou enumeração de elementos."},
        {n:40,q:"'Ele estudou muito, porém não foi aprovado.' A vírgula antes de 'porém' indica:",ops:["Enumeração de elementos","Separação de aposto","Separação de oração coordenada adversativa","Adjunto adverbial deslocado"],g:2,exp:"A vírgula separa orações coordenadas adversativas introduzidas por conjunções como 'porém', 'mas', 'contudo', 'entretanto', 'todavia'. O uso da vírgula antes dessas conjunções é obrigatório."},
      ]},
      {nome:'Morfologia – Classes Gramaticais (Q41–Q50)',qs:[
        {n:41,q:"Assinale a alternativa em que a palavra destacada é um SUBSTANTIVO:",ops:["O aluno chegou CEDO.","A BELEZA da escola impressionou a todos.","Ele é muito DEDICADO ao trabalho.","Ela CORREU até a sala da orientadora."],g:1,exp:"'Beleza' é substantivo abstrato (designa qualidade abstraída do ser). 'Cedo' é advérbio, 'dedicado' é adjetivo e 'correu' é verbo."},
        {n:42,q:"Em 'Os três alunos aprovados receberam certificados', a classe gramatical de 'três' é:",ops:["Adjetivo","Advérbio","Numeral cardinal","Pronome indefinido"],g:2,exp:"'Três' é numeral cardinal — indica quantidade exata de elementos. Numerais cardinais funcionam como adjunto adnominal do substantivo a que se referem."},
        {n:43,q:"Qual das alternativas apresenta um ADVÉRBIO de intensidade?",ops:["O orientador chegou ontem.","Ela fala muito bem.","Estudaremos aqui amanhã.","Talvez ele venha à reunião."],g:1,exp:"'Muito' em 'fala muito bem' é advérbio de intensidade — modifica o advérbio de modo 'bem'. 'Ontem' e 'amanhã' são advérbios de tempo; 'aqui' é de lugar; 'talvez' é de dúvida."},
        {n:44,q:"Em 'Ela chegou quando a reunião terminava', a palavra 'quando' é:",ops:["Advérbio de tempo","Pronome relativo","Conjunção subordinativa temporal","Preposição"],g:2,exp:"'Quando' introduz uma oração subordinada adverbial temporal — indica o tempo em que a ação da oração principal ocorreu. Funciona como conjunção subordinativa temporal."},
        {n:45,q:"Assinale a alternativa em que a palavra sublinhada é PREPOSIÇÃO:",ops:["Ele trabalha PARA melhorar a escola.","PARA ele, o projeto foi um sucesso.","Ela estuda PARA o concurso.","Todas as alternativas apresentam preposição."],g:3,exp:"Em todos os casos, 'para' é preposição: indica finalidade (A), introduz complemento nominal com pronome (B) e indica finalidade/meta (C). A preposição não varia em gênero, número ou grau."},
        {n:46,q:"Na frase 'Que projeto lindo!', a palavra 'Que' é classificada como:",ops:["Pronome relativo","Conjunção subordinativa","Advérbio exclamativo","Pronome interrogativo"],g:2,exp:"Em exclamações, 'que' funciona como advérbio exclamativo — intensifica o adjetivo 'lindo'. Não introduz oração subordinada nem tem antecedente, portanto não é pronome relativo."},
        {n:47,q:"'Ninguém compareceu à reunião.' O pronome 'ninguém' é classificado como:",ops:["Pronome pessoal do caso reto","Pronome indefinido","Pronome demonstrativo","Pronome relativo"],g:1,exp:"'Ninguém' é pronome indefinido — refere-se de modo vago e indeterminado a pessoas, sem identificar nenhuma especificamente. Outros pronomes indefinidos: alguém, nada, tudo, cada, qualquer."},
        {n:48,q:"Em 'O orientador mesmo resolveu o problema', a palavra 'mesmo' é:",ops:["Advérbio de afirmação","Pronome adjetivo de reforço","Adjetivo indicando identidade","Conjunção"],g:1,exp:"'Mesmo' em posição pós-nominal reforça o substantivo/pronome a que se refere (o próprio orientador). Funciona como pronome adjetivo de reforço ou enfático."},
        {n:49,q:"Qual das alternativas apresenta uma CONJUNÇÃO coordenativa conclusiva?",ops:["porque","embora","portanto","quando"],g:2,exp:"'Portanto' é conjunção coordenativa conclusiva — introduz uma oração que expressa conclusão ou consequência da anterior. Outras conclusivas: logo, pois (posposto), assim. 'Porque' é causal, 'embora' é concessiva, 'quando' é temporal."},
        {n:50,q:"Em 'Puxa, que notícia boa!', a palavra 'Puxa' é classificada como:",ops:["Substantivo","Verbo no imperativo","Interjeição","Advérbio exclamativo"],g:2,exp:"'Puxa' é interjeição — expressa emoção ou estado de espírito do falante (surpresa, admiração). As interjeições são palavras invariáveis que formam enunciados exclamativos por si só."},
      ]},
      {nome:'Concordância Verbal (Q51–Q60)',qs:[
        {n:51,q:"Assinale a alternativa em que a concordância verbal está CORRETA:",ops:["Fazem dez anos que trabalho nesta escola.","Houveram muitas reclamações na reunião.","Deve haver muitos candidatos inscritos.","Existiam várias dúvidas, mas foram sanadas."],g:2,exp:"'Haver' no sentido de existir é impessoal e fica no singular: 'Deve haver'. 'Fazer' indicando tempo também é impessoal: 'Faz dez anos'. 'Houveram' está errado — deveria ser 'Houve'. A alternativa C está correta."},
        {n:52,q:"Em 'A maioria dos alunos faltou à aula', o verbo concordou com:",ops:["'alunos', núcleo do adjunto adnominal","'maioria', núcleo do sujeito","O verbo deveria estar no plural","Concordância facultativa com qualquer dos dois"],g:1,exp:"Com expressões partitivas como 'a maioria de', 'a maior parte de', 'uma porção de', o verbo pode concordar com o núcleo do sujeito (singular) ou com o substantivo do adjunto (plural). No singular — 'faltou' concordando com 'maioria' — a concordância está correta."},
        {n:53,q:"'Foram os orientadores que organizaram o evento.' O verbo 'foram' está no plural porque:",ops:["Concorda com 'orientadores', predicativo do sujeito","O verbo 'ser' é sempre plural nessa construção","Concorda com o sujeito oculto 'eles'","O verbo 'ser' em construções enfáticas concorda com o predicativo"],g:3,exp:"Em construções do tipo 'fui eu que fiz' / 'foram eles que fizeram', o verbo 'ser' concorda com o predicativo (ou termo destacado). 'Foram os orientadores' — o verbo concorda com 'orientadores'."},
        {n:54,q:"Assinale a alternativa com ERRO de concordância verbal:",ops:["Vende-se imóveis nesta rua.","Alugam-se apartamentos no centro.","Precisa-se de professores habilitados.","Contratam-se estagiários para o setor."],g:0,exp:"Na voz passiva sintética, o verbo concorda com o sujeito paciente: 'Vendem-se imóveis' (imóveis = sujeito, plural). 'Vende-se imóveis' está errado. Em 'Precisa-se de' o 'se' é índice de indeterminação — verbo fica no singular, pois não há sujeito."},
        {n:55,q:"'Mais de um aluno ficou reprovado.' A concordância está:",ops:["Errada; deveria ser 'ficaram'","Correta; 'mais de um' pede verbo no singular","Errada; deveria ser 'mais de um aluno ficaram'","Correta apenas em linguagem informal"],g:1,exp:"A expressão 'mais de um' geralmente pede verbo no singular por influência de 'um'. Portanto, 'ficou' está correto. Exceção: quando há reciprocidade — 'Mais de um colega se abraçaram'."},
        {n:56,q:"Em 'Os alunos, bem como a diretora, participaram da reunião', a concordância está:",ops:["Errada; o verbo deveria concordar só com 'diretora'","Correta; 'bem como' soma os sujeitos e pede plural","Errada; deveria ser 'participou'","Correta apenas se 'diretora' vier antes do verbo"],g:1,exp:"Quando dois sujeitos são unidos por 'bem como', 'assim como', 'além de', o verbo fica no plural. O sujeito composto 'os alunos bem como a diretora' exige 'participaram'."},
        {n:57,q:"'Nós, orientadores, devemos colaborar com o PPP.' O verbo 'devemos' concorda com:",ops:["'orientadores', aposto do sujeito","'Nós', sujeito da oração","Ambos, pois são equivalentes","Nenhum dos dois; há erro de concordância"],g:1,exp:"O verbo concorda com o sujeito 'Nós' (1ª pessoa do plural). 'Orientadores' é aposto explicativo de 'Nós' e não interfere na concordância verbal."},
        {n:58,q:"Assinale a alternativa em que o verbo HAVER está empregado CORRETAMENTE:",ops:["Haviam muitos problemas a resolver.","Houveram várias reuniões este mês.","Há muitos candidatos aprovados.","Hão de existir soluções para isso."],g:2,exp:"'Haver' no sentido de existir é impessoal — fica sempre no singular. 'Há muitos candidatos' está correto. 'Haviam' e 'Houveram' estão errados. 'Hão de existir' usa 'haver' como auxiliar — nesse caso pode flexionar, mas o verbo principal 'existir' deveria concordar."},
        {n:59,q:"'Quem são essas pessoas?' O verbo 'são' está no plural porque:",ops:["'Quem' é pronome que pode ser plural","Concordou com o predicativo 'essas pessoas'","Há erro; deveria ser 'é'","Concordou com o sujeito oculto 'elas'"],g:1,exp:"Quando o pronome 'quem' se refere a um predicativo no plural, o verbo 'ser' pode concordar com esse predicativo: 'Quem são essas pessoas?' O verbo concorda com 'essas pessoas'."},
        {n:60,q:"Em 'É preciso que os alunos estudem', o verbo 'É' está no singular pois:",ops:["Concorda com 'alunos'","A oração é impessoal — não há sujeito determinado","Concorda com o pronome oculto 'ele'","Há erro; deveria ser 'São precisos'"],g:1,exp:"A construção 'É preciso + oração subordinada' é impessoal — não há sujeito. O verbo 'ser' fica no singular. Não se diz 'São precisos que os alunos estudem'."},
      ]},
      {nome:'Concordância Nominal (Q61–Q70)',qs:[
        {n:61,q:"Assinale a alternativa em que a concordância nominal está CORRETA:",ops:["As orientadoras ficaram satisfeito com o resultado.","Os alunos e as alunas estavam animados para a prova.","A diretora e o coordenador chegaram cansada.","É proibido a entrada de pessoas não autorizadas."],g:1,exp:"Quando o adjetivo se refere a substantivos de gêneros diferentes, concorda no masculino plural: 'alunos e alunas estavam animados'. Nas demais, há discordância de gênero ou número."},
        {n:62,q:"Em 'É proibido entrada de menores', a concordância do adjetivo 'proibido' está:",ops:["Errada; deveria ser 'proibida'","Correta; adjetivo predicativo de sujeito oracional fica no masculino singular","Errada; deveria ser 'proibidos'","Correta apenas em linguagem coloquial"],g:1,exp:"Quando o adjetivo predicativo tem como sujeito uma oração ou um infinitivo, fica no masculino singular: 'É proibido [entrar]'. Se houver artigo antes do substantivo feminino — 'É proibida a entrada' — o adjetivo concorda com o substantivo."},
        {n:63,q:"'Anexo/Anexa seguem os documentos solicitados.' A forma correta é:",ops:["Anexo, pois é invariável","Anexa, concordando com 'documentos'","Anexos, concordando com 'documentos'","Anexas, pois os documentos são o objeto"],g:2,exp:"'Anexo' é adjetivo e concorda com o substantivo a que se refere: 'documentos' (masculino plural) → 'Anexos seguem os documentos'. Não é advérbio invariável nesse contexto."},
        {n:64,q:"Em 'Meias palavras bastam', o adjetivo 'Meias' concorda com:",ops:["O verbo 'bastam'","'palavras', substantivo feminino plural","O sujeito oculto","Nenhum termo — está incorreto"],g:1,exp:"'Meias' é adjetivo que concorda em gênero (feminino) e número (plural) com o substantivo 'palavras'. Indica metade — 'meias palavras' = palavras incompletas, insinuações."},
        {n:65,q:"Assinale a alternativa com ERRO de concordância nominal:",ops:["Elas saíram bastante satisfeitas da reunião.","Os documentos foram entregues em mãos próprias.","Seguem em anexas as planilhas solicitadas.","A diretora ficou muito contente com o resultado."],g:2,exp:"O correto é 'em anexo' — locução adverbial invariável. 'Anexas' estaria concordando incorretamente. A forma adverbial 'em anexo' não varia: 'Seguem em anexo as planilhas'."},
        {n:66,q:"Em 'As alunas saíram felizes da escola', o adjetivo 'felizes' exerce a função de:",ops:["Adjunto adnominal","Predicativo do sujeito","Aposto","Complemento nominal"],g:1,exp:"'Felizes' é predicativo do sujeito — atribuído ao sujeito 'as alunas' por meio do verbo de ligação implícito no contexto. Indica o estado do sujeito após a ação."},
        {n:67,q:"'Comprei dois quilo de arroz.' Há erro de:",ops:["Concordância verbal","Concordância nominal — deveria ser 'dois quilos'","Regência verbal","Ortografia em 'arroz'"],g:1,exp:"O numeral 'dois' exige que o substantivo esteja no plural: 'dois quilos'. 'Dois quilo' é erro de concordância nominal — o substantivo deve concordar em número com o numeral que o quantifica."},
        {n:68,q:"Em 'Obrigado' (dito por uma mulher), a forma correta é:",ops:["Obrigado, pois é locução invariável","Obrigada, concordando com o gênero de quem fala","Ambas as formas são aceitas sem distinção","Obrigados, pois inclui o interlocutor"],g:1,exp:"'Obrigado/Obrigada' é adjetivo predicativo que concorda com o sujeito que o profere. Uma mulher diz 'Obrigada'; um homem diz 'Obrigado'. A concordância com o gênero de quem fala é obrigatória na norma culta."},
        {n:69,q:"'Bastante alunos participaram da atividade.' Assinale o que ocorre nessa frase:",ops:["Está correta; 'bastante' é invariável","Há erro; o correto é 'Bastantes alunos'","Está correta; 'bastante' funciona como advérbio","Há erro de concordância verbal"],g:1,exp:"Quando 'bastante' funciona como adjetivo (modifica substantivo), concorda em número: 'Bastantes alunos'. Quando funciona como advérbio (modifica verbo ou adjetivo), é invariável: 'Eles estudaram bastante'."},
        {n:70,q:"Assinale a alternativa em que o numeral ordinal está empregado com concordância CORRETA:",ops:["O segundo e terceiro anos serão avaliados juntos.","A primeira e segunda etapas foram concluídas.","Os primeiros e os segundos colocados receberam medalhas.","As alunos ficaram em primeira lugar."],g:2,exp:"Em C, os numerais ordinais 'primeiros' e 'segundos' concordam em gênero e número com 'colocados' (masculino plural) — correto. Em A, falta o artigo antes de 'terceiro'; em B, 'etapas' é feminino plural, mas 'primeira e segunda' está sem problema; em D, 'as alunos' tem erro de concordância de artigo."},
      ]},
      {nome:'Regência Verbal e Nominal (Q71–Q80)',qs:[
        {n:71,q:"Assinale a alternativa em que a regência verbal está CORRETA:",ops:["O orientador assistiu o filme sobre educação.","Os alunos obedeceram as regras do colégio.","Ela aspirava ao cargo de orientadora educacional.","O diretor preferiu o plano A do que o plano B."],g:2,exp:"'Aspirar' no sentido de almejar é transitivo indireto e exige preposição 'a': 'aspirava ao cargo'. 'Assistir' (ver/presenciar) exige 'a': 'assistiu ao filme'. 'Obedecer' exige 'a': 'obedeceram às regras'. 'Preferir' não admite 'do que' — usa-se 'a': 'preferiu o plano A ao plano B'."},
        {n:72,q:"'Ele informou os alunos sobre a mudança de horário.' Nessa frase, o verbo 'informar' está empregado como:",ops:["Transitivo direto apenas","Transitivo indireto apenas","Transitivo direto e indireto (bitransitivo)","Intransitivo"],g:2,exp:"'Informar' admite duas construções: 'informar alguém de/sobre algo' (bitransitivo) ou 'informar algo a alguém'. Na frase, 'os alunos' é objeto direto e 'sobre a mudança' é objeto indireto — verbo bitransitivo."},
        {n:73,q:"'Os alunos chegaram _____ escola às 7h.' Assinale a preposição correta:",ops:["em","na","à","de"],g:2,exp:"O verbo 'chegar' exige a preposição 'a' (ou sua forma combinada 'à' antes de artigo feminino): 'chegaram à escola'. O uso de 'em' ('chegaram na escola') é coloquial e não aceito na norma culta formal."},
        {n:74,q:"Assinale a alternativa em que a regência do verbo 'esquecer' está CORRETA na norma culta:",ops:["Esqueci o documento em casa.","Me esqueci do documento em casa.","Esqueci-me do documento em casa.","Tanto A quanto C estão corretas"],g:3,exp:"'Esquecer' admite duas construções: transitivo direto sem pronome reflexivo ('esqueci o documento') ou pronominal com preposição ('esqueci-me do documento'). Ambas são corretas. O erro está em 'Me esqueci do' com próclise indevida no início de frase."},
        {n:75,q:"'Ela se lembrou _____ reunião de ontem.' A preposição correta é:",ops:["de","em","a","para"],g:0,exp:"O verbo 'lembrar-se' (pronominal) é transitivo indireto e rege a preposição 'de': 'lembrou-se da reunião'. Sem o pronome reflexivo, 'lembrar' pode ser transitivo direto: 'lembrou a reunião'."},
        {n:76,q:"Em qual alternativa a regência nominal está CORRETA?",ops:["O orientador é ansioso para os resultados.","Ela tem certeza do sucesso do projeto.","Estou satisfeito com os resultados alcançados.","Todas as alternativas estão corretas."],g:3,exp:"'Ansioso por/para', 'certeza de' e 'satisfeito com' são as regências nominais corretas. Nesse conjunto, todas as alternativas apresentam construções aceitas na norma culta — a questão testa se o candidato reconhece as três como corretas."},
        {n:77,q:"'O diretor implicou _____ a proposta desde o início.' Assinale a alternativa correta:",ops:["com","de","em","Não há preposição — é transitivo direto"],g:0,exp:"'Implicar' no sentido de antipatizar/ter implicância é transitivo indireto e rege a preposição 'com': 'implicou com a proposta'. 'Implicar' no sentido de envolver/acarretar é transitivo direto: 'Isso implica mudanças'."},
        {n:78,q:"Assinale a frase com regência verbal INCORRETA segundo a norma culta:",ops:["O orientador respondeu ao questionário com cuidado.","Ela namorou o colega por dois anos.","Os alunos precisam de orientação constante.","A escola custou caro aos cofres públicos."],g:1,exp:"'Namorar' na norma culta é transitivo indireto: 'namorou com o colega'. O uso direto 'namorou o colega' é popular/coloquial. 'Responder a', 'precisar de' e 'custar a' estão corretos."},
        {n:79,q:"'Todos os alunos _____ à formatura.' O verbo que completa a frase corretamente é:",ops:["compareceram","foram presentes","estiveram","apareceram"],g:0,exp:"'Comparecer' é o verbo mais adequado na norma culta para indicar presença formal a um evento, sendo transitivo indireto com preposição 'a': 'compareceram à formatura'. As demais opções são menos precisas ou coloquiais."},
        {n:80,q:"Em 'Não me venha com essa história', o verbo 'vir' está empregado como:",ops:["Transitivo direto","Transitivo indireto com preposição 'com'","Intransitivo com adjunto adverbial","Verbo de ligação"],g:1,exp:"Na construção 'vir com algo', o verbo 'vir' rege a preposição 'com', funcionando como transitivo indireto. O sentido é apresentar/trazer algo (argumento, desculpa, história)."},
      ]},
      {nome:'Colocação Pronominal (Q81–Q90)',qs:[
        {n:81,q:"Assinale a alternativa em que a colocação pronominal está CORRETA segundo a norma culta:",ops:["Me diga a verdade agora.","Diga-me a verdade agora.","Me disseram que a reunião foi cancelada.","Se você estudar, se sairá bem."],g:1,exp:"No imperativo afirmativo, usa-se ênclise: 'Diga-me'. Pronome não pode iniciar frase na norma culta escrita (A e C errados). Em D, 'se sairá' está incorreto — o 'se' condicional atrai o pronome para a próclise: 'se você estudar, sairá bem'."},
        {n:82,q:"Em qual alternativa há próclise OBRIGATÓRIA?",ops:["Fale-me sobre o projeto.","Ninguém me disse nada sobre isso.","Entreguei-lhe o relatório ontem.","Contou-me tudo sobre a reunião."],g:1,exp:"Palavras negativas ('ninguém', 'não', 'nunca', 'jamais') atraem o pronome para antes do verbo — próclise obrigatória: 'Ninguém me disse'. Nas demais, o contexto admite ênclise."},
        {n:83,q:"'Vou me preparar para o concurso.' Nessa frase, a colocação do pronome 'me' é:",ops:["Errada; deveria ser 'Vou preparar-me'","Errada; deveria ser 'Me vou preparar'","Correta; em locuções verbais, o pronome pode ficar antes do auxiliar","Correta apenas na fala informal"],g:2,exp:"Em locuções verbais (auxiliar + infinitivo), o pronome pode ser colocado antes do auxiliar (próclise ao auxiliar), entre os verbos (próclise ao infinitivo) ou após o infinitivo (ênclise ao infinitivo): 'Vou me preparar', 'Vou preparar-me' e 'Vou preparar-me' são todas aceitas."},
        {n:84,q:"Assinale a alternativa em que a mesóclise está empregada CORRETAMENTE:",ops:["Far-me-ei presente na cerimônia.","Farei-me presente na cerimônia.","Me farei presente na cerimônia.","Farei presente me na cerimônia."],g:0,exp:"Mesóclise: pronome inserido dentro do verbo no futuro do presente ou futuro do pretérito. 'Far-me-ei' = farei + me (futuro do presente). É obrigatória no futuro quando não há palavra que imponha próclise."},
        {n:85,q:"'Quando você chegar, ligue-me.' A colocação pronominal em 'ligue-me' é:",ops:["Errada; deveria ser 'me ligue' por causa do 'quando'","Correta; imperativo afirmativo exige ênclise","Errada; 'quando' atrai o pronome para próclise","Correta; mas 'me ligue' também seria aceito"],g:1,exp:"O verbo 'ligue' está no imperativo afirmativo — a norma culta impõe ênclise: 'ligue-me'. O fato de haver 'quando' na oração anterior não interfere na colocação do pronome nesta oração independente."},
        {n:86,q:"Em 'Não se preocupe com isso', o pronome 'se' exerce a função de:",ops:["Índice de indeterminação do sujeito","Partícula apassivadora","Pronome reflexivo","Expletivo ou de realce"],g:2,exp:"Em 'preocupar-se', o pronome 'se' é parte integrante do verbo pronominal reflexivo (ou pseudorreflexivo). O sujeito ('você' implícito) pratica e recebe a ação sobre si mesmo."},
        {n:87,q:"Assinale a alternativa com colocação pronominal INCORRETA na norma culta:",ops:["Trouxeram-me boas notícias hoje.","Alguém te ligou enquanto você estava na reunião.","Espero que tudo se resolva logo.","Ontem telefonou-me o diretor da escola."],g:3,exp:"'Ontem' é advérbio e atrai o pronome para a próclise: 'Ontem me telefonou o diretor'. A ênclise 'telefonou-me' após palavra atraidora (advérbio no início) está incorreta na norma culta."},
        {n:88,q:"'Ele apresentou-se ao novo cargo com entusiasmo.' O pronome 'se' nessa frase indica:",ops:["Voz passiva sintética","Reflexividade — o sujeito pratica a ação sobre si mesmo","Indeterminação do sujeito","Realce enfático"],g:1,exp:"'Apresentar-se' é verbo pronominal: o sujeito ('ele') pratica e ao mesmo tempo é objeto da ação de apresentar. O pronome 'se' indica reflexividade."},
        {n:89,q:"Em locuções verbais sem palavra atraidora, como 'Posso ajudá-lo agora', a colocação pronominal está:",ops:["Errada; deveria ser 'Posso-lhe ajudar'","Correta; ênclise ao infinitivo é aceita","Errada; deveria ser 'O posso ajudar'","Correta apenas se houver palavra atraidora"],g:1,exp:"Em locuções verbais (auxiliar + infinitivo) sem palavra atraidora, todas as posições são aceitas: próclise ao auxiliar ('o posso ajudar' — menos comum), ênclise ao infinitivo ('posso ajudá-lo') ou próclise ao infinitivo ('posso lhe ajudar'). A forma 'posso ajudá-lo' é a mais formal e correta."},
        {n:90,q:"Qual das palavras abaixo NÃO é atraidora de próclise?",ops:["Nunca","Talvez","Que (relativo)","Certamente"],g:3,exp:"'Certamente' é advérbio afirmativo e, embora alguns gramáticos o incluam como atraidor facultativo, não é classicamente obrigatório como os demais. 'Nunca' (negação), 'talvez' (dúvida) e 'que' (pronome relativo/conjunção) são atratores clássicos de próclise obrigatória."},
      ]},
      {nome:'Período Composto – Coordenação (Q91–Q100)',qs:[
        {n:91,q:"'Os alunos estudaram muito, mas não foram aprovados.' A conjunção 'mas' indica:",ops:["Adição de ideias semelhantes","Oposição ou contraste entre as orações","Conclusão da oração anterior","Alternância entre duas situações"],g:1,exp:"'Mas' é conjunção coordenativa adversativa — estabelece contraste ou oposição entre as orações. Outras adversativas: porém, contudo, todavia, entretanto, no entanto."},
        {n:92,q:"Assinale a alternativa em que a conjunção coordenativa é CONCLUSIVA:",ops:["Os professores chegaram e os alunos esperavam.","Estudou bastante, logo foi aprovado.","Ou você estuda, ou reprova.","Ela não foi à reunião, pois estava doente."],g:1,exp:"'Logo' é conjunção coordenativa conclusiva — expressa conclusão ou consequência. Outras conclusivas: portanto, pois (posposto), assim, por isso. 'E' é aditiva, 'ou...ou' é alternativa, 'pois' (anteposto) é explicativa."},
        {n:93,q:"Em 'Não só estudou, mas também se dedicou à prática', a conjunção expressa:",ops:["Adversidade","Adição com ênfase","Alternância","Conclusão"],g:1,exp:"'Não só... mas também' é locução conjuntiva coordenativa aditiva com valor de ênfase — indica que duas informações se somam, reforçando a ideia. Outras aditivas: e, nem, também."},
        {n:94,q:"'Ou o orientador resolve a situação, ou o caso será encaminhado à direção.' As orações são:",ops:["Coordenadas sindéticas adversativas","Coordenadas sindéticas alternativas","Coordenadas sindéticas conclusivas","Coordenadas assindéticas"],g:1,exp:"'Ou...ou' é conjunção coordenativa alternativa — indica alternância ou exclusão entre duas possibilidades. A repetição de 'ou' reforça o caráter excludente."},
        {n:95,q:"'Ele faltou à reunião, pois estava com febre.' A oração introduzida por 'pois' é:",ops:["Coordenada adversativa","Coordenada explicativa","Subordinada causal","Subordinada concessiva"],g:1,exp:"'Pois' anteposto ao segundo fato introduz oração coordenada explicativa — justifica ou explica a ideia anterior. Diferente de 'porque' (subordinada causal). 'Pois' posposto ao verbo é conclusivo."},
        {n:96,q:"Assinale a alternativa em que há oração coordenada ASSINDÉTICA:",ops:["Ele chegou e logo saiu.","Estudou muito, foi aprovado, comemorou com a família.","Não foi à aula, pois estava doente.","Ficou cansado, mas terminou o trabalho."],g:1,exp:"Orações coordenadas assindéticas são justapostas sem conjunção: 'Estudou muito, foi aprovado, comemorou' — três orações separadas apenas por vírgula, sem conectivo. As demais possuem conjunções ('e', 'pois', 'mas')."},
        {n:97,q:"Em 'Trabalhe mais, que você terá melhores resultados', a conjunção 'que' é:",ops:["Pronome relativo","Conjunção subordinativa causal","Conjunção coordenativa explicativa","Conjunção subordinativa consecutiva"],g:2,exp:"'Que' com valor de 'pois', 'porque', ligando duas orações independentes para explicar ou justificar, é conjunção coordenativa explicativa. 'Trabalhe mais, que = pois/porque você terá melhores resultados'."},
        {n:98,q:"'Nem estudou nem compareceu à prova.' A conjunção 'nem...nem' é:",ops:["Adversativa","Aditiva negativa","Alternativa","Conclusiva"],g:1,exp:"'Nem...nem' é conjunção coordenativa aditiva com valor negativo — adiciona duas negações. Equivale a 'não...e também não'. É classificada como aditiva pela função de adição, com polaridade negativa."},
        {n:99,q:"Assinale a alternativa em que a conjunção está INCORRETAMENTE classificada:",ops:["'Portanto' — conclusiva","'Todavia' — adversativa","'Ora...ora' — alternativa","'Porque' (anteposto) — explicativa"],g:3,exp:"'Porque' anteposto introduz oração subordinada adverbial causal, não coordenada explicativa. A coordenada explicativa usa 'pois' (anteposto), 'que' ou 'porque' em estruturas específicas. 'Porque' normalmente é causal subordinativo."},
        {n:100,q:"'Ora chora, ora ri — ninguém o entende.' As orações 'ora chora, ora ri' são:",ops:["Subordinadas adverbiais temporais","Coordenadas sindéticas alternativas","Coordenadas assindéticas","Subordinadas adjetivas"],g:1,exp:"'Ora...ora' é locução conjuntiva coordenativa alternativa — indica alternância entre duas situações ou ações. As orações ligadas por 'ora...ora' são coordenadas sindéticas alternativas."},
      ]},
      {nome:'Período Composto – Subordinação (Q101–Q110)',qs:[
        {n:101,q:"'Espero que o projeto seja aprovado.' A oração 'que o projeto seja aprovado' é:",ops:["Subordinada adverbial final","Subordinada substantiva objetiva direta","Subordinada adjetiva restritiva","Subordinada adverbial concessiva"],g:1,exp:"A oração funciona como objeto direto do verbo 'esperar' — responde à pergunta 'espero o quê?'. Por isso é subordinada substantiva objetiva direta, introduzida pela conjunção integrante 'que'."},
        {n:102,q:"Em 'O orientador que mediou o conflito foi elogiado', a oração 'que mediou o conflito' é:",ops:["Subordinada substantiva subjetiva","Subordinada adjetiva restritiva","Subordinada adjetiva explicativa","Subordinada adverbial causal"],g:1,exp:"A oração introduzida pelo pronome relativo 'que' modifica o substantivo 'orientador' e restringe seu sentido — identifica qual orientador foi elogiado. Sem vírgula, é adjetiva restritiva."},
        {n:103,q:"'O orientador educacional, que tem vasta experiência, foi promovido.' A oração destacada é:",ops:["Adjetiva restritiva — sem ela, a frase perde o sentido","Adjetiva explicativa — acrescenta informação acessória sobre o orientador","Subordinada substantiva apositiva","Coordenada sindética aditiva"],g:1,exp:"Com vírgulas, a oração adjetiva é explicativa — acrescenta informação acessória (não essencial) ao substantivo. Sem as vírgulas, seria restritiva. A explicativa pode ser retirada sem comprometer o sentido essencial."},
        {n:104,q:"Assinale a alternativa em que há oração subordinada adverbial CONCESSIVA:",ops:["Estudou para ser aprovado.","Embora estivesse cansado, o orientador atendeu todos.","Quando terminar a reunião, avisem-me.","Ele ficou doente porque estava ao relento."],g:1,exp:"'Embora' introduz oração subordinada adverbial concessiva — indica uma concessão, contraste com a ideia principal (estava cansado, mas mesmo assim atendeu). Conjunções concessivas: embora, ainda que, mesmo que, por mais que, apesar de que."},
        {n:105,q:"'Para que todos participem, a reunião foi agendada no horário de maior disponibilidade.' A oração em destaque é:",ops:["Subordinada adverbial causal","Subordinada adverbial condicional","Subordinada adverbial final","Subordinada adverbial temporal"],g:2,exp:"'Para que' introduz oração subordinada adverbial final — indica a finalidade ou o objetivo da ação da oração principal. Outras conjunções finais: a fim de que, com o intuito de que."},
        {n:106,q:"'Se você estudar com dedicação, será aprovado.' A oração 'Se você estudar' é:",ops:["Subordinada adverbial causal","Subordinada adverbial condicional","Subordinada adverbial concessiva","Coordenada sindética conclusiva"],g:1,exp:"'Se' introduz oração subordinada adverbial condicional — estabelece uma condição para que o fato da oração principal se realize. Outras conjunções condicionais: caso, desde que, contanto que, a menos que."},
        {n:107,q:"Em 'Quando a diretora chegou, a reunião já havia começado', a oração sublinhada é:",ops:["Subordinada adverbial condicional","Subordinada adverbial temporal","Subordinada adverbial causal","Subordinada substantiva objetiva"],g:1,exp:"'Quando' introduz oração subordinada adverbial temporal — situa no tempo a ação da oração principal. Outras conjunções temporais: assim que, logo que, antes que, depois que, enquanto."},
        {n:108,q:"'É necessário que o orientador conheça a legislação educacional.' O sujeito do verbo 'é' é:",ops:["O orientador","A legislação educacional","A oração 'que o orientador conheça a legislação'","Sujeito inexistente — oração impessoal"],g:2,exp:"A oração 'que o orientador conheça a legislação educacional' é o sujeito do verbo 'é' — subordinada substantiva subjetiva. Quando uma oração toda funciona como sujeito, classifica-se como subordinada substantiva subjetiva."},
        {n:109,q:"'Ele agiu de modo que ninguém se sentisse excluído.' A oração em destaque indica:",ops:["Causa","Consequência com ideia de modo","Condição","Concessão"],g:1,exp:"'De modo que' (com subjuntivo) introduz oração subordinada adverbial consecutiva-modal — indica o modo da ação com nuance de consequência. Com indicativo, seria puramente consecutiva; com subjuntivo, o sentido modal é mais evidente."},
        {n:110,q:"Assinale a alternativa em que há oração subordinada SUBSTANTIVA APOSITIVA:",ops:["É importante que todos compareçam.","Tenho certeza de que o projeto dará certo.","Chegou a notícia de que a escola seria reformada.","O orientador que atendeu o aluno foi elogiado."],g:2,exp:"Em C, 'de que a escola seria reformada' é oração subordinada substantiva apositiva — funciona como aposto do substantivo 'notícia', explicando seu conteúdo. Introduzida pela conjunção integrante 'que' precedida de preposição."},
      ]},
      {nome:'Semântica e Figuras de Linguagem (Q111–Q120)',qs:[
        {n:111,q:"'A sala de aula é um campo de batalha.' A figura de linguagem presente é:",ops:["Comparação","Metáfora","Metonímia","Hipérbole"],g:1,exp:"Metáfora: identificação implícita entre dois elementos de naturezas diferentes ('sala de aula' e 'campo de batalha') sem o uso de conectivo comparativo como 'como' ou 'tal qual'. A comparação usaria 'como': 'é como um campo de batalha'."},
        {n:112,q:"Em 'Ela tem um coração de pedra', o recurso expressivo utilizado é:",ops:["Metonímia","Hipérbole","Metáfora","Eufemismo"],g:2,exp:"Metáfora: 'coração de pedra' identifica implicitamente o coração (sentimento) com pedra (dureza, insensibilidade). Não há comparação explícita — é uma identificação direta entre os dois elementos."},
        {n:113,q:"'Li Machado de Assis durante as férias.' A figura de linguagem em destaque é:",ops:["Metáfora","Comparação","Metonímia","Hipérbole"],g:2,exp:"Metonímia: uso do nome do autor ('Machado de Assis') para designar sua obra ('livros de Machado de Assis'). É a substituição de um termo por outro com o qual mantém relação de contiguidade (autor pela obra)."},
        {n:114,q:"'Já te disse mil vezes que precisa estudar!' O recurso expressivo utilizado é:",ops:["Metáfora","Hipérbole","Eufemismo","Antítese"],g:1,exp:"Hipérbole: exagero intencional para intensificar uma ideia ou sentimento. 'Mil vezes' não é literal — exagera a quantidade para enfatizar a insistência. É comum na linguagem cotidiana e literária."},
        {n:115,q:"'Ele passou desta para melhor.' A expressão é um exemplo de:",ops:["Ironia","Eufemismo","Antítese","Metonímia"],g:1,exp:"Eufemismo: substituição de uma expressão direta e desagradável por outra mais suave. 'Passou desta para melhor' substitui 'morreu' — atenua o impacto emocional da informação."},
        {n:116,q:"'O silêncio falou mais alto naquela reunião.' Identifique a figura de linguagem:",ops:["Hipérbole","Metonímia","Paradoxo","Prosopopeia (personificação)"],g:3,exp:"Prosopopeia ou personificação: atribuição de características humanas ('falar') a um ser inanimado ('silêncio'). O silêncio não pode literalmente falar — é uma figura que humaniza o abstrato."},
        {n:117,q:"Assinale o par de SINÔNIMOS:",ops:["ávido / satisfeito","prolixo / conciso","iminente / eminente","árduo / difícil"],g:3,exp:"'Árduo' e 'difícil' são sinônimos — palavras de significados semelhantes. 'Ávido' (desejoso) e 'satisfeito' são antônimos; 'prolixo' (extenso demais) e 'conciso' são antônimos; 'iminente' (prestes a acontecer) e 'eminente' (notável) são parônimos."},
        {n:118,q:"'Descrição' e 'discrição' são exemplos de:",ops:["Sinônimos","Antônimos","Parônimos","Homônimos perfeitos"],g:2,exp:"Parônimos: palavras de grafia e pronúncia semelhantes, mas com significados diferentes. 'Descrição' = ato de descrever; 'discrição' = qualidade de discreto. Não se confundem com homônimos, que têm grafia idêntica."},
        {n:119,q:"Em 'O orientador é a âncora da escola', a palavra 'âncora' está usada em sentido:",ops:["Denotativo","Conotativo","Técnico","Científico"],g:1,exp:"Sentido conotativo (ou figurado): a palavra 'âncora' não designa o instrumento náutico literal, mas sim a ideia de estabilidade, referência e apoio que o orientador representa. O sentido denotativo seria o significado literal do dicionário."},
        {n:120,q:"'Amor e ódio, luz e trevas — eis a condição humana.' A figura de linguagem é:",ops:["Hipérbole","Gradação","Antítese","Eufemismo"],g:2,exp:"Antítese: aproximação de ideias ou palavras de sentidos opostos ('amor/ódio', 'luz/trevas') para criar contraste expressivo. Diferente do oxímoro, que funde os contrários numa só expressão ('silêncio ensurdecedor')."},
      ]},
      {nome:'Formação de Palavras (Q121–Q130)',qs:[
        {n:121,q:"A palavra 'deslealdade' foi formada por:",ops:["Composição por justaposição","Derivação prefixal e sufixal (parassíntese)","Derivação prefixal seguida de derivação sufixal","Composição por aglutinação"],g:2,exp:"'Deslealdade' foi formada em dois processos: prefixação ('des-' + 'lealdade' não existe como base → na verdade: 'leal' → 'lealdade' por sufixação → 'des-' + 'lealdade' por prefixação). É derivação prefixal sobre a base 'lealdade', que por sua vez vem de 'leal' + sufixo '-dade'."},
        {n:122,q:"Em qual alternativa a palavra foi formada por COMPOSIÇÃO por justaposição?",ops:["aguardente","passatempo","couve-flor","planalto"],g:2,exp:"'Couve-flor' é formada por justaposição: dois vocábulos mantêm sua forma original e são unidos com hífen, conservando cada um sua tonicidade. 'Aguardente' e 'planalto' são aglutinação; 'passatempo' também é justaposição — mas 'couve-flor' é o exemplo mais claro com hífen."},
        {n:123,q:"O prefixo 'anti-' em 'antidemocrático' indica:",ops:["Repetição","Oposição ou contra","Excesso","Anterioridade"],g:1,exp:"O prefixo 'anti-' indica oposição, contra: 'antidemocrático' = contrário à democracia. Outros exemplos: antiético, antissocial, antivírus. Não confundir com 'ante-' (anterioridade) ou 'ante-' (posição anterior)."},
        {n:124,q:"A palavra 'ensurdecedor' foi formada por:",ops:["Derivação sufixal","Derivação parassintética","Composição por aglutinação","Derivação regressiva"],g:1,exp:"Parassíntese (derivação parassintética): acréscimo simultâneo de prefixo e sufixo a uma base. 'En-' + 'surdo' + '-ecer' = ensurdecer → 'ensurdecedor'. Sem o prefixo ou sem o sufixo, a palavra intermediária não existe: 'surdecedor' e 'ensurdo' não existem."},
        {n:125,q:"'Guarda-chuva' é formada por:",ops:["Derivação prefixal","Composição por aglutinação","Composição por justaposição","Derivação sufixal"],g:2,exp:"'Guarda-chuva' é composta por justaposição: 'guarda' (verbo) + 'chuva' (substantivo), unidos com hífen, mantendo a tonicidade de cada elemento. É uma composição nominal formada por verbo + substantivo."},
        {n:126,q:"Qual alternativa apresenta palavra formada por DERIVAÇÃO REGRESSIVA?",ops:["livraria","embarcar","choro (de chorar)","desumano"],g:2,exp:"Derivação regressiva: formação de substantivo a partir de verbo pela supressão da terminação verbal. 'Chorar' → 'choro' (retirou-se a desinência -ar). Outros exemplos: 'ajuda' (de ajudar), 'pesca' (de pescar), 'debate' (de debater)."},
        {n:127,q:"O sufixo '-eiro' em 'carteiro' indica:",ops:["Qualidade","Lugar onde se guarda algo","Profissão ou agente","Diminutivo"],g:2,exp:"O sufixo '-eiro' forma substantivos indicando profissão, agente ou instrumento: 'carteiro' (quem carrega cartas), 'padeiro', 'pedreiro'. Também pode indicar árvore (laranjeira) ou recipiente (açucareiro)."},
        {n:128,q:"Em 'A escola recebeu uma verba considerável', a palavra 'considerável' foi formada por:",ops:["Composição","Derivação prefixal","Derivação sufixal","Derivação parassintética"],g:2,exp:"'Considerável' = 'considerar' (verbo) + sufixo '-vel' (que indica possibilidade ou capacidade). Derivação sufixal: acréscimo de sufixo à base verbal. O sufixo '-vel' forma adjetivos: amável, lamentável, louvável."},
        {n:129,q:"Assinale a alternativa em que todas as palavras pertencem à mesma família:",ops:["escola, escolar, escolta","orientar, orientação, orientador","letra, letrar, latrina","educar, educação, educanda"],g:3,exp:"Família de palavras: conjunto de palavras derivadas da mesma raiz. 'Educar', 'educação' e 'educanda' compartilham a raiz 'educ-'. 'Escola/escolar/escolta' — 'escolta' tem raiz diferente; 'letra/letrar/latrina' — 'latrina' tem origem diversa."},
        {n:130,q:"A palavra 'planalto' foi formada por:",ops:["Derivação prefixal","Composição por justaposição","Composição por aglutinação","Derivação sufixal"],g:2,exp:"'Planalto' = 'plano' + 'alto', com fusão dos dois vocábulos (aglutinação): a tonicidade do primeiro elemento é perdida. Composição por aglutinação: os elementos se fundem formando uma palavra com tonicidade única."},
      ]},
      {nome:'Funções da Linguagem e Interpretação (Q131–Q140)',qs:[
        {n:131,q:"'Alô? Você está me ouvindo? Pode me escutar?' A função da linguagem predominante é:",ops:["Referencial","Emotiva","Fática","Poética"],g:2,exp:"A função fática tem por objetivo verificar, estabelecer ou manter o canal de comunicação entre emissor e receptor. Expressões como 'alô', 'está me ouvindo?', 'oi' são exemplos típicos dessa função."},
        {n:132,q:"Em um poema em que o autor explora rimas, ritmo e jogos sonoros como fins em si mesmos, predomina a função:",ops:["Referencial","Metalinguística","Poética","Apelativa"],g:2,exp:"A função poética volta-se para a mensagem em si — valoriza a forma, o ritmo, as rimas, as escolhas lexicais como elementos estéticos. É a função central na literatura, mas pode aparecer em propagandas e slogans."},
        {n:133,q:"'Compre agora! Aproveite esta oferta imperdível!' A função da linguagem predominante é:",ops:["Emotiva","Apelativa (conativa)","Referencial","Fática"],g:1,exp:"A função apelativa ou conativa centra-se no receptor, visando influenciar seu comportamento. É caracterizada pelo uso de imperativos, vocativos e linguagem persuasiva. Predomina em publicidade, discursos políticos e ordens."},
        {n:134,q:"Leia o trecho: 'A escola pública brasileira enfrenta desafios históricos relacionados à infraestrutura, à formação docente e à gestão pedagógica.' A função predominante é:",ops:["Poética","Fática","Metalinguística","Referencial"],g:3,exp:"A função referencial (ou denotativa) centra-se no contexto/referente — transmite informações objetivas sobre o mundo. É predominante em textos informativos, científicos e jornalísticos, com linguagem denotativa e impessoal."},
        {n:135,q:"'Este texto analisa o uso das conjunções na língua portuguesa.' A função da linguagem é:",ops:["Emotiva","Metalinguística","Fática","Apelativa"],g:1,exp:"A função metalinguística ocorre quando a linguagem fala sobre ela mesma — o código é o próprio referente da mensagem. Dicionários, gramáticas e textos que discutem o uso da língua exercem essa função."},
        {n:136,q:"Com base no trecho 'O orientador educacional atua como mediador entre alunos, família e escola, promovendo o desenvolvimento integral dos estudantes', assinale a afirmação CORRETA:",ops:["O orientador substitui o papel da família na educação","A mediação é apenas uma das atribuições do orientador, sendo a principal o ensino","O orientador articula diferentes instâncias em prol do desenvolvimento pleno do aluno","O texto afirma que o orientador é responsável exclusivamente pela disciplina escolar"],g:2,exp:"O trecho afirma explicitamente que o orientador atua como mediador entre alunos, família e escola, promovendo o desenvolvimento integral. A alternativa C é a que melhor representa o sentido do texto, sem distorcer ou extrapolar as informações."},
        {n:137,q:"'Apesar das dificuldades encontradas, a equipe pedagógica conseguiu implementar o PPP com êxito.' A palavra 'Apesar' estabelece relação de:",ops:["Causa","Concessão","Conclusão","Adição"],g:1,exp:"'Apesar de' é locução prepositiva concessiva — indica que, mesmo havendo um obstáculo (as dificuldades), o resultado esperado foi alcançado. A concessão admite o obstáculo sem negar a realização do fato principal."},
        {n:138,q:"No texto 'É fundamental que o orientador escute os alunos, compreenda seus contextos e proponha intervenções adequadas', os verbos no subjuntivo indicam:",ops:["Certeza absoluta sobre as ações descritas","Dúvida sobre a existência do orientador","Necessidade ou obrigatoriedade das ações","Ações já realizadas no passado"],g:2,exp:"Os verbos 'escute', 'compreenda' e 'proponha' estão no subjuntivo presente, introduzidos pela expressão 'É fundamental que' — que impõe o modo subjuntivo para expressar necessidade, obrigação ou desejo."},
        {n:139,q:"'O sucesso do PPP depende, sobretudo, do engajamento coletivo.' A palavra 'sobretudo' pode ser substituída, sem alteração de sentido, por:",ops:["portanto","além disso","principalmente","todavia"],g:2,exp:"'Sobretudo' é advérbio de intensidade com valor de 'principalmente', 'acima de tudo', 'especialmente'. Indica que o engajamento coletivo é o fator mais importante entre os que determinam o sucesso do PPP."},
        {n:140,q:"Leia: 'Não basta informar; é preciso formar.' A figura de linguagem e o recurso estilístico presentes são:",ops:["Hipérbole e aliteração","Antítese e paralelismo sintático","Metáfora e assonância","Metonímia e anáfora"],g:1,exp:"'Informar' e 'formar' estabelecem uma antítese de sentido (apenas transmitir dados vs. desenvolver o ser); a construção 'é preciso... é preciso' (implícita) e a estrutura paralela 'Não basta X; é preciso Y' caracterizam o paralelismo sintático."},
      ]},
      {nome:'Vozes Verbais e Modos/Tempos Verbais (Q141–Q150)',qs:[
        {n:141,q:"'O projeto foi elaborado pela equipe pedagógica.' Essa frase está na voz:",ops:["Ativa","Passiva sintética","Passiva analítica","Reflexiva"],g:2,exp:"Voz passiva analítica: formada pelo verbo auxiliar 'ser' (ou 'estar', 'ficar') conjugado + particípio do verbo principal + agente da passiva introduzido por 'por'. 'Foi elaborado pela equipe' = auxiliar 'foi' + particípio 'elaborado' + agente 'pela equipe'."},
        {n:142,q:"Transforme para a voz ativa: 'O PPP foi construído por toda a comunidade escolar.' A forma correta é:",ops:["Toda a comunidade escolar construiu o PPP.","O PPP construiu toda a comunidade escolar.","Toda a comunidade escolar foi construída pelo PPP.","O PPP se construiu por toda a comunidade."],g:0,exp:"Na transformação para a voz ativa: o agente da passiva ('por toda a comunidade') torna-se sujeito; o sujeito paciente ('o PPP') torna-se objeto direto; o verbo volta à forma ativa no mesmo tempo: 'construiu'."},
        {n:143,q:"'Alugam-se salas para reuniões pedagógicas.' O 'se' nessa frase é:",ops:["Pronome reflexivo","Índice de indeterminação do sujeito","Partícula apassivadora — voz passiva sintética","Pronome de realce"],g:2,exp:"'Alugam-se salas': o verbo concorda com 'salas' (sujeito paciente plural). O 'se' é partícula apassivadora — transforma a frase em voz passiva sintética. Se o 'se' fosse índice de indeterminação, o verbo ficaria no singular: 'Aluga-se salas' (erro de concordância)."},
        {n:144,q:"'Precisa-se de orientadores habilitados.' O 'se' nessa frase é:",ops:["Partícula apassivadora","Pronome reflexivo","Índice de indeterminação do sujeito","Pronome recíproco"],g:2,exp:"Quando o verbo exige preposição ('precisar de'), o 'se' não pode ser apassivador — é índice de indeterminação do sujeito. O sujeito é indeterminado; o verbo fica no singular. 'Precisa-se de orientadores' = alguém/as pessoas precisam de orientadores."},
        {n:145,q:"Em 'Se eu soubesse a resposta, teria dito', os modos verbais são respectivamente:",ops:["Indicativo e indicativo","Subjuntivo e indicativo","Subjuntivo e condicional (futuro do pretérito)","Imperativo e subjuntivo"],g:2,exp:"'Soubesse' está no subjuntivo imperfeito (oração condicional com 'se'). 'Teria dito' está no futuro do pretérito (condicional) — indica uma ação que teria ocorrido caso a condição fosse satisfeita."},
        {n:146,q:"'Estudem com dedicação!' O modo verbal do verbo 'estudem' é:",ops:["Indicativo presente","Subjuntivo presente","Imperativo afirmativo","Imperativo negativo"],g:2,exp:"'Estudem' é imperativo afirmativo de 2ª pessoa do plural (vocês). O imperativo expressa ordem, pedido, conselho ou exortação. Para 'vocês', usa-se a forma do subjuntivo presente: 'que eles estudem' → 'estudem'."},
        {n:147,q:"'Quando o orientador chegar, avisem-me.' O verbo 'chegar' está no:",ops:["Futuro do presente do indicativo","Presente do indicativo","Futuro do subjuntivo","Presente do subjuntivo"],g:2,exp:"Após 'quando' com ideia de futuro, usa-se o futuro do subjuntivo: 'chegar' (futuro do subjuntivo de 'chegar'). Não se diz 'quando o orientador chegará' na norma culta — usa-se o futuro do subjuntivo nesse contexto."},
        {n:148,q:"'Ele havia terminado o relatório antes da reunião.' O tempo verbal 'havia terminado' é:",ops:["Pretérito perfeito composto","Pretérito imperfeito","Pretérito mais-que-perfeito composto","Futuro do pretérito"],g:2,exp:"'Havia terminado' é pretérito mais-que-perfeito composto — formado por 'haver' (pretérito imperfeito) + particípio. Indica ação anterior a outra ação já passada: terminou o relatório ANTES da reunião (que também é passada)."},
        {n:149,q:"'O orientador teria comparecido se tivesse sido avisado.' Os verbos indicam:",ops:["Certeza sobre o passado","Hipótese no passado — ação que não se realizou","Ordem dada no passado","Ação futura em relação ao presente"],g:1,exp:"'Teria comparecido' (futuro do pretérito composto) + 'tivesse sido avisado' (subjuntivo mais-que-perfeito composto) formam uma estrutura hipotética no passado: a ação não se realizou porque a condição não foi satisfeita."},
        {n:150,q:"Assinale a alternativa em que o verbo está no GERÚNDIO:",ops:["Tendo chegado cedo, organizou a sala.","Chegará a tempo para a reunião.","Estudando todos os dias, ela avançou.","Chegou a tempo para a reunião."],g:2,exp:"'Estudando' é gerúndio — forma nominal do verbo que indica ação em curso ou simultânea à da oração principal. O gerúndio termina em '-ndo'. 'Tendo chegado' é gerúndio composto; 'chegará' é futuro; 'chegou' é pretérito perfeito."},
      ]},
      {nome:'Sintaxe da Oração – Termos (Q151–Q160)',qs:[
        {n:151,q:"Em 'Os orientadores educacionais participaram da reunião', o sujeito é:",ops:["da reunião","participaram","Os orientadores educacionais","educacionais"],g:2,exp:"O sujeito é o termo sobre o qual se declara algo — responde 'quem praticou a ação?'. 'Os orientadores educacionais' é o sujeito simples (um núcleo: 'orientadores'). 'Educacionais' é adjunto adnominal do núcleo."},
        {n:152,q:"'Deram-se explicações aos alunos.' O sujeito dessa oração é:",ops:["aos alunos","explicações","Sujeito indeterminado","Sujeito inexistente — oração sem sujeito"],g:1,exp:"Na voz passiva sintética, o sujeito é o paciente da ação. 'Explicações' é o sujeito (paciente) — por isso o verbo concordou no plural: 'deram-se explicações'. O 'se' é partícula apassivadora."},
        {n:153,q:"Em 'Entregou-se o relatório à diretora', os termos 'o relatório' e 'à diretora' são respectivamente:",ops:["Sujeito e objeto indireto","Objeto direto e objeto indireto","Objeto direto e complemento nominal","Sujeito e adjunto adverbial"],g:0,exp:"Na voz passiva sintética com 'se', 'o relatório' é o sujeito paciente (o verbo concorda com ele). 'À diretora' é objeto indireto — indica o destinatário da ação, complementando o verbo 'entregar'."},
        {n:154,q:"'A escola oferece aos alunos oportunidades de aprendizado.' O objeto indireto é:",ops:["A escola","oportunidades de aprendizado","aos alunos","de aprendizado"],g:2,exp:"'Aos alunos' é o objeto indireto — complemento preposicionado que completa o sentido do verbo 'oferecer' (oferecer algo a alguém). 'Oportunidades de aprendizado' é o objeto direto (sem preposição)."},
        {n:155,q:"Em 'Ela chegou cansada da reunião', a palavra 'cansada' exerce a função de:",ops:["Adjunto adnominal","Predicativo do sujeito","Complemento nominal","Aposto"],g:1,exp:"'Cansada' é predicativo do sujeito — atribuído ao sujeito 'ela' por meio do verbo intransitivo 'chegar' (que aqui assume valor de ligação secundária). Indica o estado do sujeito no momento ou após a ação."},
        {n:156,q:"'O orientador, profissional dedicado, atende a todos.' O termo 'profissional dedicado' é:",ops:["Adjunto adnominal","Predicativo do sujeito","Aposto","Vocativo"],g:2,exp:"'Profissional dedicado' é aposto explicativo — termo que explica, esclarece ou desenvolve um substantivo anterior ('o orientador'). É isolado por vírgulas e poderia ser removido sem comprometer a estrutura da oração."},
        {n:157,q:"Em 'Estudou muito para o concurso', o termo 'para o concurso' é:",ops:["Objeto indireto","Complemento nominal","Adjunto adverbial de finalidade","Predicativo do objeto"],g:2,exp:"'Para o concurso' é adjunto adverbial de finalidade — indica o objetivo ou finalidade da ação de estudar. É um termo acessório que pode ser removido sem comprometer a estrutura básica da oração."},
        {n:158,q:"'Todos os alunos chegaram.' O sujeito da oração é:",ops:["alunos","Todos","Todos os alunos","chegaram"],g:2,exp:"O sujeito simples é 'Todos os alunos': núcleo 'alunos' + determinantes 'todos' e 'os' (adjuntos adnominais). O sujeito é simples porque tem um único núcleo — 'alunos'. 'Todos' é pronome indefinido com função de adjunto adnominal."},
        {n:159,q:"Em 'Chove muito no inverno', o sujeito da oração é:",ops:["inverno","muito","no inverno","A oração não tem sujeito — verbo impessoal"],g:3,exp:"Verbos que indicam fenômenos da natureza (chover, nevar, trovejar) são impessoais — não admitem sujeito. A oração não tem sujeito. 'No inverno' é adjunto adverbial de tempo; 'muito' é adjunto adverbial de intensidade."},
        {n:160,q:"'Ele considerou a proposta excelente.' O termo 'excelente' é:",ops:["Adjunto adnominal de 'proposta'","Predicativo do objeto direto","Objeto indireto","Aposto de 'proposta'"],g:1,exp:"'Excelente' é predicativo do objeto direto — atribui uma qualidade ao objeto direto 'a proposta' por meio do verbo transitivo 'considerar'. Verbos como 'considerar', 'eleger', 'nomear' e 'chamar' admitem predicativo do objeto."},
      ]},
