      {nome:'Interpretação de Texto (Q161–Q170)',qs:[
        {n:161,q:"Leia o texto: 'A orientação educacional não se limita a resolver conflitos. Ela abrange o acompanhamento do desenvolvimento integral do estudante, articulando escola, família e comunidade em torno de um projeto comum.' De acordo com o texto, a orientação educacional:",ops:["Restringe-se à mediação de conflitos disciplinares","Envolve múltiplas dimensões do desenvolvimento estudantil e articula diferentes instâncias","É responsabilidade exclusiva do orientador, sem envolvimento da família","Atua apenas no campo pedagógico-curricular"],g:1,exp:"O texto afirma explicitamente que a orientação 'não se limita a resolver conflitos' e 'abrange o acompanhamento do desenvolvimento integral', articulando escola, família e comunidade. A alternativa B sintetiza fielmente essas ideias."},
        {n:162,q:"No mesmo texto da questão anterior, o termo 'articulando' indica que a orientação educacional:",ops:["Substitui as funções da família e da comunidade","Promove a conexão e integração entre escola, família e comunidade","Age de forma independente, sem depender de outros agentes","Cria conflitos entre os diferentes grupos envolvidos"],g:1,exp:"'Articular' significa conectar, integrar, fazer funcionar em conjunto. O gerúndio 'articulando' indica que a orientação educacional exerce a função de promover a integração entre os diferentes agentes educativos em torno de um projeto comum."},
        {n:163,q:"Leia: 'O bullying não é brincadeira. É violência sistemática que deixa marcas profundas nas vítimas, podendo comprometer seu desenvolvimento emocional, social e acadêmico.' A expressão 'deixa marcas profundas' é usada em sentido:",ops:["Denotativo — refere-se a marcas físicas visíveis","Conotativo — indica consequências emocionais e psicológicas duradouras","Técnico — termo médico para lesões físicas","Irônico — minimiza os efeitos do bullying"],g:1,exp:"'Marcas profundas' é usada em sentido figurado (conotativo) — não se trata de marcas físicas literais, mas de consequências emocionais, psicológicas e sociais que persistem ao longo do tempo na vida das vítimas."},
        {n:164,q:"No texto da questão anterior, a palavra 'sistemática' qualifica a violência como:",ops:["Ocasional e espontânea","Repetida, intencional e organizada","Exclusivamente física","Praticada apenas por grupos grandes"],g:1,exp:"'Sistemática' indica que a violência é organizada, repetida e intencional — não é um episódio isolado. Esse caráter sistemático (repetição + intencionalidade) é justamente um dos critérios que definem o bullying, segundo pesquisadores como Dan Olweus."},
        {n:165,q:"Leia: 'A escola que não escuta seus alunos perde a oportunidade de compreendê-los. E sem compreensão, não há educação — há apenas transmissão de conteúdo.' O autor do texto defende que:",ops:["A transmissão de conteúdo é suficiente para uma boa educação","A escuta ativa dos alunos é condição essencial para que a educação de fato ocorra","A escola deve abrir mão do conteúdo curricular","Os alunos são os únicos responsáveis pelo processo educativo"],g:1,exp:"O texto estabelece que sem escuta não há compreensão, e sem compreensão 'não há educação'. Logo, o autor defende que a escuta dos alunos é condição necessária para a educação real, diferenciando-a da mera transmissão de conteúdo."},
        {n:166,q:"No texto da questão anterior, o trecho 'não há educação — há apenas transmissão de conteúdo' utiliza o travessão para:",ops:["Indicar início de fala em diálogo","Introduzir uma retificação ou contraste que aprofunda a ideia anterior","Separar um aposto explicativo","Indicar enumeração de elementos"],g:1,exp:"O travessão, nesse contexto, introduz uma correção ou contraste: o autor nega a educação e, em seguida, especifica o que realmente ocorre ('apenas transmissão de conteúdo'). Funciona como um recurso de retificação ou precisão do pensamento."},
        {n:167,q:"Leia: 'Investir na formação do orientador educacional é investir no futuro da escola.' Essa afirmação estabelece uma relação de:",ops:["Causa e consequência entre formação e futuro","Equivalência — a formação do orientador É o futuro da escola","Oposição entre formação e resultado","Concessão — mesmo sem formação, a escola tem futuro"],g:0,exp:"'Investir na formação... é investir no futuro' estabelece uma relação de causa e consequência: a formação do orientador causa impacto no futuro da escola. A construção paralela reforça que um investimento leva ao outro."},
        {n:168,q:"'O PPP não é um documento burocrático qualquer. É a identidade viva da escola.' O recurso expressivo presente em 'identidade viva' é:",ops:["Hipérbole","Metonímia","Metáfora","Comparação"],g:2,exp:"'Identidade viva' é uma metáfora — o PPP (documento) é identificado com algo que tem vida, dinamismo, que pulsa. Não há conectivo comparativo ('como'), portanto não é comparação. É uma identificação implícita e figurada."},
        {n:169,q:"Leia: 'Sem participação da comunidade, o PPP perde sua legitimidade e se torna letra morta.' A expressão 'letra morta' significa:",ops:["Um texto difícil de ler","Um documento sem efeito prático, ignorado na realidade","Uma lei revogada formalmente","Um texto com erros gramaticais"],g:1,exp:"'Letra morta' é uma expressão idiomática que designa algo que existe formalmente (no papel) mas não tem efeito prático na realidade. No contexto, o PPP construído sem participação comunitária não é aplicado nem respeitado."},
        {n:170,q:"No texto 'A escola inclusiva não é aquela que tolera as diferenças; é a que as celebra', o uso do ponto e vírgula serve para:",ops:["Separar itens de uma enumeração","Indicar uma pausa maior que a vírgula entre duas orações que se contrapõem","Substituir os dois pontos antes de uma citação","Encerrar um período longo"],g:1,exp:"O ponto e vírgula separa duas orações coordenadas mais longas ou com sentido contrastante. Aqui, contrapõe 'tolerar' (postura passiva) a 'celebrar' (postura ativa) as diferenças — a separação por ponto e vírgula marca esse contraste com ênfase."},
      ]},
      {nome:'Variação Linguística e Tipos Textuais (Q171–Q180)',qs:[
        {n:171,q:"A variação linguística que ocorre em função da região geográfica do falante é chamada de:",ops:["Variação diastrática","Variação diatópica (ou dialetal)","Variação diafásica","Variação diacrônica"],g:1,exp:"A variação diatópica (ou dialetal) está relacionada à localização geográfica do falante — sotaques, vocabulário e construções típicas de determinadas regiões. Diastrática = classe social; diafásica = situação de comunicação; diacrônica = mudança ao longo do tempo."},
        {n:172,q:"Um orientador que adapta sua linguagem ao falar com alunos do Ensino Fundamental, com pais e com a equipe técnica está exercendo qual tipo de variação?",ops:["Variação diatópica","Variação diacrônica","Variação diafásica (ou de registro)","Variação diastrática"],g:2,exp:"A variação diafásica (ou de registro) refere-se à adequação da linguagem conforme a situação comunicativa — formal ou informal, oral ou escrita, com interlocutores de diferentes perfis. O orientador adapta o registro ao contexto de cada interlocução."},
        {n:173,q:"'O preconceito linguístico ocorre quando se considera uma variedade linguística superior às demais.' Essa afirmação está:",ops:["Correta — toda língua tem uma variedade naturalmente correta","Incorreta — todas as variedades linguísticas são igualmente válidas e expressivas","Correta — a norma culta é superior às variedades populares","Incorreta — só existe preconceito linguístico em relação à língua escrita"],g:1,exp:"Do ponto de vista da Linguística, todas as variedades são igualmente válidas como sistemas de comunicação. O preconceito linguístico é uma construção social que hierarquiza variedades por critérios extralinguísticos (classe, região, escolaridade)."},
        {n:174,q:"Um texto que narra sequência de eventos em ordem cronológica, com personagens, tempo e espaço definidos, é classificado como:",ops:["Texto dissertativo-argumentativo","Texto narrativo","Texto descritivo","Texto injuntivo"],g:1,exp:"O texto narrativo apresenta uma sequência de fatos/eventos organizados no tempo, com elementos como narrador, personagens, tempo, espaço e enredo. Exemplos: contos, crônicas, romances, notícias jornalísticas."},
        {n:175,q:"Um edital de concurso público, uma bula de remédio e uma receita culinária são exemplos de texto:",ops:["Narrativo","Dissertativo","Injuntivo (ou instrucional)","Descritivo"],g:2,exp:"O texto injuntivo (ou instrucional/prescritivo) tem como objetivo orientar o leitor a realizar ações — apresenta instruções, normas, regras ou procedimentos. É caracterizado pelo uso de verbos no imperativo ou infinitivo."},
        {n:176,q:"'Assim como Dom Casmurro questiona a fidelidade de Capitu, a escola frequentemente questiona a capacidade dos alunos sem provas concretas.' Esse trecho apresenta:",ops:["Paráfrase","Intertextualidade por alusão","Plágio","Paródia"],g:1,exp:"Intertextualidade por alusão: referência implícita ou explícita a outro texto ou obra (Dom Casmurro, de Machado de Assis) para construir sentido no novo contexto. Não copia o texto original — apenas evoca personagens ou situações conhecidas."},
        {n:177,q:"A norma culta da língua portuguesa é:",ops:["A única forma correta de falar e escrever em qualquer situação","A variedade de prestígio social, adequada a situações formais e à escrita oficial","Superior linguisticamente às demais variedades","A língua falada exclusivamente pelas classes mais ricas"],g:1,exp:"A norma culta é a variedade de maior prestígio social, codificada em gramáticas e dicionários, usada em contextos formais (escrita oficial, concursos, literatura). Não é superior linguisticamente — é uma variedade socialmente valorizada em determinados contextos."},
        {n:178,q:"'A escola deve ser um espelho da sociedade que queremos construir.' Esse enunciado pertence predominantemente ao tipo textual:",ops:["Narrativo","Descritivo","Dissertativo-argumentativo","Injuntivo"],g:2,exp:"O enunciado apresenta uma tese (a escola deve refletir a sociedade desejada) — característica do texto dissertativo-argumentativo, que defende um ponto de vista com base em argumentos e reflexões."},
        {n:179,q:"Assinale a alternativa que apresenta um exemplo de COESÃO textual por substituição lexical:",ops:["Ela estudou muito. Ela foi aprovada.","O orientador chegou. O profissional logo abriu a sala.","Estudou e foi aprovada.","A reunião começou. Depois, ela terminou."],g:1,exp:"Coesão por substituição lexical: um termo é substituído por outro (sinônimo, hiperônimo ou expressão equivalente) para evitar repetição e manter a coesão. 'O orientador' é substituído por 'O profissional' — referência ao mesmo ser por termo diferente."},
        {n:180,q:"Em um texto argumentativo, a coerência textual depende principalmente de:",ops:["Uso de palavras difíceis e vocabulário técnico","Progressão lógica das ideias, sem contradições, adequada ao tema proposto","Quantidade de parágrafos e extensão do texto","Uso exclusivo da norma culta sem nenhuma variação de registro"],g:1,exp:"A coerência textual é a propriedade que torna o texto logicamente organizado e sem contradições. Depende da progressão temática, da não contradição entre as partes e da adequação ao contexto comunicativo — independe do tamanho ou do nível vocabular."},
      ]},
      {nome:'Coesão, Pronomes e Revisão Geral (Q181–Q190)',qs:[
        {n:181,q:"'Os alunos chegaram cedo. Eles logo ocuparam seus lugares.' O pronome 'Eles' exerce função de:",ops:["Coesão por elipse","Coesão referencial anafórica","Coesão por substituição lexical","Coesão por conectivo"],g:1,exp:"Coesão referencial anafórica: o pronome 'Eles' retoma um termo já mencionado anteriormente ('Os alunos'). A referência anafórica aponta para trás no texto, criando elo coesivo entre as frases."},
        {n:182,q:"Assinale a alternativa em que o pronome relativo está CORRETAMENTE empregado:",ops:["O aluno que eu confio sempre estuda.","A escola aonde estudei foi reformada.","O projeto do qual participamos foi aprovado.","A diretora quem apresentou o PPP é experiente."],g:2,exp:"'Do qual' é pronome relativo corretamente usado após preposição exigida pelo verbo 'participar de': 'o projeto do qual participamos'. 'Que' sem preposição em A está errado ('em quem confio'); 'aonde' exige verbo de movimento; 'quem' em D substitui pessoa, mas o relativo aqui exigiria 'que'."},
        {n:183,q:"Em 'Cada um fez a sua parte', o pronome 'sua' se refere a:",ops:["Uma pessoa específica já mencionada","Cada indivíduo do grupo — pronome de retomada indefinida","O narrador do texto","A parte do trabalho, como objeto"],g:1,exp:"O pronome possessivo 'sua' retoma o pronome indefinido 'cada um', concordando com ele. Como 'cada um' é indefinido e singular, 'sua' também é singular — cada indivíduo fez a parte que lhe cabia."},
        {n:184,q:"'Embora o orientador estivesse ocupado, atendeu o aluno prontamente.' Nessa frase, a ideia expressa é de:",ops:["Causa — o orientador atendeu por estar ocupado","Concessão — atendeu apesar do obstáculo do estar ocupado","Condição — atenderia se estivesse ocupado","Finalidade — atendeu para ficar ocupado"],g:1,exp:"'Embora' introduz oração concessiva — indica que havia um obstáculo (estar ocupado), mas que a ação principal ocorreu mesmo assim. A concessão admite o obstáculo sem negar o resultado."},
        {n:185,q:"'Quanto mais se estuda, mais se aprende.' Essa construção expressa relação de:",ops:["Concessão","Proporcionalidade","Condição","Oposição"],g:1,exp:"A construção 'quanto mais... mais' (ou 'quanto menos... menos') expressa proporcionalidade — indica que duas situações variam na mesma proporção. É uma relação de conformidade proporcional entre as orações."},
        {n:186,q:"Assinale a alternativa em que o uso de 'onde' está CORRETO:",ops:["Não sei onde você quer chegar com isso.","A escola onde estudei foi demolida.","O motivo onde tudo começou era simples.","O dia onde tudo mudou foi inesquecível."],g:1,exp:"'Onde' é pronome relativo que se refere a lugar. 'A escola onde estudei' — 'onde' substitui 'na qual' (na escola). Nas demais alternativas, 'onde' está incorreto: em A deveria ser 'aonde'; em C e D refere-se a conceito abstrato, não a lugar — deveria ser 'pelo qual' ou 'em que'."},
        {n:187,q:"'Não foi o aluno que faltou, mas o professor.' O pronome relativo 'que' retoma:",ops:["'professor'","'aluno'","Ambos os termos simultaneamente","Nenhum dos dois — é conjunção"],g:1,exp:"O pronome relativo 'que' retoma 'o aluno' (antecedente imediato). A oração 'que faltou' é subordinada adjetiva restritiva que identifica quem faltou — restringe a referência ao aluno (e não ao professor)."},
        {n:188,q:"Em 'Trata-se de uma questão complexa', o 'se' é:",ops:["Partícula apassivadora","Pronome reflexivo","Índice de indeterminação do sujeito","Pronome recíproco"],g:2,exp:"O verbo 'tratar-se de' é pronominal e exige preposição. Como há preposição após o verbo ('de uma questão'), o 'se' não pode ser apassivador — é índice de indeterminação do sujeito. O sujeito está indeterminado."},
        {n:189,q:"'O orientador disse que voltaria logo.' O discurso indireto nessa frase substitui qual discurso direto?",ops:["O orientador disse: — Voltarei logo.","O orientador disse: — Voltaria logo.","O orientador disse: — Ele voltará logo.","O orientador disse: — Volte logo."],g:0,exp:"Na transposição do discurso direto para o indireto, o futuro do presente ('voltarei') torna-se futuro do pretérito ('voltaria'), e a 1ª pessoa passa para a 3ª. Portanto, 'voltaria' no indireto corresponde a 'Voltarei' no direto."},
        {n:190,q:"Assinale a alternativa que apresenta frase com AMBIGUIDADE:",ops:["O aluno entregou o trabalho à professora ontem.","Vi o orientador com o binóculo na mão.","A diretora aprovou o projeto de inclusão.","Os alunos chegaram antes da reunião começar."],g:1,exp:"'Vi o orientador com o binóculo' é ambígua: pode significar que eu usei o binóculo para ver o orientador, ou que o orientador estava com o binóculo. A ambiguidade ocorre porque 'com o binóculo' pode se ligar tanto ao sujeito quanto ao objeto."},
      ]},
      {nome:'Revisão Final – Questões Mistas (Q191–Q200)',qs:[
        {n:191,q:"Assinale a alternativa em que todas as frases estão CORRETAS quanto à norma culta:",ops:["Havia muitos alunos; todos chegaram cedo; a reunião foi ótima.","Haviam muitos alunos; todos chegaram cedo; a reunião foi ótima.","Havia muitos alunos; todos chegaram cedo; a reunião foi ótimo.","Haviam muitos alunos; todos chegaram cedo; a reunião foi ótimo."],g:0,exp:"'Havia' (impessoal, singular), 'chegaram' (plural — concorda com 'todos') e 'foi ótima' (concorda com 'reunião', feminino) — todas corretas em A. Nas demais há erro em 'haviam' (B e D) ou em 'ótimo' sem concordar com 'reunião' (C e D)."},
        {n:192,q:"'Ele entregou o relatório a mim pessoalmente.' Essa frase está:",ops:["Errada — deveria ser 'para eu'","Correta — pronome tônico 'mim' após preposição 'a'","Errada — deveria ser 'para mim'","Correta, mas 'a mim' pode ser substituído por 'me' em qualquer posição"],g:1,exp:"Após preposição, usa-se pronome tônico: 'a mim', 'para mim', 'por mim'. 'Para eu' só é correto quando seguido de infinitivo: 'para eu fazer'. 'A mim pessoalmente' está correto — preposição + pronome tônico oblíquo."},
        {n:193,q:"Em 'Mal chegou, já foi embora', a palavra 'Mal' é:",ops:["Adjetivo indicando qualidade negativa","Advérbio de tempo com sentido de 'assim que / logo que'","Conjunção adversativa","Substantivo"],g:1,exp:"'Mal' com sentido de 'assim que', 'logo que', 'tão logo' é advérbio temporal — indica que a ação seguinte ocorreu imediatamente após a primeira. 'Mal chegou' = assim que chegou. Não confundir com 'mau' (adjetivo) ou 'mal' (advérbio de modo)."},
        {n:194,q:"Assinale a alternativa em que 'porque', 'por que', 'por quê' ou 'porquê' está empregado CORRETAMENTE:",ops:["Não sei porque ele faltou à reunião.","Estudou muito, por que foi aprovado.","Por que você não compareceu à reunião?","Qual é o porquê de tanta confusão?... — sem sentido"],g:2,exp:"'Por que' (separado, sem acento) é usado em perguntas diretas e indiretas, equivalendo a 'por qual razão': 'Por que você não compareceu?' está correto. Em A, antes de oração, usa-se 'por que' (separado); em B, deveria ser 'porque' (causal); em D, 'o porquê' (substantivo) está correto também — mas C é a alternativa mais claramente correta."},
        {n:195,q:"'O projeto, que foi apresentado ontem, agradou a todos.' Se retirarmos a oração 'que foi apresentado ontem', o sentido essencial da frase:",ops:["Muda completamente","É preservado — a oração é adjetiva explicativa e acessória","É prejudicado — a oração é restritiva e essencial","Fica ambíguo sem ela"],g:1,exp:"Com vírgulas, a oração adjetiva é explicativa — acrescenta informação acessória que pode ser retirada sem comprometer o sentido essencial: 'O projeto agradou a todos' permanece completo e claro. Se fosse restritiva (sem vírgulas), sua retirada limitaria ou alteraria o sentido."},
        {n:196,q:"'Mais vale um pássaro na mão do que dois voando.' Esse provérbio utiliza predominantemente:",ops:["Linguagem técnica e denotativa","Linguagem conotativa e figurada","Linguagem científica","Linguagem injuntiva com verbos no imperativo"],g:1,exp:"O provérbio usa linguagem figurada (conotativa): 'pássaro na mão' e 'dois voando' representam, respectivamente, o que se tem concretamente e o que é incerto. É uma metáfora popular que transmite uma lição de forma indireta."},
        {n:197,q:"Em 'Aos gritos, o aluno pediu socorro', o adjunto adverbial 'Aos gritos' indica:",ops:["Tempo","Lugar","Modo","Causa"],g:2,exp:"'Aos gritos' é adjunto adverbial de modo — indica a maneira como o aluno pediu socorro. Adjuntos adverbiais de modo respondem à pergunta 'como?': pediu socorro como? Aos gritos."},
        {n:198,q:"'Quanto ao PPP, cabe à equipe escolar construí-lo coletivamente.' A expressão 'Quanto ao PPP' exerce a função de:",ops:["Sujeito da oração","Adjunto adverbial de assunto","Objeto direto do verbo 'cabe'","Aposto do sujeito"],g:1,exp:"'Quanto ao PPP' é uma locução prepositiva que introduz o tema/assunto sobre o qual se faz a declaração — adjunto adverbial de assunto (ou de referência). Indica sobre o que trata a afirmação, funcionando como moldura temática do enunciado."},
        {n:199,q:"Assinale a alternativa em que a frase NÃO apresenta erro de regência, concordância ou colocação pronominal:",ops:["Os alunos obedeceram as regras e se saíram bem nas provas.","Nenhum dos candidatos se inscreveu no prazo correto.","Haviam três vagas disponíveis para o cargo.","Me parece que a decisão foi acertada."],g:1,exp:"'Nenhum dos candidatos se inscreveu' — sujeito singular ('nenhum'), verbo no singular ('inscreveu'), pronome reflexivo correto ('se'). Em A, 'obedeceram as regras' (falta preposição 'às') e 'se saíram' (início de frase); em C, 'haviam' deveria ser 'havia'; em D, 'Me parece' inicia frase com próclise indevida."},
        {n:200,q:"Leia: 'O orientador educacional é, antes de tudo, um educador. Sua maior ferramenta não é o relatório nem o prontuário — é a escuta.' Assinale a afirmação que melhor interpreta o texto:",ops:["O orientador não deve elaborar relatórios nem prontuários","A escuta é apresentada como o instrumento mais fundamental da atuação do orientador","O texto critica o uso de documentos na orientação educacional","O orientador deve substituir documentos por conversas informais"],g:1,exp:"O texto usa a estrutura 'não é X — é Y' para hierarquizar: a escuta é colocada acima dos instrumentos burocráticos (relatório, prontuário). O autor não condena os documentos, mas afirma que a escuta é a ferramenta mais essencial. A alternativa B interpreta fielmente essa hierarquia."},
      ]}
    ]
  },
  {
    id:'sim1b',titulo:'Simulado 1B – Língua Portuguesa Avançado (FGV) – Nível Difícil',banca:'FGV',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Interpretação e Gramática – Nível Difícil (Q1–Q10)',qs:[
        {n:1,q:"Leia o trecho: 'A escola, longe de ser um espaço neutro, é arena de disputas simbólicas onde se reproduzem — e eventualmente se contestam — as hierarquias sociais.' O emprego do travessão no trecho sublinhado indica:",ops:["Uma correção do que foi dito anteriormente, invalidando a ideia de reprodução","Uma ressalva ou adição que introduz ideia contrária e complementar à reprodução das hierarquias","Uma explicação do significado de 'arena de disputas simbólicas'","Um aposto que especifica quais hierarquias são reproduzidas"],g:1,exp:"O travessão isola a expressão 'e eventualmente se contestam', que introduz uma ressalva (as hierarquias também podem ser contestadas) em contraposição à ideia de reprodução. O recurso enfatiza que a escola não apenas replica, mas pode subverter hierarquias."},
        {n:2,q:"'O orientador que se omite diante do conflito não é neutro: é conivente.' O sinal de dois pontos nessa frase:",ops:["Introduz enumeração de características do orientador omisso","Antecede citação de outro autor no contexto do texto","Introduz uma retificação enfática que redefine a omissão como conivência","Separa duas orações independentes sem relação lógica entre si"],g:2,exp:"Os dois pontos introduzem uma retificação: o autor nega a neutralidade ('não é neutro') e substitui pela definição mais precisa e severa ('é conivente'). Esse recurso confere força argumentativa ao enunciado."},
        {n:3,q:"'A evasão escolar não é um problema; é um sintoma.' Qual é o efeito expressivo dessa construção?",ops:["Hipérbole que exagera a gravidade da evasão","Antítese que nega o problema para afirmar uma causa subjacente mais profunda","Eufemismo que suaviza o impacto da evasão","Metalinguagem que define o conceito de evasão"],g:1,exp:"A construção 'não é X; é Y' opera uma antítese funcional: nega uma categoria ('problema' — efeito visível) para afirmar outra mais profunda ('sintoma' — sinal de algo subjacente). O autor argumenta que combater a evasão exige tratar suas causas, não apenas seus efeitos."},
        {n:4,q:"Em 'Poucos orientadores, se é que existem, desconhecem a legislação vigente', a expressão 'se é que existem' é:",ops:["Oração subordinada adverbial condicional que indica dúvida sobre a existência dos orientadores","Oração intercalada parentética que reforça a quase impossibilidade do que é afirmado","Aposto explicativo de 'poucos orientadores'","Oração coordenada sindética que adiciona informação sobre os orientadores"],g:1,exp:"'Se é que existem' é uma oração intercalada (parentética) com valor de reforço hiperbólico — sugere que talvez não existam sequer 'poucos' orientadores que desconheçam a lei. Intensifica a afirmação de que praticamente todos conhecem a legislação."},
        {n:5,q:"'Mediar conflitos pressupõe, antes de qualquer técnica, a disposição genuína de ouvir.' O sujeito do verbo 'pressupõe' é:",ops:["qualquer técnica","a disposição genuína de ouvir","Mediar conflitos (oração substantiva subjetiva no infinitivo)","Sujeito indeterminado — oração impessoal"],g:2,exp:"O sujeito é a oração infinitiva 'Mediar conflitos' — subordinada substantiva subjetiva. Verbos como 'pressupor', 'implicar', 'requerer' aceitam orações infinitivas como sujeito. O complemento é 'a disposição genuína de ouvir' (objeto direto)."},
        {n:6,q:"Assinale a alternativa em que a substituição do trecho em destaque NÃO preserva o sentido original: 'O projeto foi bem recebido, EMBORA houvesse resistências iniciais.'",ops:["...apesar de haver resistências iniciais.","...não obstante houvesse resistências iniciais.","...posto que houvesse resistências iniciais.","...ainda que houvesse resistências iniciais."],g:2,exp:"'Posto que' é conjunção concessiva em registros arcaicos/formais, mas seu uso contemporâneo predominante é CAUSAL ('já que', 'visto que'). Substituir 'embora' por 'posto que' altera o sentido de concessão para causa, comprometendo o sentido. As demais opções (apesar de, não obstante, ainda que) são concessivas equivalentes."},
        {n:7,q:"Em 'Não é o cargo que faz o orientador, mas a postura que adota diante de cada aluno', a oração 'que adota diante de cada aluno' é:",ops:["Subordinada adjetiva explicativa — entre vírgulas, acessória","Subordinada adjetiva restritiva — sem vírgulas, delimita qual postura","Subordinada substantiva objetiva direta do verbo 'faz'","Coordenada sindética aditiva ligada por 'que'"],g:1,exp:"'Que adota diante de cada aluno' é oração subordinada adjetiva restritiva: introduzida pelo pronome relativo 'que', restringe o antecedente 'postura' (não qualquer postura, mas especificamente aquela que o orientador adota). A ausência de vírgulas confirma o caráter restritivo."},
        {n:8,q:"'Quanto mais a escola se fecha sobre si mesma, tanto menos consegue cumprir sua missão social.' A estrutura sintática dessa frase corresponde a:",ops:["Período com oração principal e oração subordinada adverbial condicional","Período com duas orações coordenadas adversativas","Período com oração principal e oração subordinada adverbial proporcional","Período com duas orações subordinadas substantivas"],g:2,exp:"'Quanto mais... tanto menos' é a estrutura clássica da oração subordinada adverbial proporcional — indica que as duas ações variam em proporção inversa. A oração introduzida por 'quanto mais' é a subordinada proporcional; a introduzida por 'tanto menos' é a principal."},
        {n:9,q:"A palavra 'eventualmente' em 'as hierarquias são eventualmente contestadas' significa:",ops:["Sempre, de forma contínua","Nunca, em nenhuma hipótese","Às vezes, em determinadas circunstâncias","Urgentemente, com grande velocidade"],g:2,exp:"'Eventualmente' em português significa 'às vezes', 'em certos casos', 'ocasionalmente' — NÃO significa 'finalmente' ou 'eventualmente' no sentido do falso cognato inglês ('eventually' = finalmente). É um erro frequente de interferência do inglês. FGV costuma testar esse falso cognato."},
        {n:10,q:"'Os dados revelaram que o problema era mais complexo do que se supunha.' Nessa frase, o modo subjuntivo em 'supunha' se justifica porque:",ops:["O verbo 'revelar' exige subjuntivo em suas completivas","O pretérito imperfeito do indicativo e do subjuntivo têm a mesma forma para esse verbo","O pronome 'se' impõe o uso do subjuntivo","A oração expressa hipótese ou suposição, contexto que favorece o subjuntivo"],g:3,exp:"'Se supunha' — o 'se' é índice de indeterminação e o verbo está no pretérito imperfeito do indicativo ('supunha'), não do subjuntivo. A forma do subjuntivo seria 'supusesse'. FGV testa a distinção: 'supunha' (ind.) vs 'supusesse' (subj.). O contexto de suposição utiliza o indicativo aqui, não o subjuntivo."},
      ]},
      {nome:'Gramática Avançada e Estilística (Q11–Q20)',qs:[
        {n:11,q:"'Ele falou, falou e não disse nada.' O recurso expressivo presente na repetição de 'falou' é:",ops:["Anáfora com função de gradação crescente","Polissíndeto com função de ênfase na duração e inutilidade da fala","Aliteração que cria efeito sonoro","Paralelismo sintático sem valor semântico adicional"],g:1,exp:"A repetição do mesmo verbo ('falou, falou') é polissíndeto quando a repetição inclui conjunção, mas aqui a repetição direta cria efeito de insistência e prolongamento — enfatiza que a fala foi extensa porém vazia. O contraste com 'não disse nada' cria a antítese que sustenta o sentido."},
        {n:12,q:"Assinale a frase em que o pronome relativo está INCORRETAMENTE empregado segundo a norma culta:",ops:["O tema sobre o qual discutimos é relevante para o concurso.","A escola em que trabalho foi reformada recentemente.","O orientador com quem conversei tem vasta experiência.","Este é o projeto que me referi na reunião anterior."],g:3,exp:"Em D, 'me referi' exige preposição 'a': 'o projeto a que me referi' ou 'o projeto ao qual me referi'. A supressão da preposição configura erro de regência — o pronome relativo deve vir acompanhado da preposição exigida pelo verbo."},
        {n:13,q:"'Será que a escola ainda acredita no aluno?' O modo verbal de 'acredita' e o efeito de 'Será que' são:",ops:["Indicativo presente; 'Será que' marca certeza sobre a crença da escola","Indicativo presente; 'Será que' introduz dúvida ou questionamento retórico","Subjuntivo presente; 'Será que' exige subjuntivo como oração condicional","Futuro do presente; 'Será que' é locução temporal"],g:1,exp:"'Acredita' é indicativo presente. 'Será que' é locução interrogativa que introduz dúvida, questionamento ou reflexão — não altera o modo do verbo da oração seguinte. O efeito é retórico: questionar a crença da escola no aluno."},
        {n:14,q:"Em 'Faz-se necessário repensar os modelos de gestão escolar', a construção com 'se' indica:",ops:["Voz passiva sintética — 'os modelos' é o sujeito paciente","Oração reflexiva — o sujeito pratica e recebe a ação","Oração impessoal com 'se' de indeterminação — não há sujeito determinado","Locução verbal com particípio concordando com o predicativo"],g:2,exp:"'Faz-se necessário' + infinitivo é construção impessoal: o 'se' é índice de indeterminação, não apassivador (pois 'fazer' + adjetivo predicativo não admite passiva sintética nesse contexto). Não há sujeito determinado na oração."},
        {n:15,q:"O período 'Ou o orientador constrói pontes, ou constrói muros' utiliza que figura e que efeito?",ops:["Gradação — intensifica progressivamente a ideia de construção","Antítese com paralelismo sintático — opõe duas ações excludentes com estrutura simétrica","Metonímia — 'pontes' e 'muros' representam a escola","Hipérbole — exagera as possibilidades de ação do orientador"],g:1,exp:"'Pontes' e 'muros' são metáforas antitéticas (aproximar vs. separar) apresentadas em estrutura sintática paralela ('Ou... constrói..., ou... constrói...'). A antítese com paralelismo cria força argumentativa ao apresentar as duas únicas opções como excludentes."},
        {n:16,q:"'Os alunos, cansados e desmotivados, abandonaram a sala.' O termo 'cansados e desmotivados' é:",ops:["Aposto explicativo de 'Os alunos'","Predicativo do sujeito pós-verbal","Adjunto adnominal de 'alunos'","Predicativo do sujeito — atribuído ao sujeito e isolado por vírgulas"],g:3,exp:"'Cansados e desmotivados', isolado por vírgulas e referindo-se ao estado do sujeito ('Os alunos'), é predicativo do sujeito anteposto ao verbo. Diferente do adjunto adnominal (que seria sem vírgulas, dentro do sintagma nominal), o predicativo indica um estado atribuído ao sujeito."},
        {n:17,q:"Assinale a alternativa em que a concordância verbal com sujeito posposto está CORRETA:",ops:["Faltou provas concretas para embasar a decisão.","Chegaram ao orientador inúmeras reclamações de pais.","Restou apenas duas alternativas viáveis para o projeto.","Existia muitos obstáculos no caminho da implementação."],g:1,exp:"Em B, o sujeito 'inúmeras reclamações de pais' está posposto ao verbo 'chegaram' — a concordância no plural está correta. Em A, 'faltou' deveria ser 'faltaram' (sujeito 'provas concretas'); em C, 'restou' deveria ser 'restaram'; em D, 'existia' deveria ser 'existiam'."},
        {n:18,q:"'Nenhum orientador ignora o quão complexa é a relação escola-família.' A forma 'quão' é:",ops:["Advérbio interrogativo em oração indireta que intensifica o adjetivo 'complexa'","Pronome relativo que retoma 'relação escola-família'","Conjunção subordinativa que introduz oração causal","Advérbio de negação que reforça 'nenhum'"],g:0,exp:"'Quão' é advérbio de intensidade usado em orações exclamativas ou interrogativas indiretas. Em 'o quão complexa é a relação', introduz interrogativa indireta e intensifica o adjetivo 'complexa' — equivale a 'quanto' em registros mais formais."},
        {n:19,q:"'A proposta, conquanto inovadora, apresentava riscos consideráveis.' A conjunção 'conquanto' equivale a:",ops:["porque","portanto","embora","conforme"],g:2,exp:"'Conquanto' é conjunção subordinativa concessiva de registro erudito/formal, equivalente a 'embora', 'ainda que', 'mesmo que'. Indica concessão: a proposta era inovadora, mas isso não impediu que apresentasse riscos. FGV frequentemente usa conjunções de registro culto para testar o repertório do candidato."},
        {n:20,q:"Em 'Ao orientador cumpre zelar pelo desenvolvimento integral do educando', o verbo 'cumpre' é empregado como:",ops:["Transitivo direto, tendo 'zelar pelo desenvolvimento' como objeto direto","Impessoal no sentido de 'cabe', 'compete', sem sujeito determinado","Verbo de ligação, ligando 'ao orientador' ao predicativo 'zelar'","Transitivo indireto, regendo 'ao orientador' como objeto indireto"],g:1,exp:"'Cumprir' no sentido de 'caber', 'competir', 'ser dever de' é verbo impessoal — não possui sujeito determinado. 'Ao orientador' é objeto indireto (dativo de interesse). A construção equivale a 'Cabe ao orientador zelar...'. FGV testa esse uso impessoal de verbos como 'cumprir', 'convir', 'importar'."},
      ]},
      {nome:'Sintaxe e Semântica Avançadas (Q21–Q30)',qs:[
        {n:21,q:"Leia: 'O silêncio do aluno nem sempre é sinal de compreensão; pode ser, ao contrário, indício de alienação.' A expressão 'ao contrário' exerce função de:",ops:["Adjunto adverbial de modo, indicando a maneira do processo","Conectivo adversativo-explicativo que reorienta o sentido da afirmação anterior","Aposto de 'silêncio'","Conjunção conclusiva que encerra o raciocínio"],g:1,exp:"'Ao contrário' é locução adverbial que funciona como operador argumentativo adversativo: reorienta o sentido do enunciado anterior, indicando que o silêncio pode significar exatamente o oposto do que se poderia supor (compreensão → alienação)."},
        {n:22,q:"'Tamanha era a dedicação da orientadora que todos os alunos foram atendidos.' A oração 'que todos os alunos foram atendidos' é:",ops:["Subordinada adverbial consecutiva — exprime consequência da intensidade de 'tamanha'","Subordinada adjetiva explicativa de 'dedicação'","Subordinada substantiva objetiva direta de 'era'","Coordenada sindética conclusiva introduzida por 'que'"],g:0,exp:"A estrutura 'tão/tanto/tamanho... que' é a construção clássica de oração subordinada adverbial consecutiva: a intensidade expressa pelo correlativo ('tamanha') gera a consequência introduzida por 'que'. FGV frequentemente cobra essa estrutura correlativa."},
        {n:23,q:"Assinale a alternativa em que o uso de 'mas' NÃO exprime adversidade, mas outro valor semântico:",ops:["Estudou muito, mas não foi aprovado.","Não só chegou cedo, mas também preparou todo o material.","Ele prometeu, mas não cumpriu.","A escola é pequena, mas acolhedora."],g:1,exp:"Em B, 'mas também' integra a correlação 'não só... mas também', que tem valor ADITIVO com ênfase — não adversativo. As demais alternativas usam 'mas' com valor adversativo clássico (introduz contraste ou restrição)."},
        {n:24,q:"'Seja como for, o orientador deve manter a postura ética.' A oração 'Seja como for' é:",ops:["Subordinada adverbial condicional","Subordinada adverbial concessiva de forma indeterminada","Oração coordenada assindética","Oração principal do período"],g:1,exp:"'Seja como for' é uma concessiva de forma indeterminada — concede que, qualquer que seja a situação, a postura ética deve ser mantida. É uma construção concessiva com valor totalizante, equivalente a 'independentemente de como seja a situação'."},
        {n:25,q:"Em 'O que mais impressiona no trabalho do orientador não é a técnica, mas a presença', o sujeito do verbo 'impressiona' é:",ops:["O orientador","a técnica","O que mais impressiona no trabalho do orientador","O que mais"],g:2,exp:"O sujeito é a oração substantiva 'O que mais impressiona no trabalho do orientador' — mas essa é a própria oração! Na verdade, a estrutura é: sujeito = 'O que mais [impressiona no trabalho do orientador]' — pronome relativo 'o que' + oração relativa livre. O sujeito é a oração relativa substantivada 'O que mais [se destaca]'."},
        {n:26,q:"'Não fosse a intervenção do orientador, o conflito teria escalado.' Qual é o valor da oração 'Não fosse a intervenção do orientador'?",ops:["Causal — indica a causa do conflito","Condicional com ideia de hipótese contrária ao fato real (contrafactual)","Temporal — situa o conflito no tempo","Concessiva — admite a intervenção como obstáculo superado"],g:1,exp:"'Não fosse' + pretérito do subjuntivo é construção condicional contrafactual: indica hipótese contrária à realidade (a intervenção ocorreu; sem ela, o conflito teria escalado). Equivale a 'Se não fosse a intervenção...'. FGV cobra esse uso do subjuntivo em condicionais sem 'se'."},
        {n:27,q:"'Ele leu o relatório todo.' e 'Todo ele leu o relatório.' Qual a diferença de sentido?",ops:["Não há diferença; 'todo' é invariável nessas posições","Na primeira, 'todo' = inteiro (leu completamente); na segunda, 'todo' = cada um/enfático (ele, especificamente)","Na primeira, 'todo' é pronome indefinido; na segunda, é adjetivo predicativo","As duas frases são agramaticais na norma culta"],g:1,exp:"A posição de 'todo' altera o sentido: posposto ao substantivo ('o relatório todo') = inteiramente, completamente; anteposto com ênfase ('Todo ele') = ele por inteiro, enfático. FGV testa essa distinção semântica clássica de posição do adjetivo."},
        {n:28,q:"Leia: 'Ao cabo de anos de prática, o orientador aprende que escutar é mais difícil do que falar.' A expressão 'Ao cabo de' equivale a:",ops:["Apesar de","Com o objetivo de","Ao final de / depois de (indica término de período)","Em razão de"],g:2,exp:"'Ao cabo de' é locução prepositiva que indica o término de um período ou processo — equivale a 'ao final de', 'depois de', 'após'. 'Ao cabo de anos de prática' = após/depois de anos de experiência acumulada."},
        {n:29,q:"'O orientador interpelou o aluno, o qual negou qualquer envolvimento.' O pronome 'o qual' pode ser substituído sem alteração de sentido por:",ops:["que","o que","quem","cujo"],g:0,exp:"'O qual' é pronome relativo que substitui o antecedente 'o aluno' (masculino singular). Pode ser substituído por 'que' em oração adjetiva explicativa: 'o aluno, que negou...'. 'Cujo' indicaria posse; 'quem' exigiria preposição; 'o que' teria valor diferente sem antecedente claro."},
        {n:30,q:"'Malgrado os esforços empreendidos, o projeto não atingiu as metas previstas.' A palavra 'Malgrado' é:",ops:["Advérbio de negação que nega os esforços","Preposição concessiva de registro erudito, equivalente a 'apesar de'","Conjunção adversativa equivalente a 'porém'","Adjetivo que qualifica negativamente os esforços"],g:1,exp:"'Malgrado' é preposição (ou locução prepositiva) de registro erudito/literário com valor concessivo, equivalente a 'apesar de', 'não obstante', 'a despeito de'. FGV frequentemente usa vocabulário de registro elevado para testar o repertório linguístico do candidato."},
      ]},
      {nome:'Texto, Discurso e Estilo (Q31–Q40)',qs:[
        {n:31,q:"Leia: 'A escola que não incomoda não educa.' Esse enunciado utiliza que recurso para construir seu argumento?",ops:["Hipérbole que exagera a função da escola","Paradoxo aparente que associa incômodo a crescimento, subvertendo a expectativa","Eufemismo que suaviza a crítica ao sistema educacional","Gradação que intensifica progressivamente a ideia de educação"],g:1,exp:"O enunciado cria um paradoxo aparente: incomodar (geralmente negativo) é apresentado como condição da educação genuína. Subverte a expectativa ao associar desconforto ao aprendizado transformador — recurso argumentativo típico de textos dissertativos de alto nível."},
        {n:32,q:"'Os dados foram analisados, as conclusões foram redigidas e o relatório foi entregue.' O paralelismo nessa frase:",ops:["É um erro, pois repete desnecessariamente a mesma estrutura","Cria coesão e ritmo ao apresentar três ações em estrutura sintática equivalente (voz passiva)","É uma anáfora porque repete o mesmo pronome","Indica que as três ações ocorreram simultaneamente"],g:1,exp:"O paralelismo sintático — três orações na voz passiva analítica com estrutura idêntica — cria coesão textual e ritmo narrativo. É recurso estilístico intencional que confere organização e fluidez ao texto, não um erro de repetição."},
        {n:33,q:"Em 'Não é de hoje que a educação enfrenta esse dilema', a expressão 'Não é de hoje' indica:",ops:["Negação absoluta — o dilema nunca existiu","Valor temporal que remete ao passado remoto — o problema é antigo","Valor concessivo — apesar de hoje, o dilema existe","Valor hipotético — talvez o dilema exista"],g:1,exp:"'Não é de hoje' é uma construção idiomática que significa 'já existe há muito tempo', 'não é recente'. Remete ao passado como origem do problema, enfatizando sua historicidade e permanência."},
        {n:34,q:"Assinale a alternativa em que a pontuação altera o sentido da frase:",ops:["Os alunos que estudaram foram aprovados. / Os alunos, que estudaram, foram aprovados.","O projeto foi aprovado. / O projeto foi aprovado!","Ela chegou cedo. / Ela chegou cedo?","Estudou muito e passou. / Estudou muito; e passou."],g:0,exp:"Na primeira versão (sem vírgulas), 'que estudaram' é adjetiva RESTRITIVA — apenas os alunos que estudaram foram aprovados (pressupõe que outros não estudaram). Na segunda (com vírgulas), é EXPLICATIVA — todos os alunos estudaram e todos foram aprovados. A pontuação altera fundamentalmente o sentido."},
        {n:35,q:"'Manda quem pode, obedece quem tem juízo.' Esse provérbio, do ponto de vista da análise do discurso, pode ser interpretado como:",ops:["Enunciado neutro que descreve objetivamente relações de poder","Enunciado ideológico que naturaliza e legitima relações assimétricas de poder como inevitáveis","Ironia que critica quem obedece sem questionar","Metáfora que compara poder e sabedoria"],g:1,exp:"O provérbio apresenta a obediência ao poder como 'juízo' (sabedoria/sensatez), naturalizando a hierarquia como algo óbvio e correto. Do ponto de vista da análise do discurso crítica, é um enunciado ideológico que legitima relações de dominação ao apresentá-las como naturais e racionais."},
        {n:36,q:"'O orientador precisa saber o que dizer, quando dizer e, sobretudo, o que não dizer.' O termo 'sobretudo' nessa frase:",ops:["Equivale a 'principalmente', intensificando o último elemento da enumeração","É advérbio de tempo que indica o momento da fala","Equivale a 'portanto', concluindo a enumeração","É preposição que introduz complemento do verbo 'saber'"],g:0,exp:"'Sobretudo' é advérbio de intensidade que destaca o elemento que introduz como o mais importante da série. Aqui enfatiza que, dos três saberes enumerados, o mais crucial é saber o que NÃO dizer — o silêncio estratégico."},
        {n:37,q:"Leia: 'Dizem que a escola forma cidadãos. Pergunto: de que escola estão falando?' O recurso retórico da segunda frase é:",ops:["Ironia socrática — questiona para desconstruir a afirmação anterior","Função fática — verifica se o interlocutor está atento","Metalinguagem — fala sobre a própria língua","Hipérbole — exagera a diversidade de escolas existentes"],g:0,exp:"A pergunta retórica com valor de ironia socrática (questionar para revelar contradições) desconstruiu a afirmação genérica anterior. Implica que a escola real não corresponde ao ideal evocado por 'dizem'. É uma estratégia argumentativa de questionamento crítico."},
        {n:38,q:"Em 'Quem muito fala pouco diz', a oração 'Quem muito fala' é:",ops:["Sujeito simples da oração principal","Oração subordinada substantiva subjetiva funcionando como sujeito","Oração subordinada adjetiva que modifica 'pouco'","Oração coordenada assindética"],g:1,exp:"'Quem muito fala' é oração subordinada substantiva com função de sujeito da oração principal 'pouco diz'. O pronome relativo indefinido 'quem' (= aquele que) encabeça a oração substantiva subjetiva."},
        {n:39,q:"'O orientador deve agir com prudência, sem precipitar julgamentos nem fechar diagnósticos prematuros.' O termo 'sem' nessa frase introduz:",ops:["Oração subordinada adverbial condicional negativa","Adjunto adverbial de modo com valor negativo — indica como não agir","Oração coordenada sindética adversativa","Oração subordinada substantiva objetiva indireta"],g:1,exp:"'Sem + infinitivo' forma um adjunto adverbial de modo com valor negativo: especifica como a ação deve ser realizada (com prudência) e o que deve ser evitado (precipitar julgamentos, fechar diagnósticos). É um adjunto modal negativo."},
        {n:40,q:"Assinale a alternativa em que há ZEUGMA (omissão de termo já expresso):",ops:["Ele estudou muito; ela, pouco.","Os alunos chegaram cedo e os professores, também.","A diretora aprovou o projeto e a vice-diretora o rejeitou.","Uns querem mudança; outros, estabilidade."],g:0,exp:"Zeugma: supressão de um termo já mencionado, que fica subentendido. Em A, 'estudou' é omitido na segunda oração: 'ele estudou muito; ela [estudou] pouco'. O zeugma cria concisão e elegância estilística. Em D ocorre o mesmo: 'querem' é omitido — também seria zeugma. A é a alternativa mais clássica e clara do recurso."},
      ]},
      {nome:'Morfossintaxe e Lexicologia Avançadas (Q41–Q50)',qs:[
        {n:41,q:"'O problema não reside na falta de leis, senão na falta de vontade de aplicá-las.' A conjunção 'senão' nessa frase tem valor:",ops:["Condicional negativo — equivale a 'se não'","Adversativo-corretivo — equivale a 'mas sim', retificando a ideia anterior","Consecutivo — indica consequência da falta de leis","Explicativo — justifica por que as leis não funcionam"],g:1,exp:"'Senão' (junto) com valor adversativo-corretivo equivale a 'mas sim', 'mas antes', 'mas somente': corrige ou substitui o termo negado. 'Não reside na falta de leis, senão [mas sim] na falta de vontade'. Diferente de 'se não' (separado), que é condicional."},
        {n:42,q:"Assinale a alternativa em que a palavra sublinhada é HETEROSSÊMICA (mesma grafia, sentidos distintos conforme o contexto):",ops:["'banco' (instituição financeira) e 'banco' (assento)","'canto' (melodia) e 'canto' (ângulo/quina)","'são' (saudável) e 'são' (forma do verbo ser)","Todas as alternativas apresentam casos de polissemia ou homonímia"],g:3,exp:"Todas as alternativas apresentam fenômenos de heterossemia: A e B são homônimos perfeitos (mesma grafia e pronúncia, origens distintas); C apresenta homografia (mesma grafia, pronúncia diferente: 'são' adj. vs 'são' vb.). FGV testa a distinção entre polissemia (um vocábulo, vários sentidos relacionados) e homonímia (vocábulos distintos com mesma forma)."},
        {n:43,q:"'Por mais que se esforce, não conseguirá mudar sozinho a cultura escolar.' A oração 'Por mais que se esforce' é:",ops:["Subordinada adverbial condicional","Subordinada adverbial concessiva com correlação intensiva","Subordinada adverbial causal","Coordenada sindética adversativa"],g:1,exp:"'Por mais que' + subjuntivo é locução conjuntiva concessiva com valor de intensidade máxima: mesmo que o esforço seja máximo, o resultado não se altera. É uma concessiva correlativa — FGV cobra esse padrão como variante de 'embora/ainda que'."},
        {n:44,q:"Em 'Trata-se de profissional de rara sensibilidade', o artigo indefinido foi omitido antes de 'profissional'. Essa omissão:",ops:["É erro gramatical — o artigo é obrigatório após 'de'","É intencional e confere valor generalizante e estilístico à frase","Indica que 'profissional' é nome próprio","Altera o sentido para indicar profissional específico e conhecido"],g:1,exp:"A omissão do artigo indefinido ('de um profissional') é recurso estilístico intencional que confere à frase um tom mais elevado e generalizante. É comum em registros literários e formais. FGV testa o reconhecimento de escolhas estilísticas deliberadas."},
        {n:45,q:"'Ele age como se soubesse tudo.' O modo verbal de 'soubesse' e sua justificativa são:",ops:["Indicativo imperfeito — indica ação habitual no passado","Subjuntivo imperfeito — a comparação hipotética com 'como se' exige subjuntivo","Futuro do subjuntivo — indica ação futura incerta","Imperativo — indica ordem implícita na comparação"],g:1,exp:"A locução conjuntiva comparativa 'como se' exige obrigatoriamente o subjuntivo (imperfeito para referência presente/passada; mais-que-perfeito para passado): 'age como se soubesse' (presente) — subjuntivo imperfeito. FGV cobra esse padrão de regência modal."},
        {n:46,q:"'Ao se deparar com o conflito, o orientador não deve se omitir.' O sujeito do infinitivo 'se deparar' é:",ops:["O orientador — sujeito correferencial com o da oração principal","O conflito — objeto da preposição 'com'","Sujeito indeterminado — o 'se' indetermina o sujeito","Não há sujeito — construção absolutamente impessoal"],g:0,exp:"Na construção 'ao + infinitivo', o sujeito do infinitivo é correferencial com o sujeito da oração principal quando não há sujeito explícito diferente. 'O orientador' é o sujeito implícito de 'se deparar' — é ele quem se depara com o conflito."},
        {n:47,q:"Leia: 'O texto, destituído de argumentos sólidos, não convenceu o júri.' A palavra 'destituído' estabelece com 'O texto' relação de:",ops:["Predicativo do objeto — atribui qualidade ao objeto 'o júri'","Adjunto adnominal pós-nominal — integra o sintagma nominal do sujeito","Predicativo do sujeito — atribuído ao sujeito em posição apositiva","Aposto especificativo de 'argumentos sólidos'"],g:2,exp:"'Destituído de argumentos sólidos', isolado por vírgulas e referindo-se ao sujeito 'O texto', é predicativo do sujeito em posição intercalada (apositiva). Indica o estado/qualidade do sujeito no momento da ação, não um adjunto adnominal fixo dentro do sintagma."},
        {n:48,q:"'Quer chova, quer faça sol, a reunião acontecerá.' A estrutura 'quer... quer' expressa:",ops:["Alternância entre duas condições, com valor concessivo totalizante","Adversidade entre as duas situações climáticas","Consequência inevitável de qualquer condição climática","Coordenação aditiva entre duas orações independentes"],g:0,exp:"'Quer... quer' é locução conjuntiva que indica alternância com valor concessivo: qualquer que seja a condição (chuva ou sol), a reunião ocorrerá. Equivale a 'seja... seja', 'ora... ora' em contexto de indiferença à condição. FGV cobra essas locuções correlativas de registro formal."},
        {n:49,q:"'Nada do que foi dito justifica a omissão.' O pronome relativo 'que' em 'do que foi dito' retoma:",ops:["'Nada' — pronome indefinido que funciona como antecedente","'omissão' — objeto da justificativa","'foi' — verbo auxiliar da oração","Não há antecedente — 'o que' é pronome relativo indefinido"],g:0,exp:"'Nada do que foi dito' = nada daquilo que foi dito. O antecedente de 'que' é 'nada' (pronome indefinido). A preposição 'de' + artigo 'o' + pronome relativo 'que' formam a estrutura 'do que', retomando o antecedente 'nada'."},
        {n:50,q:"Assinale a alternativa que apresenta CATÁFORA (referência a elemento que ainda será mencionado):",ops:["Ela chegou cansada. A orientadora mal conseguia falar.","Encontrei-os na escola: Pedro, Paulo e Mariana.","Os alunos foram aprovados. Eles comemoraram muito.","O resultado foi este: todos passaram na prova."],g:1,exp:"Catáfora: o elemento coesivo aponta para frente no texto, antecipando termo que ainda será mencionado. Em B, 'os' em 'Encontrei-os' antecipa 'Pedro, Paulo e Mariana' — referência catafórica. Em D, 'este' também aponta para frente ('todos passaram') — também é catáfora. B é o exemplo mais clássico e direto."},
      ]}
    ]
  },
  {
    id:'sim2',titulo:'Simulado 2 – Conhecimentos em Informática',banca:'FCC',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Informática (Q1–Q5)',qs:[
        {n:1,q:"No MS-Word, qual recurso insere números de página automaticamente?",ops:["Inserir > Cabeçalho","Inserir > Número de Página","Layout > Margens","Referências > Notas de Rodapé"],g:1,exp:"Em Inserir > Número de Página, o Word insere automaticamente a numeração nas posições escolhidas (topo, rodapé, margens)."},
        {n:2,q:"No MS-Excel, a fórmula =SOMA(A1:A5) soma:",ops:["Apenas A1 e A5","Células de A1 até A5","Apenas 5 células aleatórias","Células de A até E na linha 1"],g:1,exp:"O intervalo A1:A5 inclui todas as células de A1 até A5 — ou seja, A1, A2, A3, A4 e A5."},
        {n:3,q:"No MS-Windows, o atalho de teclado para 'desfazer' a última ação é:",ops:["Ctrl+C","Ctrl+Z","Ctrl+V","Ctrl+X"],g:1,exp:"Ctrl+Z desfaz a última ação realizada na maioria dos programas Windows. Ctrl+Y refaz o que foi desfeito."},
        {n:4,q:"O formato de arquivo nativo do MS-Word (versão atual) é:",ops:[".doc",".txt",".docx",".pdf"],g:2,exp:"O formato .docx é o padrão do Microsoft Word a partir da versão 2007 (formato XML aberto). O .doc é o formato legado."},
        {n:5,q:"No MS-PowerPoint, o 'Painel de Anotações' serve para:",ops:["Exibir o slide em tela cheia","Adicionar lembretes visíveis ao apresentador","Inserir imagens no slide","Configurar a transição"],g:1,exp:"O Painel de Anotações (abaixo do slide) permite ao apresentador adicionar notas de apoio, visíveis apenas para ele durante a apresentação."},
      ]},
      {nome:'Informática – Avançado (Q6–Q10)',qs:[
        {n:6,q:"Na internet, o protocolo HTTPS difere do HTTP por:",ops:["Ser mais lento","Adicionar uma camada de segurança/criptografia (SSL/TLS)","Funcionar apenas em redes privadas","Permitir apenas e-mails"],g:1,exp:"HTTPS usa criptografia SSL/TLS para proteger os dados transmitidos entre o navegador e o servidor, essencial em transações e dados pessoais."},
        {n:7,q:"No MS-Excel, qual função conta o número de células que atendem a uma condição?",ops:["=SOMA()","=MÉDIA()","=CONT.SE()","=MÁXIMO()"],g:2,exp:"=CONT.SE(intervalo; critério) conta quantas células de um intervalo atendem ao critério especificado."},
        {n:8,q:"O que é um 'hiperlink' na internet?",ops:["Um arquivo de imagem","Um tipo de vírus","Um elemento clicável que redireciona para outra página ou recurso","Uma senha de acesso"],g:2,exp:"Hiperlink (ou link) é um elemento interativo que ao ser clicado redireciona o usuário para outro endereço/recurso na web."},
        {n:9,q:"No MS-Word, 'mala direta' é usada para:",ops:["Enviar e-mails em massa pelo Word","Criar documentos personalizados com dados variáveis (nome, endereço etc.)","Formatar automaticamente parágrafos","Inserir tabelas dinamicamente"],g:1,exp:"Mala direta combina um documento-modelo com uma fonte de dados (planilha, banco) para gerar cópias personalizadas em série."},
        {n:10,q:"No MS-Windows, 'atalho' (shortcut) em uma pasta é:",ops:["Uma cópia completa do arquivo","Um arquivo compactado","Um ponteiro/link para o arquivo ou pasta original","Uma pasta protegida por senha"],g:2,exp:"Um atalho é um arquivo .lnk que aponta para o objeto original. Ao deletar um atalho, o arquivo original permanece intacto."},
      ]},
    ]
  },
  {
    id:'sim3',titulo:'Simulado 3 – Conhecimentos Específicos',banca:'IBFC',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Orientação Educacional (Q1–Q5)',qs:[
        {n:1,q:"De acordo com a legislação brasileira, o Orientador Educacional pode ter formação em:",ops:["Pedagogia ou Psicologia","Apenas Psicologia","Apenas Pedagogia","Administração Escolar"],g:0,exp:"A Orientação Educacional pode ser exercida por pedagogos (com habilitação) ou psicólogos escolares, conforme a legislação e os editais municipais/estaduais."},
        {n:2,q:"O que são 'habilidades socioemocionais' no contexto escolar?",ops:["Apenas disciplinas do currículo","Competências como empatia, resiliência e autoconhecimento que influenciam o aprendizado e as relações","Notas de comportamento no boletim","Regras do regimento escolar"],g:1,exp:"Habilidades socioemocionais (BNCC) incluem autoconhecimento, autogestão, empatia, habilidades de relacionamento e responsabilidade — essenciais ao desenvolvimento pleno."},
        {n:3,q:"O cyberbullying se distingue do bullying presencial principalmente por:",ops:["Ser menos grave","Ocorrer em ambiente virtual com potencial de maior alcance e anonimato","Envolver apenas adultos","Não ter consequências psicológicas"],g:1,exp:"O cyberbullying ocorre em ambientes digitais, podendo ser anônimo e ter alcance ilimitado, tornando mais difícil o enfrentamento e aumentando o impacto nas vítimas."},
        {n:4,q:"A 'escuta ativa' como técnica de mediação consiste em:",ops:["Apenas ouvir sem responder","Atenção plena ao que o outro diz, com postura empática e sem julgamentos","Registrar tudo em ata","Dar soluções imediatas ao conflito"],g:1,exp:"A escuta ativa é uma técnica de comunicação que envolve atenção total, compreensão empática e feedback, criando um espaço seguro para o diálogo."},
        {n:5,q:"O PPP escolar deve ser construído:",ops:["Somente pela direção e coordenação","Coletivamente, com participação de professores, alunos, pais e comunidade","Apenas pelos professores","Pelo orientador educacional de forma autônoma"],g:1,exp:"O PPP é um documento coletivo que expressa a identidade escolar. Sua construção participativa é exigida pela LDB (Lei 9.394/96) e garante legitimidade às decisões pedagógicas."},
      ]},
      {nome:'Desenvolvimento e Inclusão (Q6–Q10)',qs:[
        {n:6,q:"O TDAH é classificado atualmente pelo DSM-5 como:",ops:["Distúrbio emocional","Transtorno do Neurodesenvolvimento","Psicose infantil","Deficiência intelectual"],g:1,exp:"O DSM-5 classifica o TDAH como Transtorno do Neurodesenvolvimento, caracterizado por desatenção e/ou hiperatividade-impulsividade."},
        {n:7,q:"Qual a principal diferença entre dislexia e dificuldade de aprendizagem por falta de estímulo?",ops:["Não há diferença","A dislexia tem base neurológica; a outra decorre de fatores ambientais/pedagógicos","A dislexia afeta apenas o cálculo","Dificuldade de aprendizagem é mais grave"],g:1,exp:"A dislexia tem origem neurobiológica (genética, estrutura cerebral), diferindo das dificuldades de aprendizagem causadas por falta de estímulo, método inadequado ou fatores emocionais."},
        {n:8,q:"A prevenção ao uso de drogas nas escolas deve ser abordada prioritariamente como:",ops:["Tema proibido","Educação para a saúde, com foco em informação, autoestima e habilidades de resistência","Ação exclusiva da polícia","Responsabilidade apenas da família"],g:1,exp:"A prevenção escolar deve ser educativa e integral: informação qualificada, fortalecimento de vínculos, autoestima e habilidades para lidar com pressão — não punitiva."},
        {n:9,q:"O grêmio estudantil tem como função principal:",ops:["Organizar festas escolares","Representar os estudantes e promover sua participação democrática na escola","Substituir o conselho de classe","Fiscalizar professores"],g:1,exp:"O grêmio estudantil é a entidade representativa dos alunos, garantida pela Lei 7.398/85, que promove cidadania, participação democrática e defesa dos interesses estudantis."},
        {n:10,q:"Na mediação de conflitos escolares, o orientador deve:",ops:["Sempre punir o agressor","Ouvir todas as partes, buscar compreensão mútua e construir soluções coletivas","Ignorar os conflitos menores","Encaminhar todos os casos à direção"],g:1,exp:"A mediação de conflitos pressupõe imparcialidade, escuta de todas as partes e construção colaborativa de soluções, promovendo convivência ética e pacífica."},
      ]},
    ]
  },
  {
    id:'sim4',titulo:'Simulado 4 – Completo (LP + Informática + Específicos)',banca:'Ação Bahia',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q4)',qs:[
        {n:1,q:"'Conforme o planejado, o orientador realizou as visitas às turmas.' A palavra 'conforme' exerce a função de:",ops:["Preposição","Conjunção conformativa","Advérbio de modo","Pronome relativo"],g:1,exp:"'Conforme' introduz oração subordinada adverbial conformativa, indicando que a ação foi realizada de acordo com algo previsto."},
        {n:2,q:"Qual alternativa apresenta uso CORRETO do hífen?",ops:["Anti-inflamatório","Antiinflamatório","Anti inflamatório","Antiinflamatorio"],g:0,exp:"Usa-se hífen quando o segundo elemento começa com vogal idêntica à última letra do prefixo: anti + inflamatório = anti-inflamatório."},
        {n:3,q:"O sujeito da oração 'É preciso dialogar com os alunos' é:",ops:["os alunos","dialogar","É preciso","Sujeito inexistente (oração impessoal)"],g:3,exp:"A construção 'É preciso + infinitivo' forma uma oração impessoal — não há um ser que pratique a ação de 'ser preciso'."},
        {n:4,q:"Em 'Aspirei ao cargo de orientador', o verbo 'aspirar' está empregado no sentido de:",ops:["Inalar","Almejar/desejar","Limpar com aspirador","Respirar"],g:1,exp:"'Aspirar a' (com preposição) = almejar, desejar. 'Aspirar' (sem preposição) = inalar. A regência com 'a' distingue os dois sentidos."},
      ]},
      {nome:'Informática (Q5–Q7)',qs:[
        {n:5,q:"No MS-Excel, qual é o operador utilizado para concatenar (unir) textos em fórmulas?",ops:["+ (mais)","& (e comercial)","* (asterisco)","/ (barra)"],g:1,exp:"O operador & concatena textos no Excel. Exemplo: =A1&\" \"&B1 une o conteúdo de A1, um espaço e B1 em uma única célula."},
        {n:6,q:"Uma URL (Uniform Resource Locator) é:",ops:["Um tipo de vírus","O endereço de um recurso na internet","Um protocolo de e-mail","Um formato de arquivo de imagem"],g:1,exp:"A URL identifica e localiza um recurso na internet (página, arquivo, imagem), especificando o protocolo, domínio e caminho do recurso."},
        {n:7,q:"No MS-Word, 'controle de alterações' serve para:",ops:["Desfazer todas as alterações","Rastrear e revisar modificações feitas no documento por diferentes autores","Bloquear a edição do arquivo","Salvar automaticamente"],g:1,exp:"Controle de Alterações (Revisão > Controlar Alterações) registra cada modificação com autor, data e tipo de mudança, essencial para revisão colaborativa."},
      ]},
      {nome:'Conhecimentos Específicos (Q8–Q10)',qs:[
        {n:8,q:"O Conselho de Classe tem como finalidade:",ops:["Apenas avaliar notas dos alunos","Analisar coletivamente o processo de ensino-aprendizagem e propor intervenções pedagógicas","Punir alunos com baixo rendimento","Substituir o PPP escolar"],g:1,exp:"O Conselho de Classe é um espaço coletivo de reflexão pedagógica que reúne professores, coordenação e orientação para analisar o processo educativo e propor ações de melhoria."},
        {n:9,q:"A articulação entre escola e família, no contexto da orientação educacional, visa principalmente:",ops:["Transferir a responsabilidade educativa para os pais","Construir parceria para apoio integral ao desenvolvimento do estudante","Fiscalizar a vida privada das famílias","Reduzir a autonomia dos alunos"],g:1,exp:"A parceria escola-família fortalece o processo educativo, pois cria uma rede de apoio consistente ao desenvolvimento acadêmico, emocional e social do estudante."},
        {n:10,q:"Segundo a BNCC, as competências socioemocionais devem ser desenvolvidas:",ops:["Apenas nas aulas de Educação Física","De forma transversal em todas as disciplinas e espaços educativos","Somente pelo orientador educacional","Exclusivamente no Ensino Médio"],g:1,exp:"A BNCC prevê o desenvolvimento de competências socioemocionais de forma transversal em toda a Educação Básica, integrando-se ao projeto pedagógico escolar."},
      ]},
    ]
  },
  {
    id:'sim5',titulo:'Simulado 5 – Completo (LP + Informática + Específicos)',banca:'Ação Bahia',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q4)',qs:[
        {n:1,q:"Assinale a alternativa em que a vírgula está empregada CORRETAMENTE:",ops:["Comprei cadernos, canetas e, borracha.","Os alunos, que estudaram, foram aprovados.","João, meu melhor aluno, passou no concurso.","Ela chegou, e saiu rapidamente."],g:2,exp:"Vírgula de aposto: 'meu melhor aluno' é um aposto explicativo de 'João' e deve ser isolado por vírgulas. Nas outras alternativas o uso da vírgula é incorreto."},
        {n:2,q:"Identifique a alternativa com par de PARÔNIMOS:",ops:["Escola / escolar","Descrição / discrição","Amor / desamor","Casa / casinha"],g:1,exp:"Parônimos são palavras de grafia e pronúncia semelhantes mas significados diferentes: 'descrição' (ato de descrever) e 'discrição' (qualidade de discreto)."},
        {n:3,q:"Na frase 'Vende-se imóvel', a voz verbal é:",ops:["Ativa","Passiva analítica","Passiva sintética","Reflexiva"],g:2,exp:"Passiva sintética (ou pronominal): formada com verbo na 3ª pessoa + pronome apassivador 'se'. Equivale a 'Um imóvel é vendido'."},
        {n:4,q:"'Embora estivesse cansado, o orientador atendeu todos os alunos.' A oração sublinhada é:",ops:["Coordenada sindética adversativa","Subordinada adverbial concessiva","Subordinada adverbial causal","Coordenada assindética"],g:1,exp:"A conjunção 'embora' + subjuntivo introduz oração subordinada adverbial concessiva: indica concessão, contraste com a ideia principal."},
      ]},
      {nome:'Informática (Q5–Q7)',qs:[
        {n:5,q:"No MS-Excel, qual função calcula a média aritmética de um intervalo?",ops:["=SOMA()","=MÉDIA()","=MED()","=MODO()"],g:1,exp:"=MÉDIA(intervalo) calcula a média aritmética. =MED() retorna a mediana (valor central) e =MODO() retorna o valor mais frequente."},
        {n:6,q:"No MS-Word, o recurso 'Localizar e Substituir' (Ctrl+H) serve para:",ops:["Salvar o documento em outro formato","Encontrar e trocar palavras ou trechos no documento","Verificar a ortografia","Inserir comentários"],g:1,exp:"Ctrl+H abre 'Localizar e Substituir', permitindo encontrar uma palavra/frase e substituí-la por outra em todo o documento de forma automática."},
        {n:7,q:"No MS-PowerPoint, 'animação' difere de 'transição' porque:",ops:["Animação muda o design do slide","Animação aplica efeitos a objetos dentro do slide; transição aplica efeito entre slides","Transição é mais rápida","São a mesma coisa"],g:1,exp:"Animação: efeitos aplicados a elementos (texto, imagem) dentro de um slide. Transição: efeito visual ao passar de um slide para o próximo."},
      ]},
      {nome:'Conhecimentos Específicos (Q8–Q10)',qs:[
        {n:8,q:"O orientador educacional deve participar do PPP escolar principalmente:",ops:["Apenas assinando o documento final","Na construção, implementação, acompanhamento e avaliação contínua","Somente na fase de avaliação","Apenas quando solicitado pela direção"],g:1,exp:"A participação do orientador no PPP é ativa e contínua nas quatro etapas: construção coletiva, implementação prática, acompanhamento dos resultados e avaliação periódica."},
        {n:9,q:"Qual das alternativas descreve corretamente a 'empatia' como habilidade socioemocional?",ops:["Capacidade de impor os próprios pontos de vista","Habilidade de compreender e compartilhar os sentimentos do outro","Ausência de emoções em situações de conflito","Obediência às regras sem questionamento"],g:1,exp:"Empatia é a capacidade de se colocar no lugar do outro, compreendendo suas emoções e perspectivas — fundamental para o trabalho do orientador educacional."},
        {n:10,q:"A indisciplina escolar deve ser compreendida pelo orientador como:",ops:["Apenas um problema de caráter do aluno","Um comportamento a punir sem investigação","Um sinal que pode indicar dificuldades emocionais, familiares ou pedagógicas","Uma questão exclusivamente da família"],g:2,exp:"A indisciplina pode ser um sinal de alerta para questões subjacentes: dificuldades de aprendizagem, problemas familiares, socioemocionais ou inadequação das práticas pedagógicas."},
      ]},
    ]
  },
  {
    id:'sim6',titulo:'Simulado 6 – Completo (LP + Informática + Específicos)',banca:'Ação Bahia',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Língua Portuguesa (Q1–Q4)',qs:[
        {n:1,q:"Assinale a alternativa em que a concordância nominal está CORRETA:",ops:["As alunas ficaram satisfeito com o resultado.","Os professores estavam cansadas após a reunião.","As orientadoras ficaram satisfeitas com o PPP.","O grupo de alunos saíram cedo."],g:2,exp:"O adjetivo 'satisfeitas' concorda em gênero (feminino) e número (plural) com 'orientadoras'. Nas demais, há discordância entre substantivo e adjetivo."},
        {n:2,q:"'Ele assistiu o filme ontem.' Esta frase apresenta erro de:",ops:["Concordância verbal","Regência verbal","Ortografia","Colocação pronominal"],g:1,exp:"'Assistir' no sentido de ver/presenciar é verbo transitivo indireto: exige preposição 'a'. O correto é 'assistiu ao filme'."},
        {n:3,q:"Assinale a alternativa em que há METÁFORA:",ops:["Ela corre como o vento.","Seus olhos são estrelas no céu.","Mil pessoas compareceram ao evento.","O estudante leu o texto rapidamente."],g:1,exp:"'Seus olhos são estrelas' é metáfora: identifica implicitamente dois elementos diferentes sem usar 'como'. 'Corre como o vento' é comparação (uso de 'como')."},
        {n:4,q:"Na oração 'Os orientadores que se dedicam obtêm bons resultados', a oração 'que se dedicam' é:",ops:["Subordinada substantiva subjetiva","Subordinada adjetiva restritiva","Subordinada adverbial causal","Coordenada sindética aditiva"],g:1,exp:"'Que se dedicam' é oração subordinada adjetiva restritiva: introduzida pelo pronome relativo 'que', restringe o sentido do antecedente 'orientadores' (sem vírgula)."},
      ]},
      {nome:'Informática (Q5–Q7)',qs:[
        {n:5,q:"No MS-Word, 'recuo de parágrafo' serve para:",ops:["Alterar a fonte do texto","Definir o afastamento do texto em relação às margens da página","Inserir uma tabela","Numerar as páginas"],g:1,exp:"O recuo controla o afastamento horizontal do parágrafo em relação às margens. Pode ser recuo à esquerda, à direita, de primeira linha ou deslocado."},
        {n:6,q:"No MS-Windows, o gerenciador de tarefas (Ctrl+Alt+Del > Gerenciador de Tarefas) permite:",ops:["Instalar novos programas","Monitorar e encerrar processos e programas em execução","Formatar o disco rígido","Configurar a impressora"],g:1,exp:"O Gerenciador de Tarefas monitora o uso de CPU, memória e rede, além de permitir encerrar processos travados ou que consomem muitos recursos."},
        {n:7,q:"Ao anexar um arquivo em um e-mail, o usuário está:",ops:["Copiando o e-mail para outra pasta","Incluindo um arquivo para ser enviado junto com a mensagem","Encaminhando o e-mail para outro destinatário","Salvando o e-mail como rascunho"],g:1,exp:"Anexar (attach) significa incluir um arquivo (documento, imagem, planilha) junto à mensagem de e-mail para que o destinatário possa baixá-lo."},
      ]},
      {nome:'Conhecimentos Específicos (Q8–Q10)',qs:[
        {n:8,q:"O histórico da orientação educacional no Brasil tem origem associada a qual movimento?",ops:["Movimento escolanovista e à industrialização do país nas décadas de 1920-1930","Reforma universitária de 1968","Lei de Cotas de 2012","Criação do ENEM em 1998"],g:0,exp:"A orientação educacional surgiu no Brasil ligada ao movimento escolanovista e à necessidade de adaptar a educação às demandas da industrialização, nas décadas de 1920 e 1930."},
        {n:9,q:"Redes de apoio social e de saúde são acionadas pelo orientador quando:",ops:["O aluno apresenta dificuldades que ultrapassam a competência da escola","O aluno tira notas baixas em provas","A escola precisa de mais verbas","Os pais não comparecem às reuniões"],g:0,exp:"O orientador deve articular a escola com redes externas (CRAS, CAPS, UBS, Conselho Tutelar) quando as necessidades do aluno extrapolam as possibilidades de intervenção escolar."},
        {n:10,q:"Projetos de educação sexual na escola devem ser desenvolvidos com base em:",ops:["Apenas orientação religiosa","Informação científica, respeito à diversidade e promoção da saúde integral","Proibição de discussões sobre o tema","Responsabilidade exclusiva dos pais"],g:1,exp:"A educação sexual escolar deve ser laica, baseada em evidências científicas, respeitar a diversidade e promover a saúde integral dos estudantes, conforme orientações do MEC e da OMS."},
      ]},
    ]
  },
  {
    id:'sim7',titulo:'Simulado 7 – Conhecimentos Específicos (Nível Difícil)',banca:'Ação Bahia',ano:2025,
    edital:'Orientador Educacional',cargo:'Nível Superior',
    secoes:[
      {nome:'Fundamentos Históricos e Teóricos (Q1–Q10)',qs:[
        {n:1,q:"O Decreto-Lei nº 4.244/1942 (Lei Orgânica do Ensino Secundário) foi o primeiro instrumento legal a mencionar a orientação educacional no Brasil. Qual a denominação utilizada nesse decreto?",ops:["Orientação Pedagógica","Orientação Educativa","Orientação de Ensino","Conselho de Orientação Profissional"],g:1,exp:"O Decreto-Lei nº 4.244/1942 utilizou o termo 'Orientação Educativa', denominação original da área no Brasil, antes da consolidação do termo 'Orientação Educacional' nas décadas seguintes."},
        {n:2,q:"Na teoria do desenvolvimento ecológico de Urie Bronfenbrenner, o 'mesossistema' é definido como:",ops:["O ambiente imediato onde o indivíduo vive (família, escola)","As inter-relações ENTRE os microssistemas (ex.: relação família-escola)","As estruturas sociais amplas que influenciam indiretamente o desenvolvimento","As mudanças ao longo do tempo na vida do indivíduo"],g:1,exp:"O mesossistema representa as conexões e processos entre dois ou mais ambientes (microssistemas) nos quais a pessoa em desenvolvimento participa ativamente, como a articulação família-escola fundamental na orientação educacional."},
        {n:3,q:"O conceito de 'habitus' de Pierre Bourdieu aplicado à orientação educacional revela que:",ops:["A motivação intrínseca é o único fator determinante das trajetórias escolares","Disposições sociais incorporadas influenciam inconscientemente as escolhas e trajetórias educacionais dos estudantes","O currículo escolar determina completamente o sucesso dos alunos","A psicometria é o instrumento mais adequado para avaliar o potencial dos estudantes"],g:1,exp:"O 'habitus' bourdieusiano são disposições duráveis incorporadas pela experiência social que orientam percepções e práticas. No contexto escolar, explica como origem social e capital cultural influenciam trajetórias, essencial para o orientador compreender desigualdades educacionais."},
        {n:4,q:"Segundo Dan Olweus, pesquisador norueguês precursor nos estudos sobre bullying, para uma situação ser classificada como tal, são necessários TRÊS critérios. Assinale a alternativa que os lista corretamente:",ops:["Presença de adulto, registro em ata e punição disciplinar","Intencionalidade, repetição e desequilíbrio de poder entre agressor e vítima","Violência física, testemunhas e comunicação à direção","Conflito verbal, isolamento e diferença de idade"],g:1,exp:"Olweus (1993) definiu bullying por três critérios simultâneos: (1) comportamento INTENCIONAL de causar dano; (2) REPETIÇÃO ao longo do tempo; (3) DESEQUILÍBRIO DE PODER entre as partes. A ausência de qualquer um desses elementos descaracteriza o bullying."},
        {n:5,q:"A abordagem centrada na pessoa (ACP) de Carl Rogers, aplicada à orientação educacional, fundamenta-se no tripé:",ops:["Autoridade, disciplina e avaliação contínua","Empatia, congruência (autenticidade) e aceitação incondicional positiva","Diagnóstico, intervenção e encaminhamento","Triagem, acompanhamento e relatório"],g:1,exp:"Rogers definiu três condições necessárias e suficientes para o crescimento: empatia (compreender o mundo interno do outro), congruência (autenticidade do orientador) e aceitação incondicional positiva (respeito sem julgamento). Essas condições criam o clima facilitador do desenvolvimento."},
        {n:6,q:"Donald Winnicott propôs o conceito de 'objeto transicional' e 'espaço potencial'. No contexto da orientação escolar, o 'espaço potencial' pode ser compreendido como:",ops:["A sala física destinada ao atendimento do orientador","O espaço simbólico de confiança e criatividade onde o aluno pode se expressar autenticamente sem ameaça ao self","O intervalo entre as aulas dedicado ao lazer","O período de transição entre o fundamental e o médio"],g:1,exp:"O 'espaço potencial' winnicottiano é uma área intermediária de experiência, entre a realidade interna e externa, onde a criatividade e o brincar ocorrem. Na orientação, traduz-se como o setting relacional onde o aluno se sente seguro para explorar a própria identidade."},
        {n:7,q:"A 'violência simbólica', conceito de Bourdieu e Passeron em 'A Reprodução' (1970), é relevante para o orientador educacional porque:",ops:["Explica apenas episódios de violência física documentada nas escolas","Revela como a escola reproduz e legitima desigualdades sociais por meio de mecanismos sutis de dominação cultural, naturalizando a exclusão","Define o uso de punições simbólicas no regimento escolar","Refere-se exclusivamente a conflitos entre corpo docente e direção"],g:1,exp:"A violência simbólica opera pela internalização das relações de dominação como naturais e legítimas. A escola, ao impor arbitrários culturais dominantes como universais, contribui para a reprodução das desigualdades — o orientador deve identificar e questionar esses mecanismos."},
