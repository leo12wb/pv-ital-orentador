        {n:8,q:"Na teoria da autodeterminação (Deci e Ryan), os três componentes psicológicos básicos que sustentam a motivação intrínseca são:",ops:["Recompensa, punição e reforço","Autonomia, competência e pertencimento (vínculo)","Obediência, disciplina e rendimento","Cognição, afeto e comportamento"],g:1,exp:"A teoria da autodeterminação (SDT) postula que os seres humanos têm três necessidades psicológicas básicas inatas: autonomia (agir por iniciativa própria), competência (sentir-se eficaz) e pertencimento (vínculos relacionais significativos). O orientador deve criar condições que satisfaçam essas necessidades."},
        {n:9,q:"O modelo ecológico de prevenção ao uso de drogas nas escolas, baseado na perspectiva de saúde pública, distingue-se de modelos tradicionais por:",ops:["Focar exclusivamente na abstinência como meta única","Atuar em múltiplos níveis (indivíduo, família, escola, comunidade e políticas públicas) com estratégias de redução de riscos","Priorizar a punição dos usuários como estratégia preventiva","Encaminhar imediatamente todos os envolvidos para tratamento médico compulsório"],g:1,exp:"O modelo ecológico compreende o uso de drogas como fenômeno multideterminado. A intervenção multinível aborda fatores de risco e proteção em todos os sistemas — do individual ao macrossocial — superando a visão punitiva ou informacional isolada."},
        {n:10,q:"A 'teoria do apego' de John Bowlby tem implicações diretas para a orientação educacional porque:",ops:["Explica apenas o comportamento de bebês nos primeiros meses de vida","Os padrões de apego formados na infância influenciam a qualidade dos vínculos escolares, a regulação emocional e a resposta ao estresse acadêmico","Define como os professores devem disciplinar os alunos","Fundamenta a avaliação psicométrica de inteligência"],g:1,exp:"Bowlby demonstrou que os padrões de apego (seguro, ansioso, evitativo, desorganizado) formados com os cuidadores primários se generalizam para outras relações. Na escola, alunos com apego inseguro tendem a apresentar dificuldades relacionais e maior vulnerabilidade — o orientador pode atuar como 'figura de apego secundária'."},
      ]},
      {nome:'Legislação, PPP e Gestão Educacional (Q11–Q20)',qs:[
        {n:11,q:"O art. 12, inciso VI, da LDB (Lei nº 9.394/96) determina que os estabelecimentos de ensino devem:",ops:["Contratar obrigatoriamente um orientador educacional por turno","Articular-se com as famílias e a comunidade, criando processos de integração da sociedade com a escola","Elaborar o PPP sem participação externa para garantir autonomia","Manter registro psicológico de todos os alunos"],g:1,exp:"A LDB, em seu art. 12, VI, obriga os estabelecimentos de ensino a articular-se com famílias e comunidade, integrando a sociedade à escola — atribuição diretamente relacionada ao trabalho do orientador educacional na construção de redes de apoio."},
        {n:12,q:"Segundo a Resolução CNE/CEB nº 7/2010, que fixa as Diretrizes Curriculares Nacionais para o Ensino Fundamental de 9 anos, o projeto político-pedagógico:",ops:["Deve ser elaborado exclusivamente pela equipe gestora sem participação da comunidade escolar","Constitui instrumento de gestão e orientação do trabalho escolar, expressando a identidade educativa da instituição e devendo ser construído coletivamente","É documento optativo que pode ser substituído pelo regimento interno","Deve seguir modelo único definido pelo MEC para todo o território nacional"],g:1,exp:"A Resolução CNE/CEB nº 7/2010 reforça que o PPP é instrumento identitário e de gestão construído coletivamente, que deve refletir as especificidades da comunidade escolar — sua construção participativa é condição de legitimidade."},
        {n:13,q:"O Conselho de Classe PRELIMINAR (ou Pré-Conselho) distingue-se do Conselho Parcial e do Final porque:",ops:["Ocorre no final do ano letivo com atribuição das menções finais","Acontece antes do início do período letivo, com finalidade diagnóstica e de planejamento coletivo","É convocado apenas para decidir sobre reprovação de alunos","Reúne exclusivamente pais e alunos, sem participação dos professores"],g:1,exp:"O Conselho Preliminar tem caráter diagnóstico e prospectivo: antecede o período letivo para o planejamento coletivo com base em dados anteriores. O Parcial acompanha o processo durante o ano; o Final delibera sobre aprovação/reprovação."},
        {n:14,q:"O art. 56 do ECA (Lei nº 8.069/90) estabelece que os dirigentes de estabelecimentos de ensino fundamental comunicarão ao Conselho Tutelar casos de:",ops:["Apenas evasão escolar comprovada após 30 dias","Maus-tratos envolvendo alunos, reiteração de faltas injustificadas e elevados níveis de repetência e evasão","Somente violência física com lesões documentadas","Problemas de aprendizagem sem diagnóstico médico"],g:1,exp:"O art. 56 do ECA cria obrigação legal dos dirigentes escolares de comunicar ao Conselho Tutelar: I – maus-tratos; II – faltas injustificadas reiteradas; III – elevados níveis de repetência. O não cumprimento constitui omissão passível de responsabilização."},
        {n:15,q:"A Lei nº 13.185/2015, que institui o Programa de Combate à Intimidação Sistemática (Bullying), define como atos de intimidação sistemática:",ops:["Qualquer briga ou conflito esporádico entre estudantes","Todo ato de violência física ou psicológica, intencional e repetitivo, sem motivação evidente, praticado por indivíduo ou grupo, em relação de desequilíbrio de poder","Apenas atos praticados em ambiente físico escolar, excluindo o ambiente virtual","Conflitos que envolvam exclusivamente agressão verbal"],g:1,exp:"A Lei 13.185/2015 define bullying como todo ato de violência (física ou psicológica), intencional, repetitivo, sem motivação evidente e com desequilíbrio de poder. A lei inclui o cyberbullying como modalidade e obriga as escolas a implementar ações de prevenção."},
        {n:16,q:"A Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva (MEC, 2008) estabelece que o Atendimento Educacional Especializado (AEE):",ops:["Substitui o ensino regular para alunos com deficiência severa","É complementar ou suplementar à formação dos estudantes, realizado preferencialmente no contraturno, em salas de recursos multifuncionais","Deve ser realizado exclusivamente em escolas especiais separadas","É obrigatório apenas para estudantes com deficiência visual e auditiva"],g:1,exp:"O AEE, conforme a PNEEPEI (2008), não substitui o ensino regular: é complementar (para deficiência) ou suplementar (para altas habilidades), realizado preferencialmente no contraturno em salas de recursos multifuncionais, garantindo acesso ao currículo comum."},
        {n:17,q:"A diferença funcional ESSENCIAL entre o orientador educacional e o coordenador pedagógico é:",ops:["O coordenador tem formação superior; o orientador pode ter formação técnica","O orientador foca no desenvolvimento integral e socioemocional do estudante e na articulação escola-família-comunidade; o coordenador articula o trabalho pedagógico-curricular dos professores","São funções equivalentes com denominações diferentes segundo o estado","O orientador atende os professores; o coordenador atende diretamente os alunos"],g:1,exp:"Embora complementares, as funções diferem: o orientador educacional centra-se no estudante como sujeito integral (desenvolvimento, socioemocional, articulação com família/rede), enquanto o coordenador pedagógico foca na formação docente e na implementação curricular."},
        {n:18,q:"O sigilo profissional na orientação educacional pode ser EXCEPCIONALMENTE quebrado quando:",ops:["Os pais legalmente responsáveis solicitarem todas as informações sobre o filho maior de 12 anos","Há risco concreto e iminente à integridade física ou psicológica do estudante ou de terceiros, tornando a proteção da vida um valor superior à confidencialidade","A direção da escola solicitar relatório detalhado para fins administrativos","O aluno apresenta desempenho insatisfatório consecutivo em avaliações"],g:1,exp:"O sigilo é princípio ético fundamental da orientação. Sua quebra é justificada eticamente apenas quando o sigilo colocaria em risco a integridade física ou psicológica do próprio sujeito ou de terceiros — situação de risco concreto e iminente sobrepõe-se à confidencialidade."},
        {n:19,q:"O art. 15 da LDB estabelece que as escolas públicas de educação básica terão:",ops:["Dependência total das decisões da Secretaria de Educação para garantir uniformidade","Progressivos graus de autonomia pedagógica e administrativa e de gestão financeira, observadas as normas gerais do direito financeiro","Gestão compartilhada obrigatoriamente com empresas privadas parceiras","Autonomia restrita exclusivamente a decisões sobre calendário escolar"],g:1,exp:"O art. 15 da LDB consagra a autonomia progressiva das escolas públicas nas dimensões pedagógica, administrativa e financeira. Essa autonomia é o fundamento da gestão democrática e da construção do PPP como instrumento identitário da escola."},
        {n:20,q:"A Lei nº 11.340/2006 (Lei Maria da Penha) tem implicações para a atuação do orientador educacional porque:",ops:["Aplica-se apenas ao contexto domiciliar, sem qualquer relação com o ambiente escolar","A escola é espaço privilegiado para identificação de sinais de violência doméstica e o orientador deve estar capacitado para acionar redes de proteção e apoio à estudante em situação de violência","É de competência exclusiva de delegacias especializadas em violência doméstica","A lei proíbe o orientador de intervir em situações de violência familiar por questões de privacidade"],g:1,exp:"A escola frequentemente é o primeiro espaço em que sinais de violência doméstica são identificados (mudanças comportamentais, marcas físicas, relatos). O orientador tem papel crucial na escuta qualificada, encaminhamento à rede de proteção (CREAS, DEAM, Conselho Tutelar) e apoio à estudante."},
      ]},
      {nome:'Práticas Avançadas e Casos Complexos (Q21–Q30)',qs:[
        {n:21,q:"Na teoria do desenvolvimento vocacional de Donald Super, o conceito de 'maturidade vocacional' refere-se a:",ops:["A escolha definitiva de uma profissão na adolescência","O grau em que o comportamento de desenvolvimento de carreira do indivíduo corresponde ao esperado para sua etapa de vida","A capacidade de exercer com êxito uma função profissional específica","A preferência por carreiras com maior remuneração"],g:1,exp:"Super (1957) definiu maturidade vocacional como a congruência entre o comportamento de desenvolvimento de carreira do indivíduo e o comportamento esperado para sua etapa de desenvolvimento. É um conceito processual: a escolha vocacional é contínua e evolutiva ao longo de toda a vida."},
        {n:22,q:"Em casos de suspeita fundada de abuso sexual envolvendo um estudante, o orientador educacional DEVE, como primeira e imediata ação:",ops:["Investigar detalhadamente o caso com entrevistas ao suposto agressor antes de qualquer comunicação","Comunicar imediatamente ao Conselho Tutelar e/ou ao sistema de garantia de direitos, preservando a proteção e a dignidade da criança ou adolescente","Aguardar confirmação médica e policial antes de acionar qualquer instância externa","Comunicar apenas à direção da escola e manter o caso interno para evitar exposição da família"],g:1,exp:"O art. 245 do ECA tipifica como infração o não comunicado por profissionais de educação. Diante de suspeita fundada de abuso, a comunicação imediata ao Conselho Tutelar é obrigação legal — a investigação compete às autoridades competentes, não à escola."},
        {n:23,q:"A mediação de conflitos escolares difere da arbitragem e da negociação direta porque:",ops:["A mediação é mais rápida e eficaz para conflitos físicos graves","Na mediação, um terceiro neutro (mediador) facilita o diálogo e a construção autônoma da solução pelas próprias partes, sem impor decisões","Na mediação, o mediador decide o resultado com base em regras preestabelecidas","A negociação direta requer sempre a presença de um adulto como árbitro"],g:1,exp:"Na mediação, o mediador não decide: facilita o diálogo para que as partes construam a própria solução. Na arbitragem, o árbitro decide. Na negociação direta, as partes dialogam sem intermediário. A mediação é preferida por promover autonomia e habilidades socioemocionais."},
        {n:24,q:"A 'evasão escolar' como fenômeno multideterminado deve ser compreendida pelo orientador a partir de:",ops:["Exclusivamente a decisão individual do aluno e da família","Fatores interativos: econômicos (trabalho infantil, pobreza), pedagógicos (reprovação, violência escolar), familiares (instabilidade) e sociais (território, violência urbana)","Unicamente problemas de aprendizagem não diagnosticados","Como responsabilidade exclusiva do aluno com histórico de indisciplina"],g:1,exp:"A evasão é fenômeno complexo e multicausal. Reduzir a um único fator distorce a análise e ineficácia as intervenções. O orientador deve mapear os múltiplos determinantes para propor intervenções articuladas com família, rede de proteção e políticas públicas."},
        {n:25,q:"A articulação intersetorial (escola + saúde + assistência social + justiça) realizada pelo orientador pressupõe o princípio de:",ops:["Que a escola deve resolver todos os problemas dos alunos de forma autossuficiente","Proteção integral do estudante como sujeito de direitos, reconhecendo que suas necessidades biopsicossociais extrapolam a competência exclusiva da escola","Transferência integral de responsabilidades da escola para outros setores","Que apenas casos com diagnóstico médico confirmado merecem encaminhamento intersetorial"],g:1,exp:"A articulação intersetorial fundamenta-se na proteção integral (ECA, art. 1º): a criança é sujeito de direitos cujo desenvolvimento pleno exige ação integrada de múltiplos setores. O orientador opera como articulador desta rede, sem abdicar da responsabilidade escolar."},
        {n:26,q:"Na abordagem da 'resiliência' em contexto escolar, o papel do orientador é fundamentalmente:",ops:["Identificar e remover todos os fatores de risco da vida do aluno","Fortalecer fatores de proteção (vínculos seguros, autoeficácia, habilidades socioemocionais) que permitam ao aluno adaptar-se positivamente às adversidades","Classificar os alunos em 'resilientes' e 'não resilientes' para encaminhamentos específicos","Garantir que o aluno não experiencie situações adversas durante o período escolar"],g:1,exp:"A resiliência não é ausência de adversidade, mas capacidade adaptativa construída socialmente. O orientador fortalece fatores protetores: vínculo escolar seguro, autoconhecimento, suporte familiar e redes de apoio — recursos que o aluno carrega consigo além da escola."},
        {n:27,q:"O conceito de 'zona de desenvolvimento proximal' (ZDP) de Vygotsky, quando aplicado à orientação educacional, implica que o orientador deve:",ops:["Trabalhar apenas com o que o aluno já sabe fazer de forma independente","Identificar o que o aluno pode alcançar com mediação qualificada e criar intervenções que operem nessa zona, expandindo o desenvolvimento potencial","Aguardar o desenvolvimento natural sem intervenção, respeitando o ritmo biológico","Comparar o aluno apenas com seus pares de mesma idade cronológica"],g:1,exp:"A ZDP define a distância entre o nível de desenvolvimento real (o que faz sozinho) e o potencial (o que faz com mediação). Intervir na ZDP é atuar onde o desenvolvimento está em curso — o orientador como mediador qualificado potencializa o crescimento do aluno."},
        {n:28,q:"A perspectiva da 'educação inclusiva' distingue-se da 'integração escolar' porque:",ops:["Educação inclusiva e integração são termos sinônimos na legislação brasileira","Na integração, o aluno se adapta à escola; na educação inclusiva, a escola se transforma para acolher todos os estudantes na sua diversidade","A integração oferece mais recursos especializados que a inclusão","A educação inclusiva se aplica apenas a alunos com deficiência; a integração é universal"],g:1,exp:"A integração é baseada no modelo médico: o aluno precisa se adaptar à escola existente. A educação inclusiva é baseada no modelo social: a escola deve se transformar para acolher a diversidade humana. É uma mudança paradigmática, não apenas terminológica."},
        {n:29,q:"Na orientação de alunos com TDAH, o orientador educacional deve compreender que a abordagem mais eficaz é:",ops:["Exclusivamente farmacológica, sendo a escola responsável apenas por encaminhar ao médico","Multimodal: combinando suporte pedagógico (adaptações, estratégias), intervenção comportamental, orientação familiar e, quando necessário, suporte clínico especializado","Baseada em punições consistentes para reduzir comportamentos hiperativos","Restrita ao encaminhamento para classe especial para evitar transtorno à turma regular"],g:1,exp:"O consenso científico internacional para TDAH indica abordagem multimodal: intervenção pedagógica (adaptações curriculares, estratégias de organização), suporte comportamental, psicoeducação familiar e, quando indicado, intervenção farmacológica — nunca isolada."},
        {n:30,q:"A construção da 'identidade profissional' do orientador educacional no Brasil foi historicamente marcada por tensão entre duas perspectivas. Qual par de perspectivas expressa corretamente essa tensão fundante?",ops:["Perspectiva burocrática vs. perspectiva informal","Perspectiva de ajustamento/controle social (adaptação do indivíduo ao sistema) vs. perspectiva emancipatória/transformadora (desenvolvimento crítico do sujeito)","Perspectiva médica vs. perspectiva jurídica","Perspectiva internacional vs. perspectiva nacional"],g:1,exp:"A história da orientação educacional no Brasil oscilou entre: a perspectiva liberal-funcionalista (ajustar o aluno ao sistema produtivo, herança dos anos 1940-60) e a perspectiva crítico-transformadora (influência de Paulo Freire e das pedagogias progressistas), que compreende o orientador como agente de emancipação e transformação social."},
      ]},
    ]
  },
];

function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// Converte questões dos simulados para o formato do quiz
function buildBancoSimulados(){
  const banco = [];
  EXAMES_DATA.forEach(sim=>{
    sim.secoes.forEach(sec=>{
      const n = sec.nome.toLowerCase();
      let disc = 'Português';
      if(n.includes('informáti') || n.includes('informati')) disc = 'Informática';
      else if(n.includes('específi') || n.includes('especifi') || n.includes('orientaç') || n.includes('orientac') || n.includes('desenvolvim') || n.includes('inclusão') || n.includes('inclusao') || n.includes('legislaç') || n.includes('fundamento') || n.includes('práticas') || n.includes('praticas') || n.includes('gestão') || n.includes('gestao')) disc = 'Específicos';
      const tema = sec.nome.replace(/\s*\(Q[\d–\-]+\)\s*$/, '').trim();
      sec.qs.forEach(q=>{
        banco.push({disc, tema, p:q.q, ops:q.ops, c:q.g, exp:q.exp});
      });
    });
  });
  return banco;
}

  renderFlash();
  renderMapa();
  renderExamesList();
  mostrarRelatorio();
  const dark = localStorage.getItem('orientadorDark');
  if(dark==='1') document.body.setAttribute('data-dark','');
});

function renderResumo(){
  const el = document.getElementById('sec-resumo');
  el.innerHTML = disciplinas.map((d,i)=>`
    <div class="disc-bloco">
      <div class="disc-header" onclick="toggleDisc(${i},this)" style="background:${d.cor}">
        ${d.nome} <span class="arrow">▼</span>
      </div>
      <div class="disc-topicos" id="disc-${i}">
        ${d.topicos.map(t=>`
          <div class="topico-item">
            <div style="flex:1">
              <div class="topico-nome">${t.t}</div>
              <div class="topico-desc">${t.d}</div>
            </div>
            <span class="freq-badge freq-${t.freq}">${t.freq.toUpperCase()}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleDisc(i,hdr){
  const el = document.getElementById('disc-'+i);
  const open = el.classList.toggle('open');
  hdr.classList.toggle('open',open);
}

function buildFlashDados(){
  flashDados=[];
  disciplinas.forEach(d=>{
    d.topicos.forEach(t=>{
      flashDados.push({disc:d.nome, termo:t.t, def:t.d, freq:t.freq});
    });
  });
  flashDeck=[...flashDados];
}

function renderFlashFiltro(){
  const sel = document.getElementById('flash-filtro');
  disciplinas.forEach(d=>{
    const op = document.createElement('option');
    op.value = d.nome;
    op.textContent = d.nome.replace(/^.{2}/,'');
    sel.appendChild(op);
  });
}

function filtrarFlash(){
  const v = document.getElementById('flash-filtro').value;
  flashDeck = v==='todos' ? [...flashDados] : flashDados.filter(f=>f.disc===v);
  flashIdx=0;
  renderFlash();
}

function shuffleFlash(){
  for(let i=flashDeck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [flashDeck[i],flashDeck[j]]=[flashDeck[j],flashDeck[i]];
  }
  flashIdx=0;
  document.getElementById('flash-inner').classList.remove('virado');
  renderFlash();
  toast('Embaralhado!');
}

function renderFlash(){
  if(!flashDeck.length) return;
  const c = flashDeck[flashIdx];
  document.getElementById('flash-termo').textContent = c.termo;
  document.getElementById('flash-def').textContent = c.def;
  document.getElementById('flash-prog').textContent = `${flashIdx+1} / ${flashDeck.length}`;
  document.getElementById('flash-inner').classList.remove('virado');
}

function virarCard(){
  document.getElementById('flash-inner').classList.toggle('virado');
}

function navFlash(d){
  flashIdx = (flashIdx+d+flashDeck.length)%flashDeck.length;
  renderFlash();
}

function falarCard(){
  const virado = document.getElementById('flash-inner').classList.contains('virado');
  const txt = virado ? document.getElementById('flash-def').textContent : document.getElementById('flash-termo').textContent;
  falar(txt);
}

function falar(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='pt-BR'; u.rate=_speechRate;
  speechSynthesis.speak(u);
}

function renderMapa(){
  const filtros = document.getElementById('mapa-filtros');
  const nomes = ['Todos',...disciplinas.map(d=>d.nome)];
  filtros.innerHTML = nomes.map((n,i)=>`<button class="${i===0?'ativo':''}" onclick="filtrarMapa(this,'${n}')">${n}</button>`).join('');
  _renderMapaGrid('Todos');
}

function filtrarMapa(btn,disc){
  document.querySelectorAll('.mapa-filtros button').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
  _renderMapaGrid(disc);
}

function _renderMapaGrid(disc){
  const grid = document.getElementById('mapa-grid');
  let items=[];
  disciplinas.forEach(d=>{
    if(disc==='Todos'||d.nome===disc){
      d.topicos.forEach(t=>items.push({disc:d.nome,t}));
    }
  });
  grid.innerHTML = items.map(({disc,t})=>`
    <div class="mapa-card" onclick="toast('${t.t}')">
      <div class="mc-disc">${disc.replace(/^.{2}/,'')}</div>
      <div class="mc-nome">${t.t}</div>
      <span class="freq-badge freq-${t.freq} mc-freq">${t.freq.toUpperCase()}</span>
    </div>
  `).join('');
}

function iniciarQuiz(){
  const filtro = document.getElementById('quiz-filtro').value;
  const bancoTotal = buildBancoSimulados();
  let banco = filtro==='todos' ? bancoTotal : bancoTotal.filter(q=>q.disc===filtro);
  // Embaralha ordem das questões
  for(let i=banco.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[banco[i],banco[j]]=[banco[j],banco[i]];}
  // Embaralha alternativas de cada questão e atualiza índice correto
  quizPerguntas = banco.slice(0,Math.min(20,banco.length)).map(q=>{
    const indices = shuffleArray([0,1,2,3].slice(0,q.ops.length));
    const newOps = indices.map(i=>q.ops[i]);
    const newC = indices.indexOf(q.c);
    return {...q, ops:newOps, c:newC};
  });
  quizIdx=0; quizCertas=0; quizErradas=0; respondeu=false;
  document.getElementById('quiz-placar').classList.remove('show');
  document.getElementById('quiz-box').style.display='block';
  renderQuestao();
}

function renderQuestao(){
  if(quizIdx>=quizPerguntas.length){encerrarQuiz();return;}
  respondeu=false;
  const q = quizPerguntas[quizIdx];
  document.getElementById('q-disc').textContent = q.disc;
  document.getElementById('q-tema').textContent = q.tema || '';
  document.getElementById('q-tema').style.display = q.tema ? '' : 'none';
  document.getElementById('q-num').textContent = `${quizIdx+1}/${quizPerguntas.length}`;
  document.getElementById('q-pergunta').textContent = q.p;
  document.getElementById('q-exp').classList.remove('show');
  document.getElementById('btn-prox-q').style.display='none';
  // vídeo relacionado
  const vid = q.tema ? (videoMap[q.tema]||'') : '';
  const wrap = document.getElementById('q-video-wrap');
  if(vid){
    wrap.style.display = 'block';
    wrap.innerHTML = `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${vid}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="border-radius:12px;display:block;margin-top:10px"></iframe>`;
  } else {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
  }
  const ops = document.getElementById('q-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="quiz-op" onclick="verificarResposta(${i})">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span> ${o}
    </button>
  `).join('');
}

function verificarResposta(idx){
  if(respondeu) return;
  respondeu=true;
  const q = quizPerguntas[quizIdx];
  const btns = document.querySelectorAll('.quiz-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.c) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  if(idx===q.c) quizCertas++; else quizErradas++;
  salvarRespostaQuiz(idx===q.c);
  document.getElementById('q-exp').textContent = q.exp;
  document.getElementById('q-exp').classList.add('show');
  document.getElementById('btn-prox-q').style.display='inline-block';
}

function proximaQuestao(){
  quizIdx++;
  renderQuestao();
}

function encerrarQuiz(){
  document.getElementById('quiz-box').style.display='none';
  const placar = document.getElementById('quiz-placar');
  placar.classList.add('show');
  const total = quizCertas+quizErradas;
  document.getElementById('placar-num').textContent = `${quizCertas}/${total}`;
  const pct = total?Math.round(quizCertas/total*100):0;
  document.getElementById('placar-label').textContent = `${pct}% de aproveitamento – ${quizCertas} certa(s), ${quizErradas} errada(s)`;
}

function salvarRespostaQuiz(acertou){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.quizTotal = (dados.quizTotal||0)+1;
  dados.quizCertas = (dados.quizCertas||0)+(acertou?1:0);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function renderExamesList(){
  const el = document.getElementById('exames-lista');
  el.innerHTML = EXAMES_DATA.map(e=>`
    <div class="exame-card">
      <div class="exame-info">
        <h3>${e.titulo}</h3>
        <p>${e.banca} · ${e.ano} · ${e.cargo}</p>
      </div>
      <button class="btn-iniciar" onclick="iniciarExame('${e.id}')">▶ Iniciar</button>
    </div>
  `).join('');
}

function iniciarExame(id){
  const original = EXAMES_DATA.find(e=>e.id===id);
  // Montar lista plana de questões com alternativas embaralhadas
  let flat = [];
  original.secoes.forEach(sec=>{
    sec.qs.forEach(q=>{
      const indices = shuffleArray([0,1,2,3]);
      const newOps = indices.map(i=>q.ops[i]);
      const newG = indices.indexOf(q.g);
      flat.push({...q, ops:newOps, g:newG, _secNome:sec.nome});
    });
  });
  flat = shuffleArray(flat);
  exAtual = {...original, _flat:flat, _total:flat.length};
  exQAtualFlat=0; exRespostas={}; exStarted=true;
  document.getElementById('exames-lista').style.display='none';
  const ativo = document.getElementById('exame-ativo');
  ativo.classList.add('show');
  document.getElementById('ex-titulo').textContent = original.titulo;
  document.getElementById('ex-info').textContent = `${original.banca} · ${original.ano} · Aleatório`;
  document.getElementById('ex-resultado').classList.remove('show');
  document.getElementById('ex-corpo').style.display='block';
  renderQuestaoExame();
}

function renderQuestaoExame(){
  const q = exAtual._flat[exQAtualFlat];
  document.getElementById('ex-sec-label').textContent = `Questão ${exQAtualFlat+1} de ${exAtual._total} · ${q._secNome||''}`;

  const pergEl = document.getElementById('ex-pergunta');
  pergEl.innerHTML = `<div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1"></span><button class="audio-btn" title="Ouvir pergunta">🔊</button></div>`;
  pergEl.querySelector('span').textContent = `Q${q.n}. ${q.q}`;
  pergEl.querySelector('.audio-btn').addEventListener('click', ()=>falar(`Q${q.n}. ${q.q}`));

  document.getElementById('ex-exp').classList.remove('show');
  document.getElementById('btn-ex-prox').style.display='none';

  const ops = document.getElementById('ex-ops');
  ops.innerHTML = q.ops.map((o,i)=>`
    <button class="ex-op" data-idx="${i}">
      <span style="font-weight:700;min-width:18px">${String.fromCharCode(65+i)})</span>
      <span style="flex:1"></span>
      <span class="audio-btn-op" data-audio="${i}" title="Ouvir alternativa">🔊</span>
    </button>
  `).join('');

  ops.querySelectorAll('.ex-op').forEach((btn, i)=>{
    btn.querySelector('span:nth-child(2)').textContent = q.ops[i];
    btn.addEventListener('click', (e)=>{
      if(e.target.classList.contains('audio-btn-op')) return;
      responderExame(i);
    });
    btn.querySelector('.audio-btn-op').addEventListener('click', (e)=>{
      e.stopPropagation();
      falar(q.ops[i]);
    });
  });
}

function responderExame(idx){
  const q = exAtual._flat[exQAtualFlat];
  if(exRespostas[exQAtualFlat]!==undefined) return;
  exRespostas[exQAtualFlat]=idx;
  const btns = document.querySelectorAll('.ex-op');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.g) b.classList.add('correta');
    else if(i===idx) b.classList.add('errada');
  });
  document.getElementById('ex-exp').textContent = q.exp;
  document.getElementById('ex-exp').classList.add('show');
  document.getElementById('btn-ex-prox').style.display='inline-block';
}

function avancarExame(){
  exQAtualFlat++;
  if(exQAtualFlat>=exAtual._total){finalizarExame();return;}
  renderQuestaoExame();
}

function finalizarExame(){
  document.getElementById('ex-corpo').style.display='none';
  let total=exAtual._total, certas=0;
  exAtual._flat.forEach((q,qi)=>{
    if(exRespostas[qi]===q.g) certas++;
  });
  document.getElementById('ex-res-num').textContent = `${certas}/${total}`;
  const pct=Math.round(certas/total*100);
  document.getElementById('ex-res-label').textContent = `${pct}% de aproveitamento`;
  document.getElementById('ex-resultado').classList.add('show');
  salvarResultadoSimulado(certas,total);
}

function salvarResultadoSimulado(certas,total){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  dados.simTotal = (dados.simTotal||0)+1;
  dados.simCertas = (dados.simCertas||0)+certas;
  dados.simQuestoes = (dados.simQuestoes||0)+total;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function voltarExames(){
  document.getElementById('exame-ativo').classList.remove('show');
  document.getElementById('exames-lista').style.display='grid';
  exAtual=null; exStarted=false;
}

function mostrarRelatorio(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0, qC=dados.quizCertas||0;
  const sT=dados.simTotal||0, sC=dados.simCertas||0, sQ=dados.simQuestoes||0;
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-num">${qT}</div><div class="stat-label">Quiz respondidas</div></div>
    <div class="stat-card"><div class="stat-num">${qT?Math.round(qC/qT*100):0}%</div><div class="stat-label">Acerto no Quiz</div></div>
    <div class="stat-card"><div class="stat-num">${sT}</div><div class="stat-label">Simulados feitos</div></div>
    <div class="stat-card"><div class="stat-num">${sQ?Math.round(sC/sQ*100):0}%</div><div class="stat-label">Acerto Simulados</div></div>
  `;
}

function exportarTXT(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
  const qT=dados.quizTotal||0,qC=dados.quizCertas||0;
  const sT=dados.simTotal||0,sC=dados.simCertas||0,sQ=dados.simQuestoes||0;
  const txt=`RELATÓRIO – Orientador Educacional
Gerado em: ${new Date().toLocaleString('pt-BR')}

QUIZ
  Questões respondidas: ${qT}
  Acertos: ${qC} (${qT?Math.round(qC/qT*100):0}%)
  Erros: ${qT-qC}

SIMULADOS
  Simulados realizados: ${sT}
  Questões respondidas: ${sQ}
  Acertos: ${sC} (${sQ?Math.round(sC/sQ*100):0}%)

---
Bons estudos! 🌸
`;
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
  a.download='relatorio-orientador.txt';
  a.click();
  toast('Exportado com sucesso!');
}

function limparDados(){
  if(!confirm('Limpar todo o histórico de respostas?')) return;
  localStorage.removeItem(STORAGE_KEY);
  mostrarRelatorio();
  toast('Dados apagados!');
}

function mudarTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  el.classList.add('ativo');
  document.querySelectorAll('.secao').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('sec-'+id).classList.add('ativa');
  if(id==='relatorio') mostrarRelatorio();
}

function setSpeed(v, btn){
  _speechRate = v;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function toggleDark(){
  const dark = document.body.hasAttribute('data-dark');
  dark ? document.body.removeAttribute('data-dark') : document.body.setAttribute('data-dark','');
  localStorage.setItem('orientadorDark', dark?'0':'1');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
